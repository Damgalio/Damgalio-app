<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Damgalio - Süper Admin Paneli</title>
  <!-- Supabase Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; }
    .panel-container { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 100%; max-width: 750px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; }
    h2 { margin-top: 0; margin-bottom: 5px; font-size: 22px; color: #fff; }
    p { color: #888; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 16px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    button:hover { background: #4338ca; }
    .logout-btn { background: #dc2626; float: right; }
    .logout-btn:hover { background: #b91c1c; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
    th { color: #888; font-weight: 600; }
    .date-input { padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; width: 150px; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // Supabase Proje Bilgileriniz
    const SB_URL = "https://rgtexozixcqrqhoepapr.supabase.co"; //[span_1](start_span)[span_1](end_span) Proje URL'niz otomatik eklendi
    const SB_KEY = "sb_publishable_bKdS0htkq5rqCLIaulu5lQ_8LEqnFvg"; // Ekrandan aldığınız anahtarı buraya yapıştırın
    const supabase = supabase.createClient(SB_URL, SB_KEY);

    var SUPER_ADMIN_EMAIL = "fjswybnb7s@privaterelay.appleid.com";

    window.onload = function() {
      if (localStorage.getItem("isAdmin") === "true") {
        loadAdminPanel();
      } else {
        showLogin();
      }
    };

    function showLogin() {
      document.getElementById("app").innerHTML = `
        <div class="card">
          <h2>Damgalio</h2>
          <p>Yönetim Paneli Girişi</p>
          <input type="email" id="em" value="fjswybnb7s@privaterelay.appleid.com" placeholder="E-posta">
          <input type="password" id="pw" placeholder="Şifre">
          <button style="width:100%; margin-top:10px;" onclick="login()">Giriş Yap</button>
        </div>
      `;
    }

    function login() {
      var email = document.getElementById("em").value.trim();
      if (email === SUPER_ADMIN_EMAIL) {
        localStorage.setItem("isAdmin", "true");
        loadAdminPanel();
      } else {
        alert("Yetkisiz e-posta!");
      }
    }

    function logout() {
      localStorage.removeItem("isAdmin");
      showLogin();
    }

    // İşletmeleri listeleyen ve süre güncelleyen ana panel
    async function loadAdminPanel() {
      var app = document.getElementById("app");
      app.className = "panel-container";
      
      app.innerHTML = `
        <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
        <h2>Süper Admin Paneli</h2>
        <p>Kayıtlı işletmeler ve abonelik bitiş süreleri (<code>expires_at</code>)</p>
        <div id="business-list">İşletmeler yükleniyor...</div>
      `;

      // Tablo adınız 'businesses' veya 'organizations' olabilir. Hangisiyse aşağıda güncelleyebilirsiniz.
      var { data, error } = await supabase.from('businesses').select('*');

      var listDiv = document.getElementById("business-list");

      if (error) {
        listDiv.innerHTML = '<p style="color:red;">Veriler çekilirken hata oluştu: ' + error.message + '<br><small>Tablo adınızın "businesses" olduğundan veya Supabase RLS politikalarının açık olduğundan emin olun.</small></p>';
        return;
      }

      if (!data || data.length === 0) {
        listDiv.innerHTML = '<p>Henüz sistemde kayıtlı işletme yok.</p>';
        return;
      }

      var html = `
        <table>
          <thead>
            <tr>
              <th>İşletme Adı</th>
              <th>Abonelik Bitiş Tarihi (expires_at)</th>
              <th>İşlem</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(item => {
        var expireVal = item.expires_at ? item.expires_at.split('T')[0] : '';
        var orgName = item.name || item.title || item.company_name || 'İsimsiz İşletme';
        html += `
          <tr>
            <td><strong>${orgName}</strong></td>
            <td><input type="date" class="date-input" id="date-${item.id}" value="${expireVal}"></td>
            <td><button onclick="updateExpiry('${item.id}')">Süreyi Güncelle</button></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      listDiv.innerHTML = html;
    }

    // Abonelik süresini güncelleyen fonksiyon
    async function updateExpiry(id) {
      var newDate = document.getElementById("date-" + id).value;
      
      var { error } = await supabase
        .from('businesses')
        .update({ expires_at: newDate })
        .eq('id', id);

      if (error) {
        alert("Güncelleme başarısız: " + error.message);
      } else {
        alert("Abonelik süresi başarıyla güncellendi!");
      }
    }
  </script>
</body>
</html>
