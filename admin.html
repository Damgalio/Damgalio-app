<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Damgalio Yönetici</title>
<style>
:root{--bg:#0d0d0d;--card:#181818;--line:#2a2a2a;--mut:#a8a8a8;--or:#ee6a37;--ye:#f7d44c}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.brand{color:var(--or);font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:4px 0}
p{color:var(--mut);line-height:1.5;margin:6px 0}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:#101010;color:#fff;font-size:16px}
button{padding:12px 16px;border:0;border-radius:12px;background:var(--or);color:#111;font-size:16px;font-weight:800}
button.full{width:100%;margin-top:12px}
button.ghost,a.btn{background:transparent;color:var(--mut);border:1px solid var(--line);padding:10px 14px;font-size:14px;border-radius:12px;font-weight:800}
button.warn{color:#ff9a90;border-color:#5a2420}
a.btn{display:inline-block;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--ye)}
.stat span{font-size:12px;color:var(--mut)}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.nm{font-weight:700}
.sub{font-size:13px;color:var(--mut);margin-top:4px}
.badge{border-radius:10px;padding:3px 8px;font-size:12px;font-weight:800;display:inline-block;margin:4px 6px 0 0}
.badge.ok{background:#1f4d33;color:#7be0a0}
.badge.wt{background:var(--ye);color:#111}
.badge.bad{background:#5a2420;color:#ff9a90}
.link{word-break:break-all;font-size:13px;color:var(--ye);margin:4px 0 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts input[type=date]{width:auto;flex:1;margin:0}
.tg{display:flex;gap:12px;align-items:center}
.tg input{width:24px;height:24px;margin:0}
.lb{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.good{border-color:#2f8f5b}
details.mng{margin-top:10px}
details.mng summary{font-weight:700;cursor:pointer;color:var(--ye)}
details.mng .acts{margin-top:10px}
.sep{border-top:1px solid var(--line);margin:14px 0}
.hist .hr{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line);color:var(--mut)}
.ok{color:#7be0a0}
.err{color:#ff7b7b}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var SB_URL = "https://rgtexozixcqrqhoepapr.supabase.co";
var SB_KEY = "sb_publishable_bKdS0htkq5rqCLIaulu5lQ_8LEqnFvg";
var app = document.getElementById("app");
var SK = "dmg_panel_rt";
var session = null, items = [], created = null, settings = {}, summary = null;

var KIND = { kurulum: "Kurulum", abonelik: "Aylık", diger: "Diğer" };
var METH = { havale: "Havale", kart: "Kart", nakit: "Nakit", diger: "Diğer" };

function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function saveSession(s){ session = s; try { localStorage.setItem(SK, s.refresh_token); } catch(e){} }
function clearSession(){ session = null; try { localStorage.removeItem(SK); } catch(e){} }
function savedRefresh(){ try { return localStorage.getItem(SK); } catch(e){ return null; } }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric" }) : "-"; }
function money(n){ return Number(n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " ₺"; }
function custLink(t){ return location.origin + "/s/" + t; }
function inviteLink(c){ return location.origin + "/kayit.html?k=" + c; }

function parseMoney(v){
  v = String(v == null ? "" : v).trim().replace(",", ".");
  if(v === "") return "";
  var n = Number(v);
  if(isNaN(n) || n < 0 || n > 1000000) return false;
  return n;
}

function normWa(v){
  var d = (v || "").replace(/\D/g, "");
  if(!d) return "";
  if(d.length === 11 && d.charAt(0) === "0") d = "90" + d.slice(1);
  else if(d.length === 10 && d.charAt(0) === "5") d = "90" + d;
  if(!/^[0-9]{10,15}$/.test(d)) return false;
  return d;
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); alert("Kopyalandı."); }
  catch(e){ prompt("Linki kopyala:", t); }
}

async function authCall(grant, body){
  var r = await fetch(SB_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  var j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.msg || ("Hata " + r.status));
  return j;
}

async function api(path, opts, retry){
  opts = opts || {};
  var r = await fetch(SB_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + session.access_token, "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(r.status === 401 && !retry){
    saveSession(await authCall("refresh_token", { refresh_token: session.refresh_token }));
    return api(path, opts, true);
  }
  var t = await r.text();
  if(!r.ok){ throw new Error(r.status + " " + t); }
  return t ? JSON.parse(t) : null;
}

function rpc(fn, body){ return api("rpc/" + fn, { method: "POST", body: body || {} }); }

function logout(){ clearSession(); showLogin(""); }

function showLogin(msg){
  app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>Yönetici Girişi</h1>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
    '<input type="email" id="em" placeholder="E-posta" autocomplete="username">' +
    '<input type="password" id="pw" placeholder="Şifre" autocomplete="current-password">' +
    '<button class="full" id="lg">Giriş Yap</button></div>';
  document.getElementById("lg").onclick = login;
}

function showMsg(title, text){
  app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>' + esc(title) + '</h1><p class="err">' + esc(text) + '</p><button class="ghost" id="lo">Çıkış</button></div>';
  document.getElementById("lo").onclick = logout;
}

async function login(){
  var em = document.getElementById("em").value.trim();
  var pw = document.getElementById("pw").value;
  var b = document.getElementById("lg");
  b.disabled = true; b.textContent = "Giriş yapılıyor...";
  try { saveSession(await authCall("password", { email: em, password: pw })); }
  catch(e){ showLogin(e.message === "Invalid login credentials" ? "E-posta veya şifre hatalı." : e.message); return; }
  await enter();
}

async function enter(){
  try {
    var ok = await rpc("is_admin");
    if(ok !== true){ showMsg("Yetkisiz", "Bu hesap yönetici değil."); return; }
    await loadList();
  } catch(e){ showMsg("Bir sorun oluştu", e.message); }
}

async function fetchItems(){
  var r = await rpc("admin_list_businesses");
  if(r.status !== "ok") throw new Error(r.status);
  items = r.items || [];
}
async function fetchSummary(){
  var r = await rpc("admin_payment_summary");
  if(r.status === "ok") summary = r;
}
async function fetchSettings(){
  var r = await rpc("admin_get_settings");
  if(r.status === "ok") settings = r.items || {};
}

async function loadList(){
  await fetchItems();
  await fetchSummary();
  await fetchSettings();
  render();
}

async function refresh(){
  await fetchItems();
  await fetchSummary();
  renderStats();
  renderList();
}

function render(){
  var opts = "";
  for(var i = 2; i <= 12; i++){ opts += '<option value="' + i + '"' + (i === 4 ? ' selected' : '') + '>' + i + ' damga</option>'; }
  app.innerHTML =
    '<div class="top"><div><div class="brand">Damgalio</div><h1>Yönetici</h1></div><button class="ghost" id="lo">Çıkış</button></div>' +
    '<div id="stats"></div>' +
    '<details class="card"><summary class="nm">Ödeme ayarları</summary>' +
    '<p class="sub">Bu bilgiler işletme panelinde ödeme bilgisi olarak görünür.</p>' +
    '<label class="lb">Hesap sahibi adı</label><input type="text" id="p_name" maxlength="80">' +
    '<label class="lb">IBAN (TR ile başlar)</label><input type="text" id="p_iban" maxlength="40" autocapitalize="characters">' +
    '<label class="lb">Ödeme notu</label><input type="text" id="p_note" maxlength="200">' +
    '<label class="lb">Kurulum ücreti (₺)</label><input type="text" id="p_setup" inputmode="decimal">' +
    '<label class="lb">Aylık ücret (₺)</label><input type="text" id="p_month" inputmode="decimal">' +
    '<label class="lb">İletişim WhatsApp (isteğe bağlı)</label><input type="text" id="p_wa" inputmode="tel" placeholder="0555 123 45 67">' +
    '<button class="full" id="p_save">Kaydet</button><p id="p_msg"></p></details>' +
    '<details class="card"><summary class="nm">Yeni işletme ekle</summary>' +
    '<label class="lb">İşletme adı</label><input type="text" id="n_name" maxlength="60" placeholder="Kahve Durağı">' +
    '<label class="lb">Ödül</label><input type="text" id="n_rw" maxlength="60" placeholder="Bir filtre kahve">' +
    '<label class="lb">Damga kuralı</label><input type="text" id="n_ru" maxlength="60" placeholder="Her kahve alışverişinde">' +
    '<label class="lb">Kaç damgada ödül</label><select id="n_nd">' + opts + '</select>' +
    '<label class="lb">Damgalar arası bekleme (dakika)</label><input type="number" id="n_cd" value="240" min="0" inputmode="numeric">' +
    '<label class="lb">Deneme süresi (gün). 0 yazarsan ödeme gelene kadar kapalı kalır.</label><input type="number" id="n_dy" value="30" min="0" inputmode="numeric">' +
    '<label class="tg" style="margin-top:14px"><input type="checkbox" id="n_ap" checked><span>Damga onayı iste (önerilir)</span></label>' +
    '<button class="full" id="n_go">Oluştur</button></details>' +
    '<div id="created"></div>' +
    '<input type="text" id="q" placeholder="İşletme ara">' +
    '<div class="card" id="list"></div>';
  document.getElementById("lo").onclick = logout;
  document.getElementById("n_go").onclick = createBiz;
  document.getElementById("p_save").onclick = saveSettings;
  document.getElementById("q").oninput = renderList;
  document.getElementById("p_name").value = settings.pay_name || "";
  document.getElementById("p_iban").value = settings.pay_iban || "";
  document.getElementById("p_note").value = settings.pay_note || "";
  document.getElementById("p_setup").value = settings.pay_setup_fee || "";
  document.getElementById("p_month").value = settings.pay_monthly_fee || "";
  document.getElementById("p_wa").value = settings.contact_wa || "";
  renderStats();
  renderCreated();
  renderList();
}

function renderStats(){
  var el = document.getElementById("stats");
  if(!el) return;
  var a = 0, x = 0, w = 0;
  items.forEach(function(b){ if(b.active) a++; else x++; if(!b.claimed) w++; });
  var s = summary || { month_total: 0, total: 0, count: 0 };
  el.innerHTML = '<div class="stats"><div class="stat"><b>' + a + '</b><span>Açık</span></div>' +
    '<div class="stat"><b>' + x + '</b><span>Kapalı</span></div>' +
    '<div class="stat"><b>' + w + '</b><span>Davet bekleyen</span></div></div>' +
    '<div class="stats" style="margin-bottom:12px"><div class="stat"><b>' + esc(money(s.month_total)) + '</b><span>Bu ay tahsilat</span></div>' +
    '<div class="stat"><b>' + esc(money(s.total)) + '</b><span>Toplam tahsilat</span></div>' +
    '<div class="stat"><b>' + s.count + '</b><span>Ödeme sayısı</span></div></div>';
}

async function saveSettings(){
  var name = document.getElementById("p_name").value.trim();
  var iban = document.getElementById("p_iban").value.replace(/\s/g, "").toUpperCase();
  var note = document.getElementById("p_note").value.trim();
  var setup = parseMoney(document.getElementById("p_setup").value);
  var month = parseMoney(document.getElementById("p_month").value);
  var wa = normWa(document.getElementById("p_wa").value);
  var msg = document.getElementById("p_msg");
  if(iban && !/^TR[0-9]{24}$/.test(iban)){ alert("IBAN geçersiz. TR ile başlayıp toplam 26 karakter olmalı."); return; }
  if(setup === false || month === false){ alert("Ücret geçersiz. Örnek: 450"); return; }
  if(wa === false){ alert("WhatsApp numarası geçersiz. Örnek: 0555 123 45 67"); return; }
  var btn = document.getElementById("p_save");
  btn.disabled = true; btn.textContent = "Kaydediliyor...";
  var pairs = [
    ["pay_name", name], ["pay_iban", iban], ["pay_note", note],
    ["pay_setup_fee", String(setup)], ["pay_monthly_fee", String(month)], ["contact_wa", wa]
  ];
  try {
    for(var i = 0; i < pairs.length; i++){
      var r = await rpc("admin_set_setting", { p_key: pairs[i][0], p_value: pairs[i][1] });
      if(r.status !== "ok") throw new Error(pairs[i][0] + ": " + r.status);
      settings[pairs[i][0]] = pairs[i][1];
    }
    msg.className = "ok"; msg.textContent = "Kaydedildi.";
    renderList();
  } catch(e){
    msg.className = "err"; msg.textContent = e.message;
  }
  btn.disabled = false; btn.textContent = "Kaydet";
}

function bindCopy(root){
  root.querySelectorAll("button[data-copy]").forEach(function(b){
    b.onclick = function(){ copyText(b.getAttribute("data-copy")); };
  });
}

function renderCreated(){
  var box = document.getElementById("created");
  if(!created){ box.innerHTML = ""; return; }
  var cl = custLink(created.tag_code), il = inviteLink(created.claim_code);
  var wa = "https://wa.me/?text=" + encodeURIComponent("Merhaba! Damgalio işletme hesabını açmak için bu linke gir: " + il);
  box.innerHTML = '<div class="card good"><div class="nm">&#10003; ' + esc(created.name) + ' oluşturuldu</div>' +
    '<p class="sub">Hizmet bitiş tarihi: ' + esc(fmtDate(created.paid_until)) + '</p>' +
    '<p class="sub">1) Davet linki: işletme sahibine gönder, hesabını kendisi açsın.</p>' +
    '<div class="link">' + esc(il) + '</div>' +
    '<div class="acts"><button class="ghost" data-copy="' + esc(il) + '">Davet linkini kopyala</button>' +
    '<a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp ile gönder</a></div>' +
    '<p class="sub" style="margin-top:14px">2) Müşteri linki: NFC damgaya yazılacak adres.</p>' +
    '<div class="link">' + esc(cl) + '</div>' +
    '<div class="acts"><button class="ghost" data-copy="' + esc(cl) + '">Müşteri linkini kopyala</button></div></div>';
  bindCopy(box);
}

function stBadge(b){
  if(b.suspended) return '<span class="badge bad">Durduruldu</span>';
  var d = Math.ceil((new Date(b.paid_until).getTime() - Date.now()) / 86400000);
  if(d <= 0) return '<span class="badge bad">Süresi doldu</span>';
  return '<span class="badge ' + (d <= 7 ? 'wt' : 'ok') + '">' + d + ' gün kaldı</span>';
}

function renderList(){
  var qn = document.getElementById("q").value.toLowerCase().trim();
  var rows = items.filter(function(b){
    return !qn || (b.name || "").toLowerCase().indexOf(qn) > -1 || (b.pay_ref || "").toLowerCase().indexOf(qn) > -1;
  });
  var list = document.getElementById("list");
  if(!rows.length){ list.innerHTML = '<p>İşletme bulunamadı.</p>'; return; }
  list.innerHTML = '<div class="nm">İşletmeler (' + items.length + ')</div>' + rows.map(function(b){
    var id = esc(b.id);
    return '<div class="item"><div class="nm">' + esc(b.name) + '</div>' +
      '<div>' + stBadge(b) + (b.claimed ? '' : '<span class="badge wt">Davet bekliyor</span>') + '</div>' +
      '<div class="sub">Bitiş: ' + esc(fmtDate(b.paid_until)) + ' &middot; ' + b.customers + ' müşteri &middot; ' + b.stamps + ' damga &middot; ' + b.tickets + ' bilet</div>' +
      '<details class="mng"><summary>Yönet</summary>' +
      '<div class="sub">Referans kodu: <b style="color:#fff">' + esc(b.pay_ref) + '</b> &middot; Son ödeme: ' + (b.last_paid_at ? esc(fmtDate(b.last_paid_at)) : 'yok') + ' &middot; Toplam: ' + esc(money(b.paid_total)) + '</div>' +
      '<div class="sep"></div><div class="nm">Ödeme al</div>' +
      '<label class="lb">Ödeme türü</label><select id="pk_' + id + '" data-kind="' + id + '"><option value="kurulum">Kurulum</option><option value="abonelik">Aylık</option><option value="diger">Diğer</option></select>' +
      '<label class="lb">Tutar (₺)</label><input type="text" id="pa_' + id + '" inputmode="decimal" value="' + esc(settings.pay_setup_fee || "") + '">' +
      '<label class="lb">Eklenecek gün</label><input type="number" id="pd_' + id + '" value="30" min="0" inputmode="numeric">' +
      '<label class="lb">Yöntem</label><select id="pm_' + id + '"><option value="havale">Havale</option><option value="kart">Kart</option><option value="nakit">Nakit</option><option value="diger">Diğer</option></select>' +
      '<label class="lb">Not (isteğe bağlı)</label><input type="text" id="pn_' + id + '" maxlength="200">' +
      '<button class="full" data-act="pay" data-id="' + id + '">Ödemeyi kaydet</button>' +
      '<div class="acts"><button class="ghost" data-act="hist" data-id="' + id + '">Ödeme geçmişi</button></div>' +
      '<div class="hist" id="h_' + id + '"></div>' +
      '<div class="sep"></div><div class="nm">Süre ve durum</div>' +
      '<div class="acts"><button class="ghost" data-act="ext" data-id="' + id + '" data-v="30">+30 gün</button>' +
      '<button class="ghost" data-act="ext" data-id="' + id + '" data-v="90">+90 gün</button>' +
      '<button class="ghost" data-act="ext" data-id="' + id + '" data-v="365">+365 gün</button></div>' +
      '<div class="acts"><input type="date" id="d_' + id + '"><button class="ghost" data-act="date" data-id="' + id + '">Tarihi ayarla</button></div>' +
      '<div class="acts"><button class="ghost warn" data-act="susp" data-id="' + id + '">' + (b.suspended ? 'Yeniden aç' : 'Durdur') + '</button>' +
      '<button class="ghost" data-copy="' + esc(custLink(b.tag_code)) + '">Müşteri linki</button>' +
      (!b.claimed && b.claim_code ? '<button class="ghost" data-copy="' + esc(inviteLink(b.claim_code)) + '">Davet linki</button>' : '') +
      '</div></details></div>';
  }).join("");
  bindCopy(list);
  list.querySelectorAll("button[data-act]").forEach(function(b){
    b.onclick = function(){ onAct(b); };
  });
  list.querySelectorAll("select[data-kind]").forEach(function(s){
    s.onchange = function(){
      var id = s.getAttribute("data-kind");
      var amt = document.getElementById("pa_" + id);
      var v = s.value === "kurulum" ? settings.pay_setup_fee : (s.value === "abonelik" ? settings.pay_monthly_fee : "");
      amt.value = v || "";
    };
  });
}

async function doRpc(fn, body){
  try {
    var r = await rpc(fn, body);
    if(r.status !== "ok"){ alert("İşlem yapılamadı: " + r.status); return; }
    await refresh();
  } catch(e){ alert(e.message); }
}

async function showHist(id){
  var box = document.getElementById("h_" + id);
  box.innerHTML = '<p class="sub">Yükleniyor...</p>';
  try {
    var r = await rpc("admin_list_payments", { p_id: id });
    if(r.status !== "ok"){ box.innerHTML = '<p class="err">' + esc(r.status) + '</p>'; return; }
    var its = r.items || [];
    if(!its.length){ box.innerHTML = '<p class="sub">Henüz ödeme kaydı yok.</p>'; return; }
    box.innerHTML = its.map(function(p){
      return '<div class="hr"><span>' + esc(fmtDate(p.paid_at)) + ' &middot; ' + esc(KIND[p.kind] || p.kind) + ' &middot; ' + esc(METH[p.method] || p.method) +
        (p.days_added ? ' &middot; +' + p.days_added + ' gün' : '') + (p.note ? ' &middot; ' + esc(p.note) : '') + '</span><b style="color:#fff">' + esc(money(p.amount)) + '</b></div>';
    }).join("");
  } catch(e){ box.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}

function onAct(b){
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), v = b.getAttribute("data-v");
  var it = items.filter(function(x){ return x.id === id; })[0];
  if(!it) return;
  if(act === "pay"){
    var kind = document.getElementById("pk_" + id).value;
    var amt = parseMoney(document.getElementById("pa_" + id).value);
    var days = Number(document.getElementById("pd_" + id).value || 0);
    var method = document.getElementById("pm_" + id).value;
    var note = document.getElementById("pn_" + id).value;
    if(amt === "" || amt === false){ alert("Geçerli bir tutar yaz. Örnek: 450"); return; }
    if(!(days >= 0 && days <= 3650) || Math.floor(days) !== days){ alert("Gün sayısı 0 ile 3650 arasında tam sayı olmalı."); return; }
    var q = it.name + " için " + money(amt) + " ödeme kaydedilsin mi?" + (days > 0 ? " " + days + " gün eklenecek ve durdurulmuşsa yeniden açılacak." : "");
    if(confirm(q)) doRpc("admin_add_payment", { p_id: id, p_kind: kind, p_amount: amt, p_days: days, p_method: method, p_note: note });
  } else if(act === "hist"){
    showHist(id);
  } else if(act === "ext"){
    if(confirm(it.name + " için " + v + " gün eklensin mi?")) doRpc("admin_extend_business", { p_id: id, p_days: Number(v) });
  } else if(act === "date"){
    var dv = document.getElementById("d_" + id).value;
    if(!dv){ alert("Önce bir tarih seç."); return; }
    if(confirm(it.name + " bitiş tarihi " + dv + " olarak ayarlansın mı?")) doRpc("admin_set_until", { p_id: id, p_date: dv });
  } else if(act === "susp"){
    var nv = !it.suspended;
    var q2 = it.name + (nv ? " durdurulsun mu? Müşteri sayfası ve işletme paneli kapanır." : " yeniden açılsın mı?");
    if(confirm(q2)) doRpc("admin_set_suspended", { p_id: id, p_suspended: nv });
  }
}

async function createBiz(){
  var name = document.getElementById("n_name").value.trim();
  if(name.length < 2){ alert("İşletme adı en az 2 karakter olmalı."); return; }
  var cd = document.getElementById("n_cd").value;
  var dy = document.getElementById("n_dy").value;
  var body = {
    p_name: name,
    p_reward: document.getElementById("n_rw").value,
    p_rule: document.getElementById("n_ru").value,
    p_needed: Number(document.getElementById("n_nd").value),
    p_approval: document.getElementById("n_ap").checked,
    p_cooldown: cd === "" ? 240 : Number(cd),
    p_days: dy === "" ? 30 : Number(dy)
  };
  var btn = document.getElementById("n_go");
  btn.disabled = true; btn.textContent = "Oluşturuluyor...";
  try {
    var r = await rpc("admin_create_business", body);
    if(r.status !== "ok"){ alert("Oluşturulamadı: " + r.status); btn.disabled = false; btn.textContent = "Oluştur"; return; }
    created = r;
    await loadList();
  } catch(e){
    alert(e.message);
    btn.disabled = false; btn.textContent = "Oluştur";
  }
}

(async function(){
  var rt = savedRefresh();
  if(!rt){ showLogin(""); return; }
  app.innerHTML = '<p>Yükleniyor...</p>';
  try { saveSession(await authCall("refresh_token", { refresh_token: rt })); }
  catch(e){ clearSession(); showLogin("Oturum süresi doldu, tekrar giriş yap."); return; }
  await enter();
})();
</script>
