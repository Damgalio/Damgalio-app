<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Damgalio</title>
<style>
:root{--bg:#0d0d0d;--card:#181818;--line:#2a2a2a;--mut:#a8a8a8;--or:#ee6a37;--ye:#f7d44c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
.brand{color:var(--or);font-weight:800;font-size:20px;letter-spacing:.5px}
h1{font-size:24px;margin:12px 0 4px}
p{color:var(--mut);line-height:1.5;margin:8px 0}
.sub{font-size:13px;color:var(--mut)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 10px}
.dot{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:#111}
.dot.on{background:var(--or);border:2px solid var(--or)}
.dot.wait{border:2px dashed var(--or);animation:pulse 1.2s infinite}
.dot.gift{border:2px dashed var(--ye);font-size:22px;filter:grayscale(1);opacity:.6}
.dot.gift.on{background:var(--ye);border:2px solid var(--ye);filter:none;opacity:1}
.dot.pop{animation:pop .5s ease-out both}
.dot.gift.pop{animation:pop .6s ease-out .4s both}
.cnt{font-size:15px;color:var(--mut);margin:0 0 6px}
.cnt b{color:#fff;font-size:18px}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
.cf{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:fall linear both}
@media (prefers-reduced-motion:reduce){.dot.pop,.dot.gift.pop{animation:none}.cf{display:none}.live{animation:none}}
.rw{color:var(--ye);font-weight:700;margin:6px 0 2px}
.reward{background:var(--ye);color:#111;border-radius:14px;padding:14px;font-weight:800;margin-top:14px}
.rcheck{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.clk{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5ad1a0;margin-right:8px;vertical-align:middle;animation:pulse 1.2s infinite}
.rph{font-size:15px;color:#fff;margin-top:2px}
input[type=text],input[type=tel]{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:#101010;color:#fff;font-size:16px}
.chk{display:flex;gap:8px;text-align:left;color:var(--mut);font-size:13px;margin:10px 0}
.chk a,.sub a{color:#fff}
button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--or);color:#111;font-size:17px;font-weight:800;margin-top:8px}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-size:15px;padding:12px}
.links{display:flex;gap:8px;margin-top:18px}
a.lnk{flex:1;display:block;padding:12px;border:1px solid var(--line);border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.foot{margin-top:20px;font-size:12px;color:#666}
.err{color:#ff7b7b}
.err:empty{display:none}
#ferr{margin:6px 0;font-size:14px}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
var SB_URL = "https://rgtexozixcqrqhoepapr.supabase.co";
var SB_KEY = "sb_publishable_bKdS0htkq5rqCLIaulu5lQ_8LEqnFvg";
var app = document.getElementById("app");
var parts = location.pathname.split("/").filter(Boolean);
var slug = parts[0] === "s" ? decodeURIComponent(parts[1] || "") : "";
var brand = null;
var memToken = null;
var myPhone = "";
var pollTimer = null;
var cdTimer = null;
var deadline = 0;

try {
  for(var i = localStorage.length - 1; i >= 0; i--){
    var k = localStorage.key(i);
    if(k && k.indexOf("dmg_") === 0 && k !== "dmg_kv" && k !== "dmg_panel_rt") localStorage.removeItem(k);
  }
} catch(e){}

function getToken(){ return memToken; }
function setToken(t){ memToken = t; }
function hasConsent(){ try { return localStorage.getItem("dmg_kv") === "1"; } catch(e){ return false; } }
function setConsent(){ try { localStorage.setItem("dmg_kv", "1"); } catch(e){} }
function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function okUrl(u){ return typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u); }

function applyBrand(){
  if(brand && /^#[0-9a-fA-F]{6}$/.test(brand.color)){
    document.documentElement.style.setProperty("--or", brand.color);
  }
  if(brand && brand.name) document.title = brand.name;
}
function setBrand(b){ if(b){ brand = b; applyBrand(); } }

function shell(inner){
  var nm = brand && brand.name ? brand.name : "Damgalio";
  app.innerHTML = '<div class="brand">' + esc(nm) + '</div>' + inner + '<div class="foot">Damgalio ile çalışır</div>';
}

function links(){
  if(!brand) return "";
  var h = "";
  if(okUrl(brand.site)) h += '<a class="lnk" href="' + esc(brand.site) + '" target="_blank" rel="noopener">Web sitemiz</a>';
  if(okUrl(brand.ig)) h += '<a class="lnk" href="' + esc(brand.ig) + '" target="_blank" rel="noopener">Instagram</a>';
  return h ? '<div class="links">' + h + '</div>' : "";
}

function rewardLine(){
  return brand && brand.reward ? '<p class="rw">Ödül: ' + esc(brand.reward) + '</p>' : "";
}

function dots(n, need, wait, full, pop){
  var last = Math.min(n, need) - 1;
  var h = '<div class="dots">';
  for(var i = 0; i < need; i++){
    var cls = i < n ? 'on' : (wait && i === n ? 'wait' : '');
    if(pop && i === last) cls += ' pop';
    h += '<div class="dot ' + cls + '">' + (i < n ? '&#10003;' : '') + '</div>';
  }
  h += '<div class="dot gift ' + (full ? 'on' : '') + (full && pop ? ' pop' : '') + '">&#127873;</div>';
  h += '</div>';
  return h + '<div class="cnt"><b>' + Math.min(n, need) + '</b> / ' + need + ' damga</div>';
}

function confetti(){
  var cols = ["#f7d44c", "#ffffff", "#5ad1a0", "#6aa8ff", "#ff7b7b"];
  if(brand && /^#[0-9a-fA-F]{6}$/.test(brand.color)) cols.push(brand.color);
  for(var i = 0; i < 40; i++){
    var c = document.createElement("div");
    c.className = "cf";
    c.style.left = (Math.random() * 100) + "vw";
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (2 + Math.random() * 2) + "s";
    c.style.animationDelay = (Math.random() * 0.6) + "s";
    document.body.appendChild(c);
    (function(el){ setTimeout(function(){ el.remove(); }, 4800); })(c);
  }
}

function nowStr(){
  var d = new Date();
  function z(n){ return (n < 10 ? "0" : "") + n; }
  return z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds());
}

function fmtPhone(v){
  var d = String(v).replace(/\D/g, "");
  d = d.replace(/^0+/, "");
  if(d.indexOf("90") === 0) d = d.slice(2);
  d = d.replace(/^0+/, "");
  d = d.slice(0, 10);
  var o = d.slice(0, 3);
  if(d.length > 3) o += " " + d.slice(3, 6);
  if(d.length > 6) o += " " + d.slice(6, 8);
  if(d.length > 8) o += " " + d.slice(8, 10);
  return o;
}

async function rpc(fn, body){
  var r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!r.ok){
    var t = ""; try { t = await r.text(); } catch(e){}
    throw new Error(r.status + " " + t);
  }
  return r.json();
}

function showError(e){
  try { console.error(e); } catch(x){}
  var off = typeof navigator !== "undefined" && navigator.onLine === false;
  shell('<h1>Bağlantı sorunu</h1><p>' +
    (off ? 'İnternet bağlantın yok gibi görünüyor.' : 'Şu an damganı ekleyemedik.') +
    ' Birkaç saniye sonra tekrar dene.</p><button id="retry">Tekrar dene</button>');
  document.getElementById("retry").onclick = function(){ location.reload(); };
}

function clearLogout(){ if(cdTimer){ clearInterval(cdTimer); cdTimer = null; } }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

function tick(){
  var left = Math.ceil((deadline - Date.now()) / 1000);
  if(left <= 0){ doLogout(); return; }
  var el = document.getElementById("cd");
  if(el) el.textContent = left;
  var ck = document.getElementById("clk");
  if(ck) ck.textContent = nowStr();
}

function armLogout(sec){
  clearLogout();
  deadline = Date.now() + sec * 1000;
  cdTimer = setInterval(tick, 1000);
}

document.addEventListener("visibilitychange", function(){
  if(!document.hidden && cdTimer) tick();
});

function doLogout(){
  clearLogout();
  stopPoll();
  memToken = null;
  myPhone = "";
  shell('<h1>Oturum kapandı</h1><p>Yeni damga için NFC damgaya telefonunu tekrar yaklaştır.</p><button id="again">Yeniden giriş</button>' + links());
  document.getElementById("again").onclick = function(){ location.reload(); };
}

function finish(h, sec){
  shell(h + links() +
    '<p class="sub" style="margin-top:16px">Güvenlik için <span id="cd">' + sec + '</span> sn sonra oturum kapanacak.</p>' +
    '<button class="ghost" id="out">Çıkış yap</button>');
  document.getElementById("out").onclick = doLogout;
  armLogout(sec);
}

function showForm(msg){
  var consent = hasConsent();
  var kvLink = '<a href="/gizlilik.html" target="_blank" rel="noopener">Aydınlatma metni</a>';
  shell('<h1>Damga kartın</h1><p>Telefon numaranı gir, damganı ekleyelim.</p>' + rewardLine() +
    (msg ? '<p class="err">' + msg + '</p>' : '') +
    '<input type="tel" id="ph" placeholder="Telefon: 5XX XXX XX XX" autocomplete="tel" inputmode="tel">' +
    '<input type="text" id="nm" placeholder="Adın (ilk kayıtta, isteğe bağlı)" autocomplete="given-name">' +
    (consent ? '<p class="sub">Telefon numaran damga kartın için saklanır. ' + kvLink + '</p>' :
      '<label class="chk"><input type="checkbox" id="kv"><span>Telefon numaramın damga kartımı bulmak için saklanmasını kabul ediyorum. ' + kvLink + '</span></label>') +
    '<div class="err" id="ferr"></div>' +
    '<button id="go">Damgayı Ekle</button>' + links());
  var phEl = document.getElementById("ph");
  phEl.oninput = function(){ phEl.value = fmtPhone(phEl.value); };
  document.getElementById("go").onclick = submit;
}

async function submit(){
  var ferr = document.getElementById("ferr");
  var kv = document.getElementById("kv");
  if(kv && !kv.checked){ ferr.textContent = "Devam etmek için onay kutusunu işaretle."; return; }
  var ph = document.getElementById("ph").value.replace(/\D/g, "");
  if(ph.length !== 10){ ferr.textContent = "Telefon numarası 10 haneli olmalı. Örnek: 555 123 45 67"; return; }
  ferr.textContent = "";
  myPhone = ph;
  var nm = document.getElementById("nm").value;
  var btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = "Ekleniyor...";
  try {
    var r = await rpc("add_stamp", { p_slug: slug, p_phone: ph, p_name: nm });
    if(r.status !== "bad_phone" && r.status !== "not_found") setConsent();
    showResult(r);
  } catch(e){ showError(e); }
}

function startPoll(){
  stopPoll();
  var n = 0;
  pollTimer = setInterval(async function(){
    n++;
    if(n > 200){
      stopPoll();
      shell('<h1>Onay gecikti</h1><p>Personele haber ver ya da NFC damgaya tekrar dokun.</p>');
      return;
    }
    try {
      var r = await rpc("stamp_status", { p_slug: slug, p_token: getToken() });
      if(r.status === "approved"){
        stopPoll();
        r.status = "ok";
        showResult(r);
      } else if(r.status === "rejected"){
        stopPoll();
        setBrand(r.brand);
        finish('<h1>Damga onaylanmadı</h1>' + dots(r.stamps, r.needed, false, false) +
          '<p>Bir yanlışlık olduğunu düşünüyorsan personele sor.</p>', 20);
      }
    } catch(e){}
  }, 3000);
}

function startRewardPoll(){
  stopPoll();
  var n = 0;
  pollTimer = setInterval(async function(){
    n++;
    if(n > 30){ stopPoll(); return; }
    try {
      var r = await rpc("stamp_status", { p_slug: slug, p_token: getToken() });
      if(r.stamps < r.needed){
        stopPoll();
        setBrand(r.brand);
        finish('<h1>Ödülün kullanıldı</h1>' + dots(r.stamps, r.needed, false, false) + rewardLine() +
          '<p>Yeni damga kartın başladı. Afiyet olsun!</p>', 20);
      }
    } catch(e){}
  }, 5000);
}

function showResult(r){
  if(r.token) setToken(r.token);
  setBrand(r.brand);
  var s = r.status;
  if(s === "not_found"){ shell('<h1>Geçersiz damga</h1><p>Bu damga bulunamadı. İşletmeye haber ver.</p>'); return; }
  if(s === "need_info"){ showForm(""); return; }
  if(s === "bad_phone"){ showForm("Telefon numarası geçersiz. 10 haneli gir, örnek: 555 123 45 67"); return; }
  if(s === "pending"){
    clearLogout();
    shell('<h1>Onay bekleniyor</h1>' + dots(r.stamps, r.needed, true, false) + rewardLine() +
      '<p>Personel onaylayınca damgan otomatik eklenecek. Bu sayfayı açık tut.</p>' + links());
    startPoll();
    return;
  }
  var full = r.stamps >= r.needed;
  var title, note;
  if(full){
    title = s === "ok" ? "Tebrikler! Ödülün hazır" : "Ödülün hazır!";
    note = "Kasada bu ekranı göster.";
  } else if(s === "cooldown"){
    title = "Damgan zaten eklendi";
    note = "Yeni damga için " + r.wait_minutes + " dakika sonra tekrar dene.";
  } else {
    title = "Damga eklendi";
    note = "Ödüle " + (r.needed - r.stamps) + " damga kaldı.";
  }
  var h = '<h1>' + title + '</h1>' + dots(r.stamps, r.needed, false, full, s === "ok") + rewardLine() + '<p>' + note + '</p>';
  if(full){
    h += '<div class="reward">&#127873; ' + esc(brand && brand.reward ? brand.reward : "Ödül") + '</div>';
    h += '<div class="rcheck"><div class="clk"><span class="live"></span><span id="clk">' + nowStr() + '</span></div>';
    if(myPhone.length === 10) h += '<div class="rph">Numaran: &bull;&bull;&bull; &bull;&bull;&bull; ' + myPhone.slice(6, 8) + ' ' + myPhone.slice(8, 10) + '</div>';
    h += '<div class="sub">Saat akıyorsa ekran canlıdır.</div></div>';
  }
  finish(h, full ? 120 : 20);
  if(full) startRewardPoll(); else stopPoll();
  if(full && s === "ok") confetti();
}

(async function(){
  if(!slug){
    shell('<h1>Damga kartın burada</h1><p>Damga eklemek için işletmedeki NFC damgaya telefonunu yaklaştır.</p>');
    return;
  }
  shell('<p>Yükleniyor...</p>');
  try { showResult(await rpc("add_stamp", { p_slug: slug })); }
  catch(e){ showError(e); }
})();
</script>
</body>
</html>
