<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasa">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1715" media="(prefers-color-scheme: dark)">
<title>Masalio Kasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F1E7;
  --bg-2: #EFE8DA;
  --surface: #FFFDF8;
  --surface-2: #FBF6EC;
  --ink: #12231F;
  --ink-2: #3E504C;
  --muted: #74837F;
  --line: #E4DACA;
  --line-2: #D6CAB6;
  --accent: #E8612C;
  --accent-ink: #B8461A;
  --accent-soft: #FBE3D6;
  --on-accent: #FFFFFF;
  --teal: #24504C;
  --teal-soft: #DDEAE6;
  --sun: #F2C94C;
  --sun-soft: #FCF1CC;
  --good: #1E7F55;
  --good-soft: #DCF1E6;
  --warn: #A86B00;
  --warn-soft: #FBEFD2;
  --bad: #B93A26;
  --bad-soft: #F9E0DA;
  --shadow: 0 1px 0 rgba(18, 35, 31, .04), 0 10px 30px -18px rgba(18, 35, 31, .35);
  --shadow-lg: 0 30px 80px -30px rgba(18, 35, 31, .45);
  --scrim: rgba(18, 35, 31, .38);
  --chart-grid: #E9E1D2;
  --seg-on: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --tab-h: 64px;
  --hdr-h: 60px;
  color-scheme: light;
}
[hidden] {
  display: none !important;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1715;
    --bg-2: #10201D;
    --surface: #14231F;
    --surface-2: #182A26;
    --ink: #F1ECE2;
    --ink-2: #C3CDC9;
    --muted: #8D9C98;
    --line: #243631;
    --line-2: #2F443E;
    --accent: #F0743F;
    --accent-ink: #F59A70;
    --accent-soft: #3A2117;
    --on-accent: #1A0E08;
    --teal: #8FC3B8;
    --teal-soft: #1C3530;
    --sun: #F2CF5B;
    --sun-soft: #3A3115;
    --good: #5BCB95;
    --good-soft: #15352A;
    --warn: #F0BE55;
    --warn-soft: #3A2E12;
    --bad: #F08A76;
    --bad-soft: #3D1C17;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -18px rgba(0, 0, 0, .7);
    --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .55);
    --chart-grid: #22342F;
    --seg-on: #2B423C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1715;
  --bg-2: #10201D;
  --surface: #14231F;
  --surface-2: #182A26;
  --ink: #F1ECE2;
  --ink-2: #C3CDC9;
  --muted: #8D9C98;
  --line: #243631;
  --line-2: #2F443E;
  --accent: #F0743F;
  --accent-ink: #F59A70;
  --accent-soft: #3A2117;
  --on-accent: #1A0E08;
  --teal: #8FC3B8;
  --teal-soft: #1C3530;
  --sun: #F2CF5B;
  --sun-soft: #3A3115;
  --good: #5BCB95;
  --good-soft: #15352A;
  --warn: #F0BE55;
  --warn-soft: #3A2E12;
  --bad: #F08A76;
  --bad-soft: #3D1C17;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -18px rgba(0, 0, 0, .7);
  --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, .8);
  --scrim: rgba(0, 0, 0, .55);
  --chart-grid: #22342F;
  --seg-on: #2B423C;
  color-scheme: dark;
}
/* Damgalio Kasa
   Düzen: üstte durum çubuğu ve çağrı şeridi; masa ızgarası; masa seçilince ürünler + adisyon.
   Telefonda adisyon alttan açılan çekmecede, tablette sağda sabit. */
:root {
  --top-h: 64px;
  --tile: 132px;
}
[hidden] {
  display: none !important;
}
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3 {
  margin: 0;
  font-family: var(--font-display);
  line-height: 1.12;
  letter-spacing: -.01em;
}
h1 {
  font-size: 28px;
  font-weight: 800;
}
h2 {
  font-size: 20px;
  font-weight: 800;
}
h3 {
  font-size: 16px;
  font-weight: 700;
}
p {
  margin: 0;
}
a {
  color: var(--accent-ink);
}
svg {
  flex: none;
}
.num {
  font-variant-numeric: tabular-nums;
}
.mono {
  font-family: var(--font-mono);
}
.muted {
  color: var(--muted);
}
.ink2 {
  color: var(--ink-2);
}
.small {
  font-size: 13px;
}
.tiny {
  font-size: 11.5px;
}
.ell {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.grow {
  flex: 1;
  min-width: 0;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.row.wrap {
  flex-wrap: wrap;
}
.between {
  justify-content: space-between;
}
.stack {
  display: grid;
  gap: 12px;
}
.eyebrow {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}

/* ---------- düğmeler ---------- */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .08s ease, background .15s ease, opacity .15s ease;
  user-select: none;
}
.btn:active:not(:disabled) {
  transform: scale(.97);
}
.btn:disabled {
  opacity: .45;
  cursor: default;
}
.btn svg {
  width: 19px;
  height: 19px;
}
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-2);
}
.btn.soft {
  background: var(--bg-2);
  color: var(--ink);
}
.btn.dark {
  background: var(--ink);
  color: var(--surface);
}
.btn.good {
  background: var(--good);
  color: #fff;
}
.btn.danger {
  background: var(--bad-soft);
  color: var(--bad);
}
.btn.sm {
  min-height: 38px;
  padding: 7px 13px;
  font-size: 14px;
  border-radius: 12px;
}
.btn.xs {
  min-height: 32px;
  padding: 5px 10px;
  font-size: 13px;
  border-radius: 10px;
}
.btn.xl {
  min-height: 58px;
  padding: 14px 22px;
  font-size: 18px;
  border-radius: 18px;
}
.btn.block {
  width: 100%;
}
.icon-btn {
  position: relative;
  width: 44px;
  height: 44px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  color: var(--ink);
  flex: none;
}
.icon-btn svg {
  width: 20px;
  height: 20px;
}
.icon-btn.sm {
  width: 36px;
  height: 36px;
  border-radius: 11px;
}
.icon-btn.sm svg {
  width: 17px;
  height: 17px;
}
.icon-btn.on {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.icon-btn:disabled {
  opacity: .4;
}
.icon-btn .dot {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 10.5px;
  font-weight: 800;
  line-height: 18px;
}
.link-btn {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent-ink);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ---------- form ---------- */
.field {
  display: grid;
  gap: 6px;
}
.field label,
.lbl {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
}
.input,
.textarea {
  width: 100%;
  min-height: 48px;
  padding: 11px 14px;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.textarea {
  min-height: 120px;
  resize: vertical;
  line-height: 1.5;
}
.input:focus,
.textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.input.bad {
  border-color: var(--bad);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent);
}
.input::placeholder,
.textarea::placeholder {
  color: var(--muted);
}
.hint {
  color: var(--muted);
  font-size: 12.5px;
}
.seg {
  display: inline-flex;
  padding: 4px;
  gap: 2px;
  border-radius: 14px;
  background: var(--bg-2);
}
.seg button {
  min-height: 38px;
  padding: 6px 14px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--ink-2);
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] {
  background: var(--seg-on);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 30px;
  flex: none;
}
.switch input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  cursor: pointer;
}
.switch span {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background: var(--line-2);
  transition: background .2s ease;
  pointer-events: none;
}
.switch span::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  transition: transform .2s ease;
}
.switch input:checked + span {
  background: var(--good);
}
.switch input:checked + span::after {
  transform: translateX(20px);
}
.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  background: var(--surface);
  overflow: hidden;
}
.stepper button {
  width: 46px;
  height: 46px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 22px;
  font-weight: 700;
}
.stepper button:active {
  background: var(--bg-2);
}
.stepper input {
  width: 58px;
  height: 46px;
  border: 0;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  background: transparent;
  text-align: center;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
  outline: none;
  -moz-appearance: textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 7px 14px;
  border: 1px solid var(--line-2);
  border-radius: 99px;
  background: var(--surface);
  color: var(--ink-2);
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
}
.chip b {
  min-width: 22px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink);
  font-size: 12px;
  text-align: center;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
}
.chip[aria-pressed="true"] b {
  background: color-mix(in srgb, var(--surface) 20%, transparent);
  color: var(--surface);
}
.chip.hot b {
  background: var(--accent);
  color: var(--on-accent);
}
.card {
  padding: 18px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
}
.empty {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 28px 12px;
  color: var(--muted);
  text-align: center;
}
.empty svg {
  width: 42px;
  height: 42px;
  color: var(--line-2);
}
.empty b {
  color: var(--ink);
  font-size: 15px;
}
.form-msg {
  font-size: 14px;
  font-weight: 600;
}
.form-msg.err {
  color: var(--bad);
}
.form-msg.ok {
  color: var(--good);
}

/* ---------- giriş / mesaj ekranları ---------- */
.gate {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.gate-box {
  width: min(420px, 100%);
  display: grid;
  gap: 18px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
}
.brand .logo {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--accent);
  color: var(--on-accent);
}
.brand .logo svg {
  width: 21px;
  height: 21px;
}
.brand small {
  padding: 3px 8px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--surface);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .12em;
}
.gate-card {
  display: grid;
  gap: 14px;
  padding: 22px;
  border-radius: var(--r-xl);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.gate .demo-go {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border: 1px dashed var(--line-2);
  border-radius: var(--r);
  background: transparent;
  color: var(--ink);
  text-align: left;
}
.gate .demo-go svg {
  width: 18px;
  height: 18px;
}
.boot {
  min-height: 100vh;
  display: grid;
  place-items: center;
}
.spin {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 4px dashed var(--accent);
  animation: rot 1.2s linear infinite;
}
.spin.sm {
  width: 22px;
  height: 22px;
  border-width: 3px;
}
@keyframes rot {
  to { transform: rotate(360deg); }
}

/* ---------- üst çubuk ---------- */
.demo-bar {
  padding: 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--teal);
  color: var(--surface);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  gap: 12px;
  justify-content: space-between;
}
.demo-bar a {
  color: inherit;
  font-weight: 800;
}
.top {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.3) blur(14px);
  backdrop-filter: saturate(1.3) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.top-in {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--top-h);
  padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
.top .brand {
  min-width: 0;
}
.top .brand .ttl {
  display: grid;
  min-width: 0;
  line-height: 1.15;
}
.top .brand .ttl b {
  font-size: 16px;
}
.top .brand .ttl span {
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
}
.clock {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.sum-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
}
.sum-pill svg {
  width: 18px;
  height: 18px;
  color: var(--good);
}
.sum-pill .lbl {
  color: var(--muted);
  font-size: 12px;
}
.sum-pill b {
  font-family: var(--font-display);
  font-size: 17px;
  white-space: nowrap;
}
.net {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 99px;
  background: var(--bad-soft);
  color: var(--bad);
  font-size: 12px;
  font-weight: 800;
}
.net svg {
  width: 15px;
  height: 15px;
}
.snd-hint {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px max(14px, env(safe-area-inset-left, 0px));
  background: var(--sun-soft);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  border-bottom: 1px solid var(--line);
}
.snd-hint svg {
  width: 18px;
  height: 18px;
  color: var(--warn);
}

/* ---------- çağrı şeridi ---------- */
.calls {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 12px max(14px, env(safe-area-inset-left, 0px));
  scrollbar-width: none;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.calls::-webkit-scrollbar {
  display: none;
}
.call {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 270px;
  padding: 10px 10px 10px 12px;
  border-radius: 18px;
  border: 2px solid var(--sun);
  background: var(--sun-soft);
  animation: popIn .3s ease both;
}
.call.hesap {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.call.late {
  animation: popIn .3s ease both, callPulse 1.6s ease-in-out infinite;
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(-6px) scale(.98); }
  to { opacity: 1; transform: none; }
}
@keyframes callPulse {
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }
}
.call-no {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--ink);
  color: var(--surface);
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  flex: none;
}
.call .grow {
  display: grid;
  line-height: 1.25;
}
.call .grow b {
  font-size: 15px;
}
.call .grow span {
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 600;
}
.call .btn {
  min-height: 44px;
}

/* ---------- ana alan ---------- */
.main {
  padding: 16px max(14px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  max-width: 1400px;
  margin: 0 auto;
}
.tv-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.tv-stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  color: var(--ink-2);
  font-size: 13.5px;
}
.tv-stats b {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
}

/* ---------- masa ızgarası ---------- */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr));
  gap: 12px;
}
.tile {
  position: relative;
  display: grid;
  align-content: space-between;
  gap: 10px;
  min-height: 118px;
  padding: 14px;
  border-radius: 20px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease;
}
.tile:hover {
  box-shadow: var(--shadow);
}
.tile:active {
  transform: scale(.97);
}
.tile .t-no {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 800;
  line-height: .9;
}
.tile .t-no small {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
}
.tile .t-amt {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 800;
}
.tile .t-sub {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
}
.tile.free {
  border-style: dashed;
  border-color: var(--line-2);
  background: transparent;
}
.tile.free .t-no {
  color: var(--muted);
}
.tile.open {
  border-color: color-mix(in srgb, var(--teal) 55%, var(--line));
  background: color-mix(in srgb, var(--teal-soft) 55%, var(--surface));
}
.tile.open .t-amt {
  color: var(--teal);
}
.tile.calling {
  border: 2px solid var(--sun);
  background: var(--sun-soft);
  animation: tilePulse 1.6s ease-in-out infinite;
}
.tile.calling.hesap {
  border-color: var(--accent);
  background: var(--accent-soft);
}
@keyframes tilePulse {
  50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--sun) 35%, transparent); }
}
.tile .t-bell {
  position: absolute;
  top: 12px;
  right: 12px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 99px;
  background: var(--ink);
  color: var(--surface);
  font-size: 11px;
  font-weight: 800;
}
.tile .t-bell svg {
  width: 13px;
  height: 13px;
}
.tiles-empty {
  grid-column: 1 / -1;
}
.jump {
  position: fixed;
  left: 50%;
  top: 40%;
  z-index: 90;
  transform: translate(-50%, -50%);
  padding: 18px 28px;
  border-radius: 22px;
  background: var(--ink);
  color: var(--surface);
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 800;
  box-shadow: var(--shadow-lg);
  pointer-events: none;
}

/* ---------- masa ekranı ---------- */
.tbl-view {
  display: grid;
  gap: 16px;
}
.tv-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.tv-bar .back {
  padding-left: 10px;
}
.tv-bar .back svg {
  transform: rotate(180deg);
}
.tv-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.tv-title h1 {
  font-size: 30px;
}
.tbl-switch {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
  flex: 1;
  min-width: 0;
}
.tbl-switch::-webkit-scrollbar {
  display: none;
}
.tbl-switch button {
  flex: none;
  min-width: 44px;
  height: 40px;
  padding: 0 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-family: var(--font-display);
  font-weight: 800;
}
.tbl-switch button.open {
  border-color: color-mix(in srgb, var(--teal) 55%, var(--line));
  color: var(--teal);
}
.tbl-switch button.calling {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tbl-switch button[aria-current="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
}
.call-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  border: 2px solid var(--sun);
  background: var(--sun-soft);
  font-weight: 700;
}
.call-banner.hesap {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.call-banner svg {
  width: 20px;
  height: 20px;
}
.pos {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.pos > *,
.tbl-view > * {
  min-width: 0;
}
.tbl-view {
  grid-template-columns: minmax(0, 1fr);
}

/* ürünler */
.prods {
  display: grid;
  gap: 12px;
}
.p-search {
  position: relative;
}
.p-search svg {
  position: absolute;
  left: 14px;
  top: 50%;
  width: 19px;
  height: 19px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.p-search .input {
  padding-left: 44px;
  padding-right: 44px;
}
.p-search .clr {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: none;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.p-search .clr svg {
  position: static;
  transform: none;
}
.p-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 10px;
}
.prod {
  position: relative;
  display: grid;
  align-content: space-between;
  gap: 8px;
  min-height: 92px;
  padding: 12px 12px 11px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  transition: transform .08s ease, border-color .15s ease;
  user-select: none;
  -webkit-user-select: none;
}
.prod:active {
  transform: scale(.96);
}
.prod .pn {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prod .pp {
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}
.prod .pq {
  position: absolute;
  top: -7px;
  right: -7px;
  min-width: 26px;
  height: 26px;
  padding: 0 7px;
  border-radius: 13px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 13px;
  font-weight: 800;
  line-height: 26px;
  text-align: center;
  box-shadow: 0 0 0 3px var(--bg);
}
.prod.hit {
  animation: hit .35s ease;
}
@keyframes hit {
  30% { border-color: var(--accent); background: var(--accent-soft); }
}
.prod.new {
  border-style: dashed;
  border-color: var(--accent);
  background: var(--accent-soft);
}
.prod.new .pn {
  color: var(--accent-ink);
}
.man {
  display: grid;
  gap: 10px;
  padding: 14px;
  border-radius: 18px;
  border: 1px dashed var(--line-2);
}
.man-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 110px;
  gap: 8px;
}
.man-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-2);
}
.check input {
  width: 19px;
  height: 19px;
  margin: 0;
  accent-color: var(--accent);
}

/* adisyon */
.bill {
  display: flex;
  flex-direction: column;
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.bill-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 16px 18px 12px;
  border-bottom: 1px dashed var(--line-2);
}
.bill-h .eyebrow {
  margin-bottom: 2px;
}
.bill-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 10px;
  min-height: 120px;
}
.li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "n t" "q q";
  gap: 6px 10px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--line);
  transition: opacity .2s ease, background .2s ease;
}
.li:last-child {
  border-bottom: 0;
}
.li.tmp {
  opacity: .6;
}
.li.flash {
  background: var(--accent-soft);
  border-radius: 12px;
}
.li .ln {
  grid-area: n;
  font-weight: 700;
  min-width: 0;
}
.li .ln span {
  display: block;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
}
.li .lt {
  grid-area: t;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 800;
  text-align: right;
}
.li .lq {
  grid-area: q;
  display: flex;
  align-items: center;
  gap: 6px;
}
.qbtn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  font-size: 20px;
  font-weight: 800;
}
.qbtn svg {
  width: 17px;
  height: 17px;
}
.qbtn.del {
  color: var(--bad);
  border-color: color-mix(in srgb, var(--bad) 40%, var(--line));
}
.qbtn:active {
  background: var(--bg-2);
}
.qv {
  min-width: 34px;
  text-align: center;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
}
.bill-tot {
  padding: 14px 18px;
  border-top: 1px dashed var(--line-2);
  background: var(--surface-2);
}
.bill-tot .row {
  align-items: baseline;
}
.bill-tot .big {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.02em;
}
.bill-acts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding: 0 14px 14px;
  background: var(--surface-2);
}
.bill-acts .btn {
  flex-direction: column;
  gap: 4px;
  min-height: 62px;
  padding: 8px 4px;
  font-size: 12.5px;
}
.bill-pay {
  padding: 0 14px 14px;
  background: var(--surface-2);
}
.bill-empty {
  padding: 30px 14px;
}

/* telefonda alt adisyon çubuğu */
.billbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 45;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.billbar-in {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 640px;
  margin: 0 auto;
}
.billbar .bb-sum {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  min-height: 58px;
  border: 1px solid var(--line-2);
  border-radius: 18px;
  background: var(--surface);
  color: var(--ink);
  text-align: left;
}
.bb-sum .bb-n {
  display: grid;
  place-items: center;
  min-width: 34px;
  height: 34px;
  padding: 0 8px;
  border-radius: 11px;
  background: var(--ink);
  color: var(--surface);
  font-weight: 800;
}
.bb-sum .grow {
  display: grid;
  line-height: 1.2;
}
.bb-sum .grow span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.bb-sum .grow b {
  font-family: var(--font-display);
  font-size: 20px;
}
.bb-sum svg {
  width: 18px;
  height: 18px;
  color: var(--muted);
  transform: rotate(-90deg);
}
.billbar .btn.xl {
  min-height: 58px;
}
.billbar.bump .bb-sum {
  animation: bump .35s ease;
}
@keyframes bump {
  40% { transform: scale(1.03); border-color: var(--accent); }
}

/* ---------- alt sayfa, diyalog, bildirim ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: var(--scrim);
  opacity: 0;
  transition: opacity .22s ease;
}
.scrim.on {
  opacity: 1;
}
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 90;
  max-height: calc(100% - 30px - env(safe-area-inset-top, 0px));
  display: flex;
  flex-direction: column;
  border-radius: 26px 26px 0 0;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  transform: translateY(105%);
  transition: transform .28s cubic-bezier(.2, .9, .3, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.on {
  transform: none;
}
.sheet.tall {
  height: calc(100% - 30px - env(safe-area-inset-top, 0px));
}
.sheet-grab {
  width: 44px;
  height: 5px;
  margin: 10px auto 0;
  border-radius: 9px;
  background: var(--line-2);
  flex: none;
}
.sheet-h {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px 12px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.sheet-b {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 18px 22px;
  display: grid;
  grid-auto-rows: max-content;
  gap: 16px;
}
.sheet-f {
  flex: none;
  padding: 12px 18px;
  border-top: 1px solid var(--line);
  background: var(--surface-2);
}
.sheet .bill {
  border: 0;
  box-shadow: none;
  border-radius: 0;
  background: transparent;
}
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 110;
  width: min(400px, calc(100% - 32px));
  display: grid;
  gap: 12px;
  padding: 22px;
  border-radius: 24px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  transform: translate(-50%, -46%) scale(.96);
  opacity: 0;
  transition: transform .2s ease, opacity .2s ease;
}
.dialog.on {
  transform: translate(-50%, -50%);
  opacity: 1;
}
.dialog .acts {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 6px;
}
.dialog .acts .btn {
  flex: 1;
}
.scrim.top {
  z-index: 105;
}
.toasts {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  z-index: 130;
  display: grid;
  gap: 8px;
  width: min(440px, calc(100% - 24px));
  transform: translateX(-50%);
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 12px 14px;
  border-radius: 16px;
  background: var(--ink);
  color: var(--surface);
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
  animation: toastIn .25s ease both;
}
.toast.out {
  animation: toastOut .25s ease both;
}
.toast svg {
  width: 18px;
  height: 18px;
  color: var(--good);
}
.toast.bad svg {
  color: var(--bad);
}
.toast span {
  flex: 1;
}
.toast button {
  border: 0;
  border-radius: 10px;
  padding: 7px 12px;
  background: color-mix(in srgb, var(--surface) 18%, transparent);
  color: var(--surface);
  font-weight: 800;
  font-size: 13px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(10px); }
}

/* ---------- ödeme ---------- */
.pay-total {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 10px 0 4px;
}
.pay-total .big {
  font-family: var(--font-display);
  font-size: 46px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1;
}
.pay-total s {
  color: var(--muted);
  font-size: 15px;
}
.methods {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.method {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 16px 8px;
  border-radius: 18px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 800;
}
.method svg {
  width: 28px;
  height: 28px;
}
.method[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.cash {
  display: grid;
  gap: 10px;
  padding: 14px;
  border-radius: 18px;
  background: var(--bg-2);
}
.cash-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.cash-btns .chip {
  min-height: 44px;
  font-family: var(--font-mono);
}
.change {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-weight: 700;
}
.change b {
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--good);
}
.change.neg b {
  color: var(--bad);
}
details.more-opt summary {
  cursor: pointer;
  color: var(--ink-2);
  font-weight: 700;
  font-size: 14px;
  list-style: none;
}
details.more-opt summary::-webkit-details-marker {
  display: none;
}
details.more-opt summary::before {
  content: "+ ";
}
details.more-opt[open] summary::before {
  content: "− ";
}
details.more-opt > div {
  display: grid;
  gap: 10px;
  margin-top: 10px;
}

/* ---------- böl / taşı ---------- */
.split-big {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 18px;
  border-radius: 20px;
  background: var(--bg-2);
}
.split-big b {
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 800;
}
.sp-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.sp-item .grow {
  display: grid;
}
.mv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
}
.mv-grid button {
  display: grid;
  gap: 2px;
  padding: 12px 6px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.mv-grid button b {
  font-family: var(--font-display);
  font-size: 24px;
}
.mv-grid button span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.mv-grid button.open {
  border-color: color-mix(in srgb, var(--teal) 55%, var(--line));
}
.mv-grid button.open span {
  color: var(--teal);
}

/* ---------- bugün ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.kpi {
  display: grid;
  gap: 4px;
  padding: 14px;
  border-radius: 18px;
  background: var(--bg-2);
}
.kpi span {
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 700;
}
.kpi b {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;

function unlockAudio(){
  try {
    if(!K.audio){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; K.audio = new AC(); }
    if(K.audio.state !== "running") K.audio.resume();
  } catch(e){}

function audioReady(){ return K.audio && K.audio.state === "running"; }
function beep(kind){
  if(!sndOn() || !audioReady()) return;
  var a = K.audio, t = a.currentTime;
  var seq = kind === "hesap" ? [[0, 660], [0.18, 880], [0.36, 1100]] : kind === "tik" ? [[0, 1400]] : [[0, 880], [0.22, 1175], [0.6, 880], [0.82, 1175]];
  seq.forEach(function(n){
    var o = a.createOscillator(), g = a.createGain(), len = kind === "tik" ? 0.05 : 0.3;
    o.type = "sine"; o.frequency.value = n[1];
    g.gain.setValueAtTime(0.0001, t + n[0]);
    g.gain.exponentialRampToValueAtTime(kind === "tik" ? 0.08 : 0.42, t + n[0] + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + n[0] + len);
    o.connect(g); g.connect(a.destination);
    o.start(t + n[0]); o.stop(t + n[0] + len + 0.05);
  });
}
async function keepAwake(){

}

async function authCall(grant, body){

    body: JSON.stringify(body)
  });
  var j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.msg || ("Hata " + r.status));

}
async function api(path, opts, retry){
  opts = opts || {};
  if(DEMO) return Demo.api(path, opts);
  var h = { "apikey": SB_KEY, "Authorization": "Bearer " + K.session.access_token, "Content-Type": "application/json" };

  });

}

      for(var j = 0; j < k; j++){ var q = QUICK[Math.floor(rnd() * QUICK.length)], qq = 1 + Math.floor(rnd() * 2); its.push({ n: q[0], q: qq, p: q[1] }); tot += qq * q[1]; }
      var disc = rnd() < 0.12 ? Math.round(tot * 0.1) : 0, at = t0 + (8 + rnd() * Math.max(1, h - 8)) * 3600000;

    }
    D.bills.sort(function(a, b2){ return a.at < b2.at ? 1 : -1; });
  }
  function tableState(){
    return { status: "ok", now: new Date().toISOString(), settings: clone(D.settings),
      tables: D.tables.filter(function(t){ return !t.off; }).map(function(t){ var it = D.items[t.id] || []; return { id: t.id, no: t.no, token: t.token, total: it.reduce(function(a, x){ return a + x.qty * x.price; }, 0), n: it.length }; }),
      calls: clone(D.calls) };
  }
  function itemsOf(tid){
    var t = D.tables.filter(function(x){ return x.id === tid; })[0];
    if(!t) return { status: "not_found" };
    var it = D.items[tid] || [];
    return { status: "ok", table_id: tid, no: t.no, items: clone(it), total: it.reduce(function(a, x){ return a + x.qty * x.price; }, 0), upd: new Date().toISOString() };
  }
  function maybeCall(){
    if(D.calls.length >= 3 || Math.random() > 0.05) return;

  async function handle(path, opts){
    var b = opts.body || {};
    await sleep(90 + Math.random() * 140);
    if(/^businesses\?/.test(path)) return [clone(D.biz)];
    var fn = path.replace(/^rpc\//, "");

    if(fn === "owner_table_close"){

      D.calls = D.calls.filter(function(c){ return c.table_id !== b.p_table; });
      var r = itemsOf(b.p_table); r.bill_id = bill.id; r.paid = bill.paid; return r;
    }
    if(fn === "owner_bill_reopen"){
      var bl = D.bills.filter(function(x){ return x.id === b.p_bill; })[0];
      if(!bl) return { status: "not_found" };
      var tgt = D.items[bl.table_id] || (D.items[bl.table_id] = []);

      D.bills = D.bills.filter(function(x){ return x !== bl; });
      return itemsOf(bl.table_id);
    }
    if(fn === "owner_table_move"){
      if(b.p_from === b.p_to) return { status: "same" };
      var src = D.items[b.p_from] || [], dst = D.items[b.p_to] || (D.items[b.p_to] = []);

      D.calls = D.calls.filter(function(c){ return c.table_id !== b.p_from; });
      return itemsOf(b.p_to);
    }
    if(fn === "owner_bills"){
      var since = b.p_since ? new Date(b.p_since).toISOString() : new Date(Date.now() - 86400000).toISOString();

  }

  K.seenCalls = null;

function setTs(ts){
  var ids = {}, fresh = [];
  (ts.calls || []).forEach(function(c){ ids[c.id] = 1; if(K.seenCalls && !K.seenCalls[c.id]) fresh.push(c); });
  K.seenCalls = ids;
  K.ts = ts; K.tsAt = Date.now();
  if(fresh.length){
    var c = fresh[fresh.length - 1];
    beep(c.kind);
    try { if(navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
    toast("Masa " + c.no + (c.kind === "hesap" ? " hesap istiyor" : " garson çağırıyor"), "good", null, 4000);
  }

async function poll(){

    if(K.tick % 8 === 0){
      var st = await api("businesses?id=eq." + K.biz.id + "&select=paid_until,suspended");
      if(st && st.length){ K.biz.paid_until = st[0].paid_until; K.biz.suspended = st[0].suspended; if(isInactive(K.biz)){ showLocked(); return; } }
    }
    var ts = await rpc("owner_tables_state", { p_id: bid() });
    if(!ts || ts.status !== "ok") return;
    setTs(ts);
    renderCalls();
    if(K.sel == null) renderTables(true);

      if(K.items && K.pending === 0 && !typing && (Number(t.total) !== Number(K.items.total) || t.n !== K.items.items.length)) reloadItems(K.sel);
    }

async function extCall(fn, body, fallback){
  if(K.ext === false) return fallback();
  try { return await rpc(fn, body); }
  catch(e){
    if(/^404 /.test(e.message)){ K.ext = false; renderSum(); return fallback(); }
    throw e;
  }
}

/* ---------- çağrı şeridi ---------- */
function renderCalls(){
  var box = $("calls");
  if(!box) return;
  var cs = (K.ts && K.ts.calls) || [];
  if(!cs.length){ box.innerHTML = ""; box.className = ""; return; }
  box.className = "calls";
  box.innerHTML = cs.map(function(c){
    var hs = c.kind === "hesap", late = ageMin(c.at) >= 3;
    return '<div class="call' + (hs ? " hesap" : "") + (late ? " late" : "") + '"><button class="call-no" type="button" data-go="' + c.table_id + '" aria-label="Masa ' + c.no + ' aç">' + c.no + '</button>' +

      (hs ? '<button class="btn sm" type="button" data-pay="' + c.table_id + '">' + I.receipt + 'Hesap</button>' : '') +
      '<button class="btn ' + (hs ? "ghost" : "dark") + ' sm" type="button" data-cd="' + c.id + '" aria-label="Tamamlandı">' + I.check + (hs ? '' : 'Tamam') + '</button></div>';
  }).join("");
  box.querySelectorAll("[data-cd]").forEach(function(b){ b.onclick = function(){ callDone(Number(b.getAttribute("data-cd")), b); }; });
  box.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ goTable(Number(b.getAttribute("data-go"))); }; });
  box.querySelectorAll("[data-pay]").forEach(function(b){ b.onclick = function(){ goTable(Number(b.getAttribute("data-pay")), true); }; });
}
async function callDone(id, btn){
  if(btn) btn.disabled = true;
  try {
    await rpc("owner_call_done", { p_id: bid(), p_call: id });
    if(K.ts) K.ts.calls = (K.ts.calls || []).filter(function(c){ return c.id !== id; });
    if(K.seenCalls) delete K.seenCalls[id];
    updTitle(); renderCalls();
    if(K.sel == null) renderTables(true); else { renderSwitch(); renderCallBanner(); }
  } catch(e){ toast(netMsg(e), "bad"); if(btn) btn.disabled = false; }
}

var payAfterOpen = false;
function route(){
  if(!K.biz || !$("main")) return;
  var m = (location.hash || "").match(/^#m(\d+)$/);
  closeSheet(true);
  if(m && findT(Number(m[1]))) openTableView(Number(m[1]));
  else viewTables();
}
window.addEventListener("hashchange", route);
function goTable(id, pay){
  payAfterOpen = !!pay;
  if(location.hash === "#m" + id){ if(pay && K.items && K.sel === id){ payAfterOpen = false; openPay(); } return; }
  if(/^#m\d+$/.test(location.hash)) location.replace(location.pathname + location.search + "#m" + id);
  else { K.cameFromTables = K.sel == null; location.hash = "m" + id; }
}
function goTables(){
  if(/^#m\d+$/.test(location.hash)){
    if(history.length > 1 && K.cameFromTables){ history.back(); return; }
    location.hash = "";
    return;
  }
  route();
}

var FILTERS = [["all", "Tümü"], ["open", "Açık"], ["free", "Boş"], ["call", "Çağrı"]];
function tState(t){
  var cs = callsOf(t.id);
  if(cs.length) return "call";
  return Number(t.total) > 0 ? "open" : "free";
}
function viewTables(){
  K.sel = null; K.items = null;
  var bb = $("billbar"); if(bb) bb.innerHTML = "";
  $("main").innerHTML =
    '<div class="tv-head"><div><h1>Masalar</h1><div class="tv-stats" id="tvStats"></div></div>' +
    '<div class="chips" id="flt" role="group" aria-label="Filtre"></div></div>' +
    '<div class="tiles" id="tiles"></div>';
  renderTables();
}
function renderTables(soft){
  var box = $("tiles");
  if(!box) return;
  var ts = tables(), cnt = { all: ts.length, open: 0, free: 0, call: 0 }, sum = 0;
  ts.forEach(function(t){ var s = tState(t); cnt[s]++; if(s === "call" && Number(t.total) > 0) cnt.open++; sum += Number(t.total) || 0; });
  var f = $("flt");
  if(f){
    f.innerHTML = FILTERS.map(function(x){ return '<button class="chip' + (x[0] === "call" && cnt.call ? " hot" : "") + '" type="button" data-f="' + x[0] + '" aria-pressed="' + (K.filter === x[0]) + '">' + x[1] + ' <b>' + cnt[x[0]] + '</b></button>'; }).join("");
    f.querySelectorAll("[data-f]").forEach(function(b){ b.onclick = function(){ K.filter = b.getAttribute("data-f"); renderTables(); }; });
  }
  var st = $("tvStats");
  if(st) st.innerHTML = ts.length ? '<span>Açık <b>' + cnt.open + '</b>/' + ts.length + '</span><span>Masalarda <b class="num">' + esc(tm(sum)) + '</b></span>' +
    (K.ext && K.bills ? '<span>Bugün kapanan <b>' + K.bills.length + '</b> hesap</span>' : '') : '';
  if(!ts.length){
    box.innerHTML = '<div class="card tiles-empty"><div class="empty">' + I.table + '<b>Henüz masa yok</b><span class="small">Masa sayını, Wi-Fi bilgini ve hızlı ürünlerini ayarlardan gir. Masalara konan NFC/QR ile müşteriler menüyü görür, garson çağırır.</span>' +
      '<button class="btn" type="button" id="goSet">' + I.gear + 'Masa ayarları</button></div></div>';
    $("goSet").onclick = openSettings;
    return;
  }
  var list = ts.filter(function(t){
    var s = tState(t);
    return K.filter === "all" || K.filter === s || (K.filter === "open" && Number(t.total) > 0);
  });
  if(!list.length){ box.innerHTML = '<div class="tiles-empty"><div class="empty">' + I.table + '<b>Bu filtrede masa yok</b></div></div>'; return; }
  box.innerHTML = list.map(function(t){
    var s = tState(t), cs = callsOf(t.id), amt = Number(t.total) || 0, hs = cs.some(function(c){ return c.kind === "hesap"; });
    return '<button class="tile ' + (s === "call" ? "calling" : s) + (hs ? " hesap" : "") + '" type="button" data-t="' + t.id + '" aria-label="Masa ' + t.no + '">' +
      '<span class="t-no"><small>MASA</small>' + t.no + '</span>' +
      (cs.length ? '<span class="t-bell">' + I.bell + (hs ? "Hesap" : "Garson") + '</span>' : '') +
      (amt > 0 ? '<span><span class="t-amt num">' + esc(tm(amt)) + '</span><span class="t-sub" style="display:block">' + t.n + ' kalem</span></span>' : '<span class="t-sub">Boş</span>') +
      '</button>';
  }).join("");
  box.querySelectorAll("[data-t]").forEach(function(b){ b.onclick = function(){ goTable(Number(b.getAttribute("data-t"))); }; });
  void soft;
}

/* masa numarası yazarak atla (klavyeli kasa için) */
document.addEventListener("keydown", function(e){
  if(!K.biz || !$("main") || sheetEl || document.querySelector(".dialog.on")) return;
  var tag = (e.target && e.target.tagName) || "";
  if(/INPUT|TEXTAREA|SELECT/.test(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  if(K.sel != null){
    if(e.key === "/"){ e.preventDefault(); var s = $("pq"); if(s) s.focus(); }
    else if(e.key === "Escape"){ e.preventDefault(); goTables(); }
    return;
  }
  if(/^[0-9]$/.test(e.key)){
    K.jump = (K.jump + e.key).slice(-3);
    var j = $("jumpEl");
    if(!j){ j = document.createElement("div"); j.id = "jumpEl"; j.className = "jump"; document.body.appendChild(j); }
    j.textContent = "Masa " + K.jump;
    clearTimeout(K.jumpT);
    K.jumpT = setTimeout(function(){
      var no = Number(K.jump); K.jump = "";
      var el = $("jumpEl"); if(el) el.remove();
      var t = tables().filter(function(x){ return x.no === no; })[0];
      if(t) goTable(t.id); else toast("Masa " + no + " yok", "bad");
    }, 700);
  }
});

  K.sel = id;
  $("main").innerHTML =
    '<div class="tbl-view">' +
      '<div class="tv-bar"><button class="btn ghost sm back" type="button" id="backB">' + I.chev + 'Masalar</button><div class="tbl-switch" id="tsw" role="tablist" aria-label="Masa değiştir"></div></div>' +
      '<div id="cb"></div>' +
      '<div class="pos">' +
        '<div class="prods">' +
          '<div class="tv-title"><h1>Masa ' + t.no + '</h1><span class="muted small" id="tvSub"></span></div>' +
          '<div class="p-search">' + I.search + '<input class="input" id="pq" type="search" placeholder="Ürün ara (kısayol: /)" autocomplete="off" value="' + attr(K.q) + '" aria-label="Ürün ara">' +

function renderSwitch(){

}
function renderCallBanner(){

/* ---------- ürünler ---------- */
function trLow(s){ return String(s || "").toLocaleLowerCase("tr-TR"); }
function filteredProds(){
  var q = trLow(K.q).trim();
  return quick().filter(function(x){ return !q || trLow(x.n).indexOf(q) > -1; });
}
function qtyInBill(n, p){
  if(!K.items) return 0;
  var it = K.items.items.filter(function(x){ return x.name === n && Number(x.price) === Number(p); })[0];
  return it ? it.qty : 0;
}
function renderProds(){
  var g = $("pgrid");
  if(!g) return;
  var list = filteredProds(), q = K.q.trim();
  var html = list.map(function(x){
    var i = quick().indexOf(x), n = qtyInBill(x.n, x.p);
    return '<button class="prod" type="button" data-pi="' + i + '"><span class="pn">' + esc(x.n) + '</span><span class="pp">' + esc(tm(x.p)) + '</span>' +
      (n ? '<span class="pq">' + n + '</span>' : '') + '</button>';
  }).join("");
  if(q && !list.some(function(x){ return trLow(x.n) === trLow(q); })){
    html += '<button class="prod new" type="button" id="pNew"><span class="pn">"' + esc(q) + '" ekle</span><span class="pp">fiyat yaz</span></button>';
  }
  if(!quick().length && !q){
    html = '<div class="card" style="grid-column:1/-1"><div class="empty">' + I.coffee + '<b>Hızlı ürün listen boş</b><span class="small">Ayarlardan sık sattığın ürünleri ve fiyatlarını ekle; burada tek dokunuşla hesaba eklenir.</span>' +
      '<button class="btn sm" type="button" id="pSet">' + I.gear + 'Ürünleri ekle</button></div></div>';
  }
  g.innerHTML = html;
  g.querySelectorAll("[data-pi]").forEach(function(b){
    b.onclick = function(){
      var x = quick()[Number(b.getAttribute("data-pi"))];
      addItem(x.n, x.p, 1);
      b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
    };
  });
  var pn = $("pNew"); if(pn) pn.onclick = function(){ openManual(q); };
  var ps = $("pSet"); if(ps) ps.onclick = openSettings;
}
function renderManual(open, name){
  var box = $("manBox");
  if(!box) return;
  if(!open){
    box.innerHTML = '<button class="btn ghost block" type="button" id="manOpen">' + I.plus + 'Listede olmayan ürün ekle</button>';
    $("manOpen").onclick = function(){ openManual(""); };
    return;
  }
  box.innerHTML = '<div class="man"><div class="row between"><h3>Elle ekle</h3><button class="icon-btn sm" type="button" id="manX" aria-label="Kapat">' + I.x + '</button></div>' +
    '<div class="man-row"><input class="input" id="mn" maxlength="60" placeholder="Ürün adı" value="' + attr(name || "") + '"><input class="input num" id="mp" placeholder="Fiyat" inputmode="decimal"></div>' +
    '<div class="man-foot"><div class="stepper"><button type="button" id="mqm" aria-label="Azalt">−</button><input id="mq" type="number" min="1" max="99" value="1" inputmode="numeric" aria-label="Adet"><button type="button" id="mqp" aria-label="Artır">+</button></div>' +
    '<label class="check"><input type="checkbox" id="msv">Hızlı ürünlere de ekle</label><span class="grow"></span>' +
    '<button class="btn" type="button" id="madd">' + I.plus + 'Hesaba ekle</button></div></div>';
  $("manX").onclick = function(){ renderManual(false); };
  $("mqm").onclick = function(){ var i = $("mq"); i.value = Math.max(1, Number(i.value || 1) - 1); };
  $("mqp").onclick = function(){ var i = $("mq"); i.value = Math.min(99, Number(i.value || 0) + 1); };
  $("mp").onkeydown = function(e){ if(e.key === "Enter"){ e.preventDefault(); $("madd").click(); } };
  $("madd").onclick = async function(){
    var n = $("mn").value.trim(), p = parsePrice($("mp").value), q = parseInt($("mq").value, 10);
    if(!n){ $("mn").classList.add("bad"); $("mn").focus(); return; }
    if(p === null){ $("mp").classList.add("bad"); $("mp").focus(); toast("Fiyatı yaz. Örnek: 120 ya da 85,50", "bad"); return; }
    if(!(q >= 1 && q <= 99)){ toast("Adet 1 ile 99 arasında olmalı", "bad"); return; }
    if(n.length > 40 && $("msv").checked){ toast("Hızlı ürün adı en fazla 40 karakter olabilir", "bad"); return; }
    addItem(n, p, q);
    if($("msv").checked) await addToQuick(n, p);
    renderManual(false);
    K.q = ""; var pq = $("pq"); if(pq){ pq.value = ""; $("pqx").hidden = true; } renderProds();

}
function openManual(name){
  renderManual(true, name);
  setTimeout(function(){ var el = $(name ? "mp" : "mn"); if(el){ el.focus(); el.scrollIntoView({ block: "center", behavior: "smooth" }); } }, 30);
}
async function addToQuick(n, p){
  var q = quick().slice();
  if(q.some(function(x){ return trLow(x.n) === trLow(n); })){ toast(n + " zaten hızlı listede"); return; }
  if(q.length >= 40){ toast("Hızlı listede en fazla 40 ürün olabilir", "bad"); return; }
  q.push({ n: n, p: p });
  var s = K.ts.settings || {};
  try {
    var r = await rpc("owner_tables_save", { p_id: bid(), p_count: tables().length, p_wifi_name: s.wifi_name || "", p_wifi_pass: s.wifi_pass || "", p_menu_url: s.menu_url || "", p_quick: q });
    if(!r || r.status !== "ok") throw new Error(r && r.status);
    setTs(r); renderProds();
    toast(n + " hızlı ürünlere eklendi");
  } catch(e){ toast("Hızlı listeye eklenemedi: " + netMsg(e), "bad"); }
}

/* ---------- hesap işlemleri (sıralı kuyruk + anında görünüm) ---------- */
var tmpN = 0;
function recalc(){
  if(!K.items) return;
  K.items.total = K.items.items.reduce(function(a, x){ return a + x.qty * Number(x.price); }, 0);
  var t = findT(K.sel);
  if(t){ t.total = K.items.total; t.n = K.items.items.length; }
}
function op(tid, fn){
  K.pending++;
  var p = K.chain.then(fn).then(function(r){
    K.pending--;
    if(r && r.status === "ok" && r.table_id != null) applyItems(r);
    else if(r && r.status && r.status !== "ok"){ toast(opErr(r.status), "bad"); if(K.pending === 0) reloadItems(tid); }
    return r;
  }, function(e){
    K.pending--;
    toast(netMsg(e), "bad");
    if(K.pending === 0) reloadItems(tid);
    return null;
  });
  K.chain = p;
  return p;
}
function opErr(s){
  return { bad_name: "Ürün adı geçersiz", bad_qty: "Adet 1 ile 99 arasında olmalı", bad_price: "Fiyat geçersiz", too_many: "Bu masada çok fazla kalem var", not_found: "Masa ya da ürün bulunamadı", empty: "Hesap boş", bad_discount: "İndirim tutarı geçersiz", bad_method: "Ödeme türü geçersiz", same: "Aynı masa seçildi" }[s] || ("İşlem yapılamadı: " + s);
}
function applyItems(r){
  var t = findT(r.table_id);
  if(t){ t.total = r.total; t.n = (r.items || []).length; }
  if(K.sel === r.table_id && K.pending === 0){ K.items = r; renderBillAll(); renderProds(); renderBillbar(); }
  renderSwitch();
}
async function reloadItems(tid){
  try {
    var r = await rpc("owner_table_items", { p_id: bid(), p_table: tid });
    if(r && r.status === "ok" && K.pending === 0){ applyItems(r); if(K.sel === tid && !K.items) K.items = r; }
    else if(r && r.status !== "ok" && K.sel === tid){ toast("Masa açılamadı", "bad"); goTables(); }
  } catch(e){ toast(netMsg(e), "bad"); }
}
function addItem(name, price, qty){
  if(K.sel == null) return;
  if(!K.items){ toast("Masa yükleniyor, bir saniye", "bad"); return; }
  var tid = K.sel, it = K.items.items.filter(function(x){ return x.name === name && Number(x.price) === Number(price); })[0];
  if(it) it.qty = Math.min(99, it.qty + qty);
  else { it = { id: "tmp" + (++tmpN), name: name, qty: qty, price: Number(price), tmp: true }; K.items.items.push(it); }
  K.flash = name + "|" + Number(price);
  recalc(); renderBillAll(); renderProds(); renderBillbar(true);
  try { if(navigator.vibrate) navigator.vibrate(12); } catch(e){}
  op(tid, function(){ return rpc("owner_item_add", { p_id: bid(), p_table: tid, p_name: name, p_qty: qty, p_price: Number(price) }); });
}
function setQty(itemId, n){
  if(!K.items) return;
  var tid = K.sel, it = K.items.items.filter(function(x){ return String(x.id) === String(itemId); })[0];
  if(!it || it.tmp) return;
  var old = it.qty, snap = { name: it.name, price: Number(it.price) };
  n = clamp(n, 0, 99);
  if(n === old) return;
  if(n === 0) K.items.items = K.items.items.filter(function(x){ return x !== it; });
  else it.qty = n;
  recalc(); renderBillAll(); renderProds(); renderBillbar();
  if(n > old){
    op(tid, function(){ return rpc("owner_item_add", { p_id: bid(), p_table: tid, p_name: snap.name, p_qty: n - old, p_price: snap.price }); });
  } else {
    op(tid, function(){
      return extCall("owner_item_qty", { p_id: bid(), p_item: it.id, p_qty: n }, async function(){
        var r = await rpc("owner_item_del", { p_id: bid(), p_item: it.id });
        if(n > 0 && r && r.status === "ok") r = await rpc("owner_item_add", { p_id: bid(), p_table: tid, p_name: snap.name, p_qty: n, p_price: snap.price });
        return r;
      });
    });
  }
  if(n === 0) toast(snap.name + " silindi", "good", { label: "Geri al", fn: function(){ if(K.sel === tid) addItem(snap.name, snap.price, old); } });
}

function bindBill(root){
  root.querySelectorAll("[data-q]").forEach(function(b){ b.onclick = function(){ setQty(b.getAttribute("data-q"), Number(b.getAttribute("data-n"))); }; });
  root.querySelectorAll("[data-ba]").forEach(function(b){
    b.onclick = function(){
      var a = b.getAttribute("data-ba");
      if(a === "pay") openPay(); else if(a === "split") openSplit(); else if(a === "move") openMove(); else if(a === "print") printBill();
    };
  });
}

function openPay(){
  if(!K.items || !K.items.items.length){ toast("Hesap boş", "bad"); return; }
  var tid = K.sel, t = findT(tid), total = K.items.total;
  var st = { m: lsGet("dmgk_lastm") || "nakit", dType: "none", dVal: 0, got: null };
  var el = openSheet('<div class="grow"><div class="eyebrow">Ödeme al</div><h2>Masa ' + t.no + '</h2></div>',
    '<div class="pay-total"><span class="muted small" id="pyOld"></span><span class="big num" id="pyTot"></span><span class="muted small">' + K.items.items.length + ' kalem</span></div>' +
    '<div class="methods" role="group" aria-label="Ödeme türü">' +
      '<button class="method" type="button" data-m="nakit">' + I.cash + 'Nakit</button>' +
      '<button class="method" type="button" data-m="kart">' + I.card + 'Kart</button>' +
      '<button class="method" type="button" data-m="diger">' + I.other + 'Diğer</button></div>' +
    '<div class="cash" id="pyCash"><div class="lbl">Alınan para</div><div class="cash-btns" id="pyGot"></div>' +
      '<input class="input num" id="pyIn" inputmode="decimal" placeholder="Farklı bir tutar yaz">' +
      '<div class="change" id="pyCh"></div></div>' +
    '<details class="more-opt" id="pyDisc"><summary>İndirim uygula</summary><div>' +
      '<div class="chips" id="pyDc">' + [["none", "Yok"], ["p5", "%5"], ["p10", "%10"], ["p20", "%20"], ["amt", "Tutar"]].map(function(x){ return '<button class="chip" type="button" data-d="' + x[0] + '">' + x[1] + '</button>'; }).join("") + '</div>' +
      '<input class="input num" id="pyDa" inputmode="decimal" placeholder="İndirim tutarı (₺)" hidden>' +
      (K.ext === false ? '<p class="hint">İndirim sadece hesaplamada ve fişte görünür.</p>' : '') + '</div></details>',
    { k: "pay", foot: '<div class="row"><button class="btn ghost" type="button" id="pyPr">' + I.print + '<span class="hide-s">Fiş</span></button><button class="btn xl grow" type="button" id="pyGo"></button></div>' });
  function disc(){
    if(st.dType === "p5") return Math.round(total * 5) / 100;
    if(st.dType === "p10") return Math.round(total * 10) / 100;
    if(st.dType === "p20") return Math.round(total * 20) / 100;
    if(st.dType === "amt") return clamp(st.dVal || 0, 0, total);
    return 0;
  }
  function pay(){ return Math.round((total - disc()) * 100) / 100; }
  function suggestions(p){
    var s = [p], steps = [50, 100, 200, 500, 1000];
    steps.forEach(function(x){ var v = Math.ceil(p / x) * x; if(v > p && s.indexOf(v) < 0) s.push(v); });
    return s.slice(0, 5);
  }
  function upd(){
    var p = pay(), d = disc();
    $("pyTot").textContent = tm(p);
    $("pyOld").innerHTML = d ? '<s>' + esc(tm(total)) + '</s> · ' + esc(tm(d)) + ' indirim' : '';
    el.querySelectorAll("[data-m]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-m") === st.m)); });
    el.querySelectorAll("[data-d]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-d") === st.dType)); });
    $("pyDa").hidden = st.dType !== "amt";
    $("pyCash").hidden = st.m !== "nakit";
    $("pyGot").innerHTML = suggestions(p).map(function(v, i){ return '<button class="chip" type="button" data-g="' + v + '" aria-pressed="' + (st.got === v) + '">' + (i === 0 ? "Tam " : "") + esc(tm(v)) + '</button>'; }).join("");
    $("pyGot").querySelectorAll("[data-g]").forEach(function(b){ b.onclick = function(){ st.got = Number(b.getAttribute("data-g")); $("pyIn").value = ""; upd(); }; });
    var ch = $("pyCh");
    if(st.m === "nakit" && st.got != null){
      var c = Math.round((st.got - p) * 100) / 100;
      ch.className = "change" + (c < 0 ? " neg" : "");
      ch.innerHTML = '<span>' + (c < 0 ? "Eksik" : "Para üstü") + '</span><b class="num">' + esc(tm(Math.abs(c))) + '</b>';
    } else ch.innerHTML = "";
    var go = $("pyGo");
    go.innerHTML = I.check + esc(tm(p)) + ' ' + ({ nakit: "nakit", kart: "kart", diger: "diğer" }[st.m]) + ' · Kapat';
    go.disabled = st.m === "nakit" && st.got != null && st.got < p;
  }
  el.querySelectorAll("[data-m]").forEach(function(b){ b.onclick = function(){ st.m = b.getAttribute("data-m"); upd(); }; });
  el.querySelectorAll("[data-d]").forEach(function(b){ b.onclick = function(){ st.dType = b.getAttribute("data-d"); if(st.dType === "amt") setTimeout(function(){ $("pyDa").focus(); }, 30); upd(); }; });
  $("pyDa").oninput = function(){ var v = parsePrice(this.value); st.dVal = v == null ? 0 : v; this.classList.toggle("bad", !!this.value && (v == null || v > total)); upd(); };
  $("pyIn").oninput = function(){ var v = parsePrice(this.value); st.got = v; upd(); };
  $("pyPr").onclick = function(){ printBill({ discount: disc(), method: st.m, got: st.got }); };
  $("pyGo").onclick = function(){ closeTable(tid, st.m, disc(), this); };
  upd();
}

async function closeTable(tid, method, discount, btn){
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span>Kapatılıyor...'; }
  await K.chain;
  var t = findT(tid), snap = K.items ? JSON.parse(JSON.stringify(K.items.items)) : [], paid = Math.round(((K.items ? K.items.total : 0) - discount) * 100) / 100;
  try {
    var r = await extCall("owner_table_close", { p_id: bid(), p_table: tid, p_method: method, p_discount: discount }, function(){
      return rpc("owner_table_clear", { p_id: bid(), p_table: tid });
    });
    if(!r || r.status !== "ok"){ toast(opErr(r && r.status), "bad"); if(btn){ btn.disabled = false; btn.textContent = "Tekrar dene"; } return; }
    lsSet("dmgk_lastm", method);
    applyItems(r);
    if(K.ts) K.ts.calls = (K.ts.calls || []).filter(function(c){ return c.table_id !== tid; });
    closeSheet(true);
    var no = t ? t.no : "";
    toast("Masa " + no + " kapatıldı · " + tm(paid) + " " + ({ nakit: "nakit", kart: "kart", diger: "diğer" }[method]), "good",
      { label: "Geri al", fn: function(){ r.bill_id ? reopenBill(r.bill_id) : restoreItems(tid, snap); } }, 8000);
    if(K.ext) loadBills();
    updTitle(); renderCalls();
    goTables();
  } catch(e){
    toast(netMsg(e), "bad");
    if(btn){ btn.disabled = false; btn.textContent = "Tekrar dene"; }
  }
}
async function reopenBill(billId){
  try {
    var r = await rpc("owner_bill_reopen", { p_id: bid(), p_bill: billId });
    if(!r || r.status !== "ok") throw new Error(opErr(r && r.status));
    applyItems(r);
    toast("Hesap geri açıldı · Masa " + r.no);
    loadBills();
    if(sheetIs("today")) openToday();
    else goTable(r.table_id);
  } catch(e){ toast(e.message === "too_old" ? "6 saatten eski hesap geri alınamaz" : netMsg(e), "bad"); }
}
async function restoreItems(tid, snap){
  for(var i = 0; i < snap.length; i++){
    var x = snap[i];
    await op(tid, function(){ return rpc("owner_item_add", { p_id: bid(), p_table: tid, p_name: x.name, p_qty: x.qty, p_price: Number(x.price) }); });
  }
  toast("Hesap geri yüklendi");
  goTable(tid);
}
