function openSplit(){
  if(!K.items || !K.items.items.length) return;
  var total = K.items.total, st = { n: 2, pick: {} };
  var el = openSheet('<div class="grow"><div class="eyebrow">Hesabı böl</div><h2>Masa ' + findT(K.sel).no + ' · ' + esc(tm(total)) + '</h2></div>',
    '<div class="seg" role="group" aria-label="Bölme türü"><button type="button" data-sm="p" aria-pressed="true">Kişi başı</button><button type="button" data-sm="i" aria-pressed="false">Ürüne göre</button></div>' +
    '<div id="spBody"></div>', { k: "split" });
  var mode = "p";
  function draw(){
    var b = $("spBody");
    el.querySelectorAll("[data-sm]").forEach(function(x){ x.setAttribute("aria-pressed", String(x.getAttribute("data-sm") === mode)); });
    if(mode === "p"){
      var each = total / st.n, up = Math.ceil(each);
      b.innerHTML = '<div class="stack"><div class="row between"><span class="lbl">Kişi sayısı</span><div class="stepper"><button type="button" id="spm">−</button><input id="spn" type="number" min="2" max="30" value="' + st.n + '" inputmode="numeric"><button type="button" id="spp">+</button></div></div>' +
        '<div class="split-big"><span class="muted small">Kişi başı</span><b class="num">' + esc(tm(Math.round(each * 100) / 100)) + '</b>' +
        (up !== Math.round(each * 100) / 100 ? '<span class="small ink2">Yuvarlarsan ' + esc(tm(up)) + ' · fazlası ' + esc(tm(up * st.n - total)) + '</span>' : '') + '</div></div>';
      $("spm").onclick = function(){ st.n = Math.max(2, st.n - 1); draw(); };
      $("spp").onclick = function(){ st.n = Math.min(30, st.n + 1); draw(); };
      $("spn").onchange = function(){ st.n = clamp(parseInt(this.value, 10) || 2, 2, 30); draw(); };
    } else {
      var sel = 0;
      K.items.items.forEach(function(x){ sel += (st.pick[x.id] || 0) * Number(x.price); });
      b.innerHTML = '<div>' + K.items.items.map(function(x){
        var v = st.pick[x.id] || 0;
        return '<div class="sp-item"><div class="grow"><b class="ell">' + esc(x.name) + '</b><span class="small muted">' + x.qty + ' × ' + esc(tm(x.price)) + '</span></div>' +
          '<div class="stepper"><button type="button" data-sd="' + attr(x.id) + '" data-v="-1">−</button><input value="' + v + '" readonly aria-label="Seçilen adet"><button type="button" data-sd="' + attr(x.id) + '" data-v="1">+</button></div></div>';
      }).join("") + '</div>' +
        '<div class="split-big"><span class="muted small">Seçilenler</span><b class="num">' + esc(tm(sel)) + '</b><span class="small ink2">Kalan ' + esc(tm(total - sel)) + '</span></div>';
      b.querySelectorAll("[data-sd]").forEach(function(btn){
        btn.onclick = function(){
          var id = btn.getAttribute("data-sd"), it = K.items.items.filter(function(x){ return String(x.id) === id; })[0];
          st.pick[id] = clamp((st.pick[id] || 0) + Number(btn.getAttribute("data-v")), 0, it.qty);
          draw();
        };
      });
    }
  }
  el.querySelectorAll("[data-sm]").forEach(function(x){ x.onclick = function(){ mode = x.getAttribute("data-sm"); draw(); }; });
  draw();
}

function openMove(){
  if(!K.items || !K.items.items.length) return;
  var from = findT(K.sel);
  var el = openSheet('<div class="grow"><div class="eyebrow">Masa taşı</div><h2>Masa ' + from.no + ' hesabı nereye?</h2></div>',
    '<p class="small ink2">Hedef masada hesap varsa ikisi birleştirilir. Bu masanın çağrıları kapanır.</p>' +
    '<div class="mv-grid">' + tables().filter(function(t){ return t.id !== from.id; }).map(function(t){
      var amt = Number(t.total) || 0;
      return '<button type="button" class="' + (amt > 0 ? "open" : "") + '" data-mv="' + t.id + '"><b>' + t.no + '</b><span>' + (amt > 0 ? esc(tm(amt)) : "Boş") + '</span></button>';
    }).join("") + '</div>', { k: "move" });
  el.querySelectorAll("[data-mv]").forEach(function(b){
    b.onclick = async function(){
      var to = findT(Number(b.getAttribute("data-mv")));
      var ok = await confirmBox({ title: "Masa " + from.no + " → Masa " + to.no, text: Number(to.total) > 0 ? "Masa " + to.no + " hesabıyla birleştirilecek." : "Bütün hesap Masa " + to.no + "'e taşınacak.", ok: "Taşı" });
      if(!ok) return;
      await moveTable(from.id, to.id);
    };
  });
}
async function moveTable(fromId, toId){
  await K.chain;
  var from = findT(fromId), to = findT(toId), snap = K.items ? K.items.items.slice() : [];
  try {
    var r = await extCall("owner_table_move", { p_id: bid(), p_from: fromId, p_to: toId }, async function(){
      var last = null;
      for(var i = 0; i < snap.length; i++){
        last = await rpc("owner_item_add", { p_id: bid(), p_table: toId, p_name: snap[i].name, p_qty: snap[i].qty, p_price: Number(snap[i].price) });
        if(!last || last.status !== "ok") return last;
      }
      var c = await rpc("owner_table_clear", { p_id: bid(), p_table: fromId });
      if(!c || c.status !== "ok") return c;
      return last;
    });
    if(!r || r.status !== "ok"){ toast(opErr(r && r.status), "bad"); return; }
    if(from){ from.total = 0; from.n = 0; }
    if(to){ to.total = r.total; to.n = r.items.length; }
    if(K.ts) K.ts.calls = (K.ts.calls || []).filter(function(c){ return c.table_id !== fromId; });
    closeSheet(true);
    toast("Masa " + from.no + " → Masa " + to.no + " taşındı");
    K.items = null;
    goTable(toId);
  } catch(e){ toast(netMsg(e), "bad"); }
}

function printHtml(html){
  var area = $("printArea");
  if(area) area.remove();
  area = document.createElement("div");
  area.id = "printArea";
  area.innerHTML = '<style>@page{size:80mm auto;margin:4mm}</style>' + html;
  document.body.appendChild(area);
  document.body.classList.add("printing");
  function done(){ document.body.classList.remove("printing"); area.remove(); window.removeEventListener("afterprint", done); }
  window.addEventListener("afterprint", done);
  setTimeout(function(){ window.print(); setTimeout(function(){ if(document.body.contains(area)) done(); }, 2000); }, 60);
}
function printBill(o){
  o = o || {};
  if(!K.items) return;
  var t = findT(K.sel), d = o.discount || 0, total = K.items.total;
  printHtml('<div class="rc"><h2>' + esc(K.biz.name) + '</h2><div class="c">Masa ' + t.no + ' · ' + esc(new Date().toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })) + '</div><hr>' +
    K.items.items.map(function(x){ return '<div class="l"><span>' + x.qty + ' x ' + esc(x.name) + '</span><span>' + esc(tm(x.qty * Number(x.price))) + '</span></div>'; }).join("") + '<hr>' +
    (d ? '<div class="l"><span>Ara toplam</span><span>' + esc(tm(total)) + '</span></div><div class="l"><span>İndirim</span><span>-' + esc(tm(d)) + '</span></div>' : '') +
    '<div class="l t"><span>TOPLAM</span><span>' + esc(tm(total - d)) + '</span></div>' +
    (o.method ? '<div class="l"><span>Ödeme</span><span>' + ({ nakit: "Nakit", kart: "Kart", diger: "Diğer" }[o.method]) + '</span></div>' : '') +
    (o.method === "nakit" && o.got ? '<div class="l"><span>Alınan</span><span>' + esc(tm(o.got)) + '</span></div><div class="l"><span>Para üstü</span><span>' + esc(tm(o.got - (total - d))) + '</span></div>' : '') +
    '<hr><div class="c">Bilgi fişidir · Mali değeri yoktur</div><div class="c">Teşekkür ederiz</div></div>');
}

/* =========================================================
   Bugün: kapanan hesaplar ve ciro
   ========================================================= */
var TD = { off: 0 };
async function openToday(){
  var el = openSheet('<div class="grow"><div class="eyebrow">Gün özeti</div><h2>Kasa</h2></div>', '<div id="tdBody"><div class="empty"><div class="spin"></div></div></div>', { k: "today", tall: true });
  void el;
  if(K.ext === false){ renderTodayNoExt(); return; }
  await renderToday();
}
function renderTodayNoExt(){
  var b = $("tdBody");
  if(!b) return;
  var open = tables().filter(function(t){ return Number(t.total) > 0; }), sum = open.reduce(function(a, t){ return a + Number(t.total); }, 0);
  b.innerHTML = '<div class="kpis"><div class="kpi hero"><span>Şu an masalarda</span><b class="num">' + esc(tm(sum)) + '</b></div><div class="kpi"><span>Açık masa</span><b>' + open.length + '</b></div><div class="kpi"><span>Toplam masa</span><b>' + tables().length + '</b></div></div>' +
    '<div class="card stack"><h3>Günlük ciro özeti kapalı</h3><p class="small ink2">Kapatılan hesapların tutarını ve ödeme türünü (nakit, kart) kaydetmek için kasa ek kurulumu gerekiyor. ' +
    'Kurulunca burada günün cirosunu, nakit ve kart toplamlarını, en çok satanları görürsün; yanlışlıkla kapatılan hesabı geri alabilirsin.</p>' +
    '<p class="small muted">Kurulum için Damgalio ile iletişime geç.</p></div>';
}
async function renderToday(){
  var b = $("tdBody");
  if(!b) return;
  var bills = TD.off === 0 ? await loadBills(0) : await loadBills(1);
  if(!sheetIs("today")) return;
  b = $("tdBody");
  if(bills === null){ if(K.ext === false) renderTodayNoExt(); else b.innerHTML = '<div class="empty">' + I.alert + '<b>Özet alınamadı</b></div>'; return; }
  if(TD.off === 1){ var t0 = startOfDay(Date.now()).toISOString(); bills = bills.filter(function(x){ return x.at < t0; }); }
  var paid = 0, disc = 0, by = { nakit: 0, kart: 0, diger: 0 }, prod = {};
  bills.forEach(function(x){
    paid += Number(x.paid); disc += Number(x.discount || 0); by[x.method] = (by[x.method] || 0) + Number(x.paid);
    (x.items || []).forEach(function(i){ var k = i.n; prod[k] = prod[k] || { q: 0, s: 0 }; prod[k].q += i.q; prod[k].s += i.q * Number(i.p); });
  });
  var top = Object.keys(prod).sort(function(a, c){ return prod[c].q - prod[a].q; }).slice(0, 6);
  var open = tables().filter(function(t){ return Number(t.total) > 0; }), openSum = open.reduce(function(a, t){ return a + Number(t.total); }, 0);
  function pc(v){ return paid ? (v / paid * 100).toFixed(1) : 0; }
  var day = TD.off === 0 ? "Bugün" : "Dün";
  var txt = summaryText(day, bills, paid, by, disc, top, prod);
  b.innerHTML =
    '<div class="seg" role="group" aria-label="Gün"><button type="button" data-td="0" aria-pressed="' + (TD.off === 0) + '">Bugün</button><button type="button" data-td="1" aria-pressed="' + (TD.off === 1) + '">Dün</button></div>' +
    '<div class="kpis"><div class="kpi hero"><span>' + day + ' ciro</span><b class="num">' + esc(tm(paid)) + '</b></div>' +
      '<div class="kpi"><span>Hesap</span><b>' + bills.length + '</b></div><div class="kpi"><span>Ortalama</span><b class="num">' + esc(tm(bills.length ? paid / bills.length : 0)) + '</b></div>' +
      '<div class="kpi"><span>Nakit</span><b class="num">' + esc(tm(by.nakit)) + '</b></div><div class="kpi"><span>Kart</span><b class="num">' + esc(tm(by.kart)) + '</b></div>' +
      (by.diger ? '<div class="kpi"><span>Diğer</span><b class="num">' + esc(tm(by.diger)) + '</b></div>' : '') +
      (disc ? '<div class="kpi"><span>İndirim</span><b class="num">' + esc(tm(disc)) + '</b></div>' : '') +
      (TD.off === 0 ? '<div class="kpi"><span>Açık masalarda</span><b class="num">' + esc(tm(openSum)) + '</b></div>' : '') +
    '</div>' +
    (paid ? '<div class="stack"><div class="mbar">' + ["nakit", "kart", "diger"].filter(function(m){ return by[m]; }).map(function(m){ return '<i class="' + m + '" style="width:' + pc(by[m]) + '%"></i>'; }).join("") + '</div>' +
      '<div class="mleg"><span><i class="nakit"></i>Nakit %' + Math.round(pc(by.nakit)) + '</span><span><i class="kart"></i>Kart %' + Math.round(pc(by.kart)) + '</span>' + (by.diger ? '<span><i class="diger"></i>Diğer %' + Math.round(pc(by.diger)) + '</span>' : '') + '</div></div>' : '') +
    (top.length ? '<div class="card stack"><h3>En çok satanlar</h3><div class="top-p">' + top.map(function(k){ return '<div><span>' + esc(k) + '</span><b>' + prod[k].q + ' adet · ' + esc(tm(prod[k].s)) + '</b></div>'; }).join("") + '</div></div>' : '') +
    '<div><h3 style="margin-bottom:6px">Kapanan hesaplar</h3>' + (bills.length ? bills.map(function(x){
      var canUndo = TD.off === 0 && Date.now() - new Date(x.at).getTime() < 6 * 3600000;
      return '<div class="bl-i"><span class="bno">' + x.no + '</span><div class="grow"><span class="small"><b>' + esc(fmtHM(x.at)) + '</b> · ' + (x.items || []).reduce(function(a, i){ return a + i.q; }, 0) + ' ürün' + (Number(x.discount) ? ' · ' + esc(tm(x.discount)) + ' indirim' : '') + '</span>' +
        '<span><span class="mtag ' + esc(x.method) + '">' + ({ nakit: "Nakit", kart: "Kart", diger: "Diğer" }[x.method] || x.method) + '</span></span></div>' +
        '<span class="amt num">' + esc(tm(x.paid)) + '</span>' + (canUndo ? '<button class="icon-btn sm" type="button" data-ro="' + x.id + '" aria-label="Hesabı geri aç" title="Masaya geri aç">' + I.undo + '</button>' : '') + '</div>';
    }).join("") : '<div class="empty">' + I.receipt + '<b>' + day + ' kapanan hesap yok</b></div>') + '</div>' +
    '<pre class="pre">' + esc(txt) + '</pre>' +
    '<div class="row"><button class="btn ghost grow" type="button" id="tdCp">' + I.copy + 'Kopyala</button><button class="btn ghost grow" type="button" id="tdPr">' + I.print + 'Yazdır</button>' +
    (navigator.share ? '<button class="btn ghost grow" type="button" id="tdSh">' + I.share + 'Paylaş</button>' : '') + '</div>';
  b.querySelectorAll("[data-td]").forEach(function(x){ x.onclick = function(){ TD.off = Number(x.getAttribute("data-td")); b.innerHTML = '<div class="empty"><div class="spin"></div></div>'; renderToday(); }; });
  b.querySelectorAll("[data-ro]").forEach(function(x){
    x.onclick = async function(){
      var bl = bills.filter(function(y){ return String(y.id) === x.getAttribute("data-ro"); })[0];
      var ok = await confirmBox({ title: "Hesap geri açılsın mı?", text: "Masa " + bl.no + " için " + tm(bl.paid) + " tutarındaki kayıt silinir, ürünler masaya geri eklenir.", ok: "Geri aç" });
      if(ok) reopenBill(bl.id);
    };
  });
  $("tdCp").onclick = function(){ copyText(txt, "Özet kopyalandı"); };
  $("tdPr").onclick = function(){ printHtml('<div class="rc"><h2>' + esc(K.biz.name) + '</h2><div class="c">' + esc(day + " · " + fmtLong(Date.now() - TD.off * 86400000)) + '</div><hr>' + txt.split("\n").slice(2).map(function(l){ return '<div>' + esc(l) + '</div>'; }).join("") + '</div>'); };
  var sh = $("tdSh"); if(sh) sh.onclick = function(){ navigator.share({ title: "Kasa özeti", text: txt }).catch(function(){}); };
}
function summaryText(day, bills, paid, by, disc, top, prod){
  var l = [K.biz.name + " · " + day + " kasa özeti", fmtLong(Date.now() - TD.off * 86400000), ""];
  l.push("Ciro: " + tm(paid) + " (" + bills.length + " hesap)");
  l.push("Nakit: " + tm(by.nakit) + " · Kart: " + tm(by.kart) + (by.diger ? " · Diğer: " + tm(by.diger) : ""));
  if(disc) l.push("İndirim: " + tm(disc));
  if(bills.length) l.push("Hesap ortalaması: " + tm(paid / bills.length));
  if(top.length) l.push("En çok satan: " + top.slice(0, 3).map(function(k){ return k + " (" + prod[k].q + ")"; }).join(", "));
  return l.join("\n");
}

/* =========================================================
   Ayarlar
   ========================================================= */
function openSettings(){
  var s = (K.ts && K.ts.settings) || {}, ts = tables();
  var st = { n: ts.length, bulk: false, qp: quick().map(function(x){ return { n: x.n, p: String(x.p).replace(".", ",") }; }) };
  var el = openSheet('<div class="grow"><div class="eyebrow">' + esc(K.biz.name) + '</div><h2>Kasa ayarları</h2></div>',
    '<section class="set-sec"><h3>' + I.table + 'Masalar</h3>' +
      '<div class="row between"><span class="lbl">Masa sayısı</span><div class="stepper"><button type="button" id="snm">−</button><input id="sn" type="number" min="0" max="100" value="' + st.n + '" inputmode="numeric" aria-label="Masa sayısı"><button type="button" id="snp">+</button></div></div>' +
      '<div class="field"><label for="swn">Wi-Fi ağ adı</label><input class="input" id="swn" maxlength="64" autocapitalize="none" autocomplete="off" value="' + attr(s.wifi_name || "") + '" placeholder="İsteğe bağlı"></div>' +
      '<div class="field"><label for="swp">Wi-Fi şifresi</label><input class="input" id="swp" maxlength="64" autocapitalize="none" autocomplete="off" value="' + attr(s.wifi_pass || "") + '" placeholder="İsteğe bağlı"></div>' +
      '<div class="field"><label for="smn">Menü linki</label><input class="input" id="smn" inputmode="url" autocapitalize="none" value="' + attr(s.menu_url || "") + '" placeholder="https://..."></div>' +
      '<p class="hint">Wi-Fi ve menü, masadaki NFC/QR ile açılan müşteri sayfasında görünür.</p></section>' +
    '<section class="set-sec"><div class="row between"><h3>' + I.coffee + 'Hızlı ürünler</h3><button class="link-btn small" type="button" id="sqb">Toplu düzenle</button></div>' +
      '<div id="sqBox"></div><p class="hint">En fazla 40 ürün. Sık sattıklarını üste al; masa ekranında bu sırayla görünür.</p></section>' +
    '<section class="set-sec"><h3>' + I.link + 'Masa linkleri</h3><div id="slBox"></div></section>' +
    '<section class="set-sec"><h3>' + I.sun + 'Ekran</h3>' +
      '<div class="seg" role="group" aria-label="Tema">' + [["system", "Otomatik"], ["light", "Açık"], ["dark", "Koyu"]].map(function(x){ return '<button type="button" data-th="' + x[0] + '" aria-pressed="' + (themeGet() === x[0]) + '">' + x[1] + '</button>'; }).join("") + '</div>' +
      '<div class="opt"><label class="switch"><input type="checkbox" id="ssd"' + (sndOn() ? " checked" : "") + '><span></span></label><div class="grow"><b>Sesli uyarı</b><span class="small muted">Garson çağrısı ve hesap isteğinde ses çalar.</span></div><button class="btn ghost xs" type="button" id="sst">Dene</button></div>' +
      '<div class="opt"><label class="switch"><input type="checkbox" id="saw"' + (awakeOn() ? " checked" : "") + '><span></span></label><div class="grow"><b>Ekran açık kalsın</b><span class="small muted">Kasa ekranı açıkken telefon ya da tablet uyumaz.</span></div></div></section>' +
    '<section class="set-sec"><h3>' + I.panel + 'Hesap</h3><div class="row wrap"><a class="btn ghost sm" href="' + (DEMO ? SITE : "") + '/panel.html" target="_blank" rel="noopener">' + I.ext + 'İşletme paneli</a>' +
      '<button class="btn danger sm" type="button" id="slo">' + I.out + 'Çıkış yap</button></div>' +
      '<p class="hint">Kasa ' + (K.ext ? "ek kurulumu açık: ödemeler ve ciro kaydediliyor." : "ek kurulumu kapalı: hesaplar kapatılınca kayıt tutulmaz.") + '</p></section>',
    { k: "settings", tall: true, foot: '<div class="row"><p class="form-msg grow" id="smsg"></p><button class="btn" type="button" id="ssave">' + I.check + 'Kaydet</button></div>' });
  void el;
  $("snm").onclick = function(){ var i = $("sn"); i.value = Math.max(0, Number(i.value || 0) - 1); };
  $("snp").onclick = function(){ var i = $("sn"); i.value = Math.min(100, Number(i.value || 0) + 1); };
  document.querySelectorAll("[data-th]").forEach(function(b){ b.onclick = function(){ themeSet(b.getAttribute("data-th")); document.querySelectorAll("[data-th]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); }; });
  $("ssd").onchange = function(){ lsSet("dmgk_snd", this.checked ? "1" : "0"); if(this.checked) unlockAudio(); sndBtn(); sndHint(); };
  $("sst").onclick = function(){ unlockAudio(); setTimeout(function(){ beep("garson"); }, 200); };
  $("saw").onchange = function(){ lsSet("dmgk_awake", this.checked ? "1" : "0"); if(this.checked) keepAwake(); else releaseAwake(); };
  $("slo").onclick = async function(){ if(await confirmBox({ title: "Çıkış yapılsın mı?", ok: "Çıkış yap", danger: true })) logout(); };
  $("sqb").onclick = function(){ syncQp(st); st.bulk = !st.bulk; this.textContent = st.bulk ? "Liste görünümü" : "Toplu düzenle"; drawQp(st); };
  $("ssave").onclick = function(){ saveSettings(st, this); };
  drawQp(st); drawLinks();
}
function syncQp(st){
  if(st.bulk){
    var t = $("sqT");
    if(t){ var q = parseQuick(t.value); if(q !== false) st.qp = q.map(function(x){ return { n: x.n, p: String(x.p).replace(".", ",") }; }); }
  } else {
    document.querySelectorAll("#sqBox .qp-row").forEach(function(r, i){ if(st.qp[i]){ st.qp[i].n = r.querySelector(".qn").value; st.qp[i].p = r.querySelector(".qpz").value; } });
  }
}
function drawQp(st){
  var box = $("sqBox");
  if(!box) return;
  if(st.bulk){
    box.innerHTML = '<textarea class="textarea" id="sqT" rows="8" placeholder="Latte = 110&#10;Türk kahvesi = 80">' + esc(st.qp.map(function(x){ return x.n + " = " + x.p; }).join("\n")) + '</textarea><p class="hint">Her satıra bir ürün: Ürün = fiyat</p>';
    return;
  }
  box.innerHTML = '<div class="qp-list">' + st.qp.map(function(x, i){
    return '<div class="qp-row"><input class="input qn" maxlength="40" value="' + attr(x.n) + '" placeholder="Ürün" aria-label="Ürün adı"><input class="input qpz num" inputmode="decimal" value="' + attr(x.p) + '" placeholder="Fiyat" aria-label="Fiyat">' +
      '<div class="acts"><button class="icon-btn sm" type="button" data-qu="' + i + '" aria-label="Yukarı"' + (i ? "" : " disabled") + '>' + I.up + '</button><button class="icon-btn sm" type="button" data-qx="' + i + '" aria-label="Sil">' + I.trash + '</button></div></div>';
  }).join("") + '</div><button class="btn ghost sm" type="button" id="sqAdd"' + (st.qp.length >= 40 ? " disabled" : "") + '>' + I.plus + 'Ürün ekle</button>';
  box.querySelectorAll("[data-qu]").forEach(function(b){ b.onclick = function(){ syncQp(st); var i = Number(b.getAttribute("data-qu")); var x = st.qp.splice(i, 1)[0]; st.qp.splice(i - 1, 0, x); drawQp(st); }; });
  box.querySelectorAll("[data-qx]").forEach(function(b){ b.onclick = function(){ syncQp(st); st.qp.splice(Number(b.getAttribute("data-qx")), 1); drawQp(st); }; });
  $("sqAdd").onclick = function(){ syncQp(st); st.qp.push({ n: "", p: "" }); drawQp(st); var rows = box.querySelectorAll(".qn"); rows[rows.length - 1].focus(); };
}
function parseQuick(text){
  var out = [], lines = String(text || "").split("\n");
  for(var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if(!l) continue;
    var m = l.match(/^(.+?)\s*[=:]?\s*([0-9]{1,6}(?:[.,][0-9]{1,2})?)\s*(?:₺|tl)?$/i);
    if(!m){ toast((i + 1) + ". satır anlaşılmadı. Örnek: Latte = 120", "bad"); return false; }
    var n = m[1].replace(/[=:]\s*$/, "").trim(), p = Number(m[2].replace(",", "."));
    if(!n || n.length > 40){ toast((i + 1) + ". satırdaki ürün adı 1–40 karakter olmalı", "bad"); return false; }
    out.push({ n: n, p: p });
  }
  return out;
}
function drawLinks(){
  var box = $("slBox");
  if(!box) return;
  var ts = tables(), base = tableBase();
  if(!ts.length){ box.innerHTML = '<p class="hint">Önce masa sayısını gir ve kaydet.</p>'; return; }
  box.innerHTML = '<p class="hint">Her masanın NFC etiketine ve QR koduna kendi linki yazılır. Linkler değişmez. Basılı QR kartları için işletme panelindeki Masalar bölümünü kullan.</p>' +
    ts.map(function(t){ return '<div class="lk-i"><b style="width:56px">Masa ' + t.no + '</b><div class="grow"><code>' + esc(base + t.token) + '</code></div><button class="icon-btn sm" type="button" data-cl="' + attr(base + t.token) + '" aria-label="Kopyala">' + I.copy + '</button></div>'; }).join("") +
    '<button class="btn ghost sm" type="button" id="slAll">' + I.copy + 'Tüm linkleri kopyala</button>';
  box.querySelectorAll("[data-cl]").forEach(function(b){ b.onclick = function(){ copyText(b.getAttribute("data-cl"), "Link kopyalandı"); }; });
  $("slAll").onclick = function(){ copyText(K.biz.name + " masa linkleri\n" + ts.map(function(t){ return "Masa " + t.no + ": " + base + t.token; }).join("\n"), "Tüm linkler kopyalandı"); };
}
async function saveSettings(st, btn){
  var msg = $("smsg");
  function err(m, id){ msg.className = "form-msg err grow"; msg.textContent = m; if(id){ var e = $(id); if(e){ e.classList.add("bad"); e.focus(); setTimeout(function(){ e.classList.remove("bad"); }, 2500); } } }
  var n = parseInt($("sn").value, 10), wn = $("swn").value.trim(), wp = $("swp").value.trim(), mn = normUrl($("smn").value);
  if(!(n >= 0 && n <= 100)) return err("Masa sayısı 0 ile 100 arasında olmalı.", "sn");
  if(mn === false) return err("Menü linki geçersiz. Örnek: https://ornek.com/menu", "smn");
  var q;
  if(st.bulk){ q = parseQuick($("sqT").value); if(q === false) return err("Hızlı ürün listesini kontrol et."); }
  else {
    syncQp(st); q = [];
    for(var i = 0; i < st.qp.length; i++){
      var x = st.qp[i], nm = String(x.n || "").trim(), pr = parsePrice(x.p);
      if(!nm && !String(x.p || "").trim()) continue;
      if(!nm || nm.length > 40) return err((i + 1) + ". ürünün adı 1–40 karakter olmalı.");
      if(pr === null) return err(nm + " için fiyat geçersiz. Örnek: 120 ya da 85,50");
      q.push({ n: nm, p: pr });
    }
  }
  if(q.length > 40) return err("En fazla 40 hızlı ürün ekleyebilirsin.");
  var before = tables().length;
  if(n < before){
    var openGone = tables().filter(function(t){ return t.no > n && Number(t.total) > 0; });
    var ok = await confirmBox({ title: (before - n) + " masa kapatılacak", text: "Kapanan masaların linkleri çalışmaz." + (openGone.length ? " Dikkat: " + openGone.map(function(t){ return "Masa " + t.no; }).join(", ") + " hesabı açık." : ""), ok: "Devam et", danger: true });
    if(!ok) return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin sm"></span>Kaydediliyor';
  try {
    var r = await rpc("owner_tables_save", { p_id: bid(), p_count: n, p_wifi_name: wn, p_wifi_pass: wp, p_menu_url: mn || "", p_quick: q });
    var errs = { bad_count: "Masa sayısı geçersiz.", bad_wifi: "Wi-Fi bilgisi çok uzun.", bad_url: "Menü linki geçersiz.", bad_quick: "Hızlı ürün listesi geçersiz." };
    if(!r || r.status !== "ok") throw new Error(errs[r && r.status] || ("Kaydedilemedi: " + (r && r.status)));
    setTs(r);
    closeSheet();
    toast("Ayarlar kaydedildi");
    route();
  } catch(e){
    err(netMsg(e));
    btn.disabled = false; btn.innerHTML = I.check + "Kaydet";
  }
}

/* =========================================================
   Başlat
   ========================================================= */
async function start(){
  app.innerHTML = '<div class="boot" role="status" aria-label="Yükleniyor"><div class="spin"></div></div>';
  if(DEMO){
    try { saveSession(await authCall()); await loadAll(); } catch(e){ showMsg("Bir sorun oluştu", '<p class="form-msg err">' + esc(netMsg(e)) + '</p>'); }
    return;
  }
  var rt = lsGet(SK);
  if(!rt){ showLogin(""); return; }
  try { saveSession(await authCall("refresh_token", { refresh_token: rt })); }
  catch(e){
    if(/Failed to fetch|NetworkError|Load failed/i.test(e.message)){ showMsg("Bağlantı yok", '<p class="ink2">İnternet bağlantısını kontrol edip Yenile\'ye bas.</p>', { icon: I.wifiOff }); return; }
    clearSession(); showLogin("Oturum süresi doldu, tekrar giriş yap."); return;
  }
  afterAuth();
}
start();
