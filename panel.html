<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Damgalio Panel</title>
<style>
:root{--bg:#0d0d0d;--card:#181818;--line:#2a2a2a;--mut:#a8a8a8;--or:#ee6a37;--ye:#f7d44c}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.brand{color:var(--or);font-weight:800}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
h1{font-size:22px;margin:4px 0}
p{color:var(--mut);line-height:1.5;margin:6px 0}
input[type=text],input[type=email],input[type=password]{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:#101010;color:#fff;font-size:16px}
input[type=color]{width:100%;height:48px;padding:4px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:#101010}
button{padding:12px 16px;border:0;border-radius:12px;background:var(--or);color:#111;font-size:16px;font-weight:800}
button.full{width:100%;margin-top:8px}
button.ghost,a.btn{background:transparent;color:var(--mut);border:1px solid var(--line);padding:10px 14px;font-size:14px;border-radius:12px;font-weight:800}
a.btn{display:inline-block;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--ye)}
.stat span{font-size:12px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.nm{font-weight:700}
.sub{font-size:13px;color:var(--mut)}
.badge{background:var(--ye);color:#111;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:800;display:inline-block;margin-top:4px}
.link{word-break:break-all;font-size:13px;color:var(--ye)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tg{display:flex;gap:12px;align-items:flex-start}
.tg input{width:24px;height:24px;margin:2px 0 0}
.pend{border-color:var(--ye)}
.paybox{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0}
.paybox .link{font-size:15px;margin:6px 0}
details summary{font-weight:700;cursor:pointer}
.lb{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.ok{color:#7be0a0}
.err{color:#ff7b7b}
input[type=number],textarea{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:#101010;color:#fff;font-size:16px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tb{background:#101010;border:1px solid var(--line);color:#fff;border-radius:14px;padding:12px 6px;text-align:center;font-size:15px}
.tb b{display:block;font-size:16px}
.tb span{display:block;font-size:13px;color:var(--mut);font-weight:700;margin-top:2px}
.tb.has span{color:var(--ye)}
.tb.call{border-color:var(--ye);background:#2a2410}
.tb.sel{border-color:var(--or);box-shadow:inset 0 0 0 2px var(--or)}
.callx{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#2a2410;border:1px solid var(--ye);border-radius:14px;padding:12px;margin-top:8px}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qk button{background:#101010;color:#fff;border:1px solid var(--line);font-size:14px;padding:9px 12px}
.addf{display:grid;grid-template-columns:1fr 64px 92px;gap:6px}
.addf input{margin:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var SB_URL = "https://rgtexozixcqrqhoepapr.supabase.co";
var SB_KEY = "sb_publishable_bKdS0htkq5rqCLIaulu5lQ_8LEqnFvg";
var app = document.getElementById("app");
var SK = "dmg_panel_rt";
var session = null, biz = null, customers = [], pending = [], todayCount = 0, poller = null, tickN = 0, payInfo = {};
var reviewReady = false;
var tablesReady = false, tst = null, selT = null, selI = null, seenCalls = null, actx = null, wl = null;
var sndOn = false;
try { sndOn = localStorage.getItem("dmgp_snd") === "1"; } catch(e){}

function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function saveSession(s){ session = s; try { localStorage.setItem(SK, s.refresh_token); } catch(e){} }
function clearSession(){ session = null; try { localStorage.removeItem(SK); } catch(e){} }
function savedRefresh(){ try { return localStorage.getItem(SK); } catch(e){ return null; } }
function fmtPhone(p){ return String(p || "").replace(/(\d{3})(\d{3})(\d{2})(\d{2})/, "$1 $2 $3 $4"); }
function fmtDate(d){ return d ? new Date(d).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "-"; }
function fmtDay(d){ return d ? new Date(d).toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric" }) : "-"; }
function money(n){ return Number(n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " ₺"; }
function isInactive(b){ return !!b.suspended || new Date(b.paid_until).getTime() <= Date.now(); }
function daysLeft(b){ return Math.ceil((new Date(b.paid_until).getTime() - Date.now()) / 86400000); }

function payHtml(){
  var p = payInfo || {};
  var raw = String(p.pay_iban || "").replace(/\s/g, "");
  var iban = raw.replace(/(.{4})/g, "$1 ").trim();
  if(!raw && !p.pay_name) return '<p>Ödeme bilgisi için Damgalio ile iletişime geç.</p>';
  return '<div class="paybox"><div class="sub">Havale / EFT ile ödeme</div>' +
    (p.pay_name ? '<div class="nm">' + esc(p.pay_name) + '</div>' : '') +
    (raw ? '<div class="link">' + esc(iban) + '</div>' : '') +
    '<div class="sub">Açıklamaya yaz: <b style="color:#fff">' + esc(biz.pay_ref || "") + '</b></div>' +
    (p.pay_monthly_fee ? '<div class="sub">Aylık ücret: ' + esc(money(p.pay_monthly_fee)) + '</div>' : '') +
    (p.pay_note ? '<p class="sub">' + esc(p.pay_note) + '</p>' : '') +
    (raw ? '<button class="ghost" data-iban="' + esc(raw) + '">IBAN kopyala</button>' : '') + '</div>';
}

function contactHtml(){
  var w = String(payInfo && payInfo.contact_wa || "");
  if(!/^[0-9]{10,15}$/.test(w)) return "";
  return '<a class="btn" href="https://wa.me/' + w + '" target="_blank" rel="noopener">WhatsApp ile yaz</a>';
}

function bindPay(root){
  root.querySelectorAll("button[data-iban]").forEach(function(b){
    b.onclick = function(){
      var t = b.getAttribute("data-iban");
      try { navigator.clipboard.writeText(t); alert("IBAN kopyalandı."); } catch(e){ prompt("IBAN:", t); }
    };
  });
}

function normUrl(v){
  v = (v || "").trim();
  if(!v) return null;
  if(/^http:\/\//i.test(v)) v = "https://" + v.slice(7);
  else if(!/^https:\/\//i.test(v)) v = "https://" + v;
  if(v.length > 200 || !/^https:\/\/[^\s"'<>]+$/.test(v)) return false;
  return v;
}

function normWa(v){
  var d = (v || "").replace(/\D/g, "");
  if(!d) return null;
  if(d.length === 11 && d.charAt(0) === "0") d = "90" + d.slice(1);
  else if(d.length === 10 && d.charAt(0) === "5") d = "90" + d;
  if(!/^[0-9]{10,15}$/.test(d)) return false;
  return d;
}

async function authCall(grant, body){
  var r = await fetch(SB_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  var j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.msg || ("Hata " + r.status));
  return j;
}

async function api(path, opts, retry){
  opts = opts || {};
  var h = { "apikey": SB_KEY, "Authorization": "Bearer " + session.access_token, "Content-Type": "application/json" };
  if(opts.headers){ for(var k in opts.headers){ h[k] = opts.headers[k]; } }
  var r = await fetch(SB_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(r.status === 401 && !retry){
    saveSession(await authCall("refresh_token", { refresh_token: session.refresh_token }));
    return api(path, opts, true);
  }
  var t = await r.text();
  if(!r.ok){ throw new Error(r.status + " " + t); }
  return t ? JSON.parse(t) : null;
}

function logout(){
  if(poller){ clearInterval(poller); poller = null; }
  document.title = "Damgalio Panel";
  clearSession();
  showLogin("");
}

var contactWa = null;
function loadContact(){
  if(contactWa !== null) return;
  try {
    fetch(SB_URL + "/rest/v1/rpc/public_contact", {
      method: "POST",
      headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
      body: "{}"
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(n){ n = String(n || "").replace(/\D/g, ""); contactWa = /^[0-9]{10,15}$/.test(n) ? n : ""; })
      .catch(function(){ contactWa = ""; });
  } catch(e){ contactWa = ""; }
}

function showLogin(msg){
  app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>İşletme Paneli</h1><p>Giriş yap.</p>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
    '<input type="email" id="em" placeholder="E-posta" autocomplete="username">' +
    '<input type="password" id="pw" placeholder="Şifre" autocomplete="current-password">' +
    '<button class="full" id="lg">Giriş Yap</button>' +
    '<a class="btn" id="fg" href="#" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:12px">Şifremi unuttum</a>' +
    '<p class="sub" id="fgm"></p></div>';
  document.getElementById("lg").onclick = login;
  document.getElementById("fg").onclick = function(e){
    var em = document.getElementById("em").value.trim();
    if(!contactWa){
      e.preventDefault();
      document.getElementById("fgm").textContent = "Şifreni sıfırlamak için Damgalio ile iletişime geç.";
      return;
    }
    var text = "Merhaba, Damgalio panel şifremi unuttum." + (em ? " E-postam: " + em : "");
    this.href = "https://wa.me/" + contactWa + "?text=" + encodeURIComponent(text);
    document.getElementById("fgm").textContent = "Damgalio şifreni sıfırlayıp sana WhatsApp'tan geçici bir şifre gönderecek.";
  };
  loadContact();
}

function needsNewPw(){
  var u = session && session.user;
  return !!(u && u.user_metadata && u.user_metadata.temp_pw);
}

function pwFormHtml(p){
  return '<input type="password" id="' + p + '1" placeholder="Yeni şifre (en az 8 karakter)" autocomplete="new-password">' +
    '<input type="password" id="' + p + '2" placeholder="Yeni şifre tekrar" autocomplete="new-password">' +
    '<button class="full" id="' + p + 'b">Şifreyi kaydet</button><p id="' + p + 'm"></p>';
}

function pwErr(m){
  m = String(m || "");
  if(/different from the old/i.test(m)) return "Yeni şifre eskisiyle aynı olamaz.";
  if(/at least|weak|short|characters/i.test(m)) return "Şifre çok zayıf. Daha uzun bir şifre seç.";
  if(/reauthenticat|nonce/i.test(m)) return "Güvenlik için çıkış yapıp tekrar giriş yap, sonra yeniden dene.";
  return m;
}

async function updateUser(body, retry){
  var r = await fetch(SB_URL + "/auth/v1/user", {
    method: "PUT",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + session.access_token, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(r.status === 401 && !retry){
    saveSession(await authCall("refresh_token", { refresh_token: session.refresh_token }));
    return updateUser(body, true);
  }
  var j = await r.json().catch(function(){ return {}; });
  if(!r.ok) throw new Error(j.msg || j.error_description || j.message || ("Hata " + r.status));
  if(session) session.user = j;
  return j;
}

function bindPwForm(p, done){
  document.getElementById(p + "b").onclick = async function(){
    var btn = this;
    var a = document.getElementById(p + "1").value, b2 = document.getElementById(p + "2").value;
    var msg = document.getElementById(p + "m");
    if(a.length < 8){ msg.className = "err"; msg.textContent = "Şifre en az 8 karakter olmalı."; return; }
    if(a !== b2){ msg.className = "err"; msg.textContent = "İki şifre aynı değil."; return; }
    btn.disabled = true; btn.textContent = "Kaydediliyor...";
    try {
      await updateUser({ password: a, data: { temp_pw: false } });
      document.getElementById(p + "1").value = "";
      document.getElementById(p + "2").value = "";
      msg.className = "ok"; msg.textContent = "Yeni şifren kaydedildi.";
      btn.disabled = false; btn.textContent = "Şifreyi kaydet";
      if(done) done();
    } catch(e){
      msg.className = "err"; msg.textContent = pwErr(e.message);
      btn.disabled = false; btn.textContent = "Şifreyi kaydet";
    }
  };
}

function showSetPw(){
  if(poller){ clearInterval(poller); poller = null; }
  app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>Yeni şifreni belirle</h1>' +
    '<p>Geçici şifreyle girdin. Devam etmek için kendine yeni bir şifre belirle. Telefonun şifreyi kaydetmeyi sorarsa kaydet.</p>' +
    pwFormHtml("np") + '<button class="ghost" id="lo" style="margin-top:10px">Çıkış</button></div>';
  bindPwForm("np", function(){ loadAll().catch(showFatal); });
  document.getElementById("lo").onclick = logout;
}

function showFatal(e){
  app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>Bir sorun oluştu</h1><p class="err">' + esc(e.message) + '</p><button class="ghost" id="lo">Çıkış</button></div>';
  document.getElementById("lo").onclick = logout;
}

function showLocked(){
  if(poller){ clearInterval(poller); poller = null; }
  document.title = "Damgalio Panel";
  var why = biz.suspended ? "Hesabın durduruldu." : "Hizmet süren " + fmtDay(biz.paid_until) + " tarihinde doldu.";
  app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>' + esc(biz.name) + '</h1>' +
    '<p class="err"><b>' + esc(why) + '</b></p>' +
    '<p>Şu an müşterilerin damga ekleyemiyor ve panelin kapalı. Verilerin silinmedi, hizmet yenilendiğinde her şey olduğu gibi açılır.</p>' +
    payHtml() + '<div class="acts">' + contactHtml() + '</div>' +
    '<p class="sub">Ödemeni yaptıktan sonra hizmetin yenilenir. Yenilenince aşağıdaki <b>Yenile</b> düğmesine bas.</p>' +
    '<div class="acts" style="margin-top:14px"><button class="ghost" id="rl">Yenile</button><button class="ghost" id="lo">Çıkış</button></div></div>';
  bindPay(app);
  document.getElementById("rl").onclick = function(){ loadAll().catch(showFatal); };
  document.getElementById("lo").onclick = logout;
}

async function login(){
  var em = document.getElementById("em").value.trim();
  var pw = document.getElementById("pw").value;
  var b = document.getElementById("lg");
  b.disabled = true; b.textContent = "Giriş yapılıyor...";
  try { saveSession(await authCall("password", { email: em, password: pw })); }
  catch(e){ showLogin(e.message === "Invalid login credentials" ? "E-posta veya şifre hatalı." : e.message); return; }
  if(needsNewPw()){ showSetPw(); return; }
  try { await loadAll(); } catch(e){ showFatal(e); }
}

function pendingQuery(){
  return "stamp_events?select=id,created_at,customers(name,phone)&business_id=eq." + biz.id + "&status=eq.pending&order=created_at";
}

async function loadAll(){
  var bs = await api("businesses?select=id,name,slug,tag_code,pay_ref,stamps_needed,require_approval,reward_text,reward_note,stamp_rule,brand_color,website_url,instagram_url,whatsapp,paid_until,suspended&order=created_at");
  if(!bs.length){
    app.innerHTML = '<div class="card"><div class="brand">Damgalio</div><h1>İşletme bulunamadı</h1><p>Bu hesaba bağlı işletme yok.</p><button class="ghost" id="lo">Çıkış</button></div>';
    document.getElementById("lo").onclick = logout;
    return;
  }
  biz = bs[0];
  try { payInfo = (await api("rpc/payment_info", { method: "POST", body: {} })) || {}; } catch(e){ payInfo = {}; }
  reviewReady = false;
  try {
    var g = await api("rpc/owner_get_review_url", { method: "POST", body: { p_id: String(biz.id) } });
    if(g && g.status === "ok"){ biz.google_review_url = g.url || null; reviewReady = true; }
  } catch(e){}
  tablesReady = false;
  try {
    var ts = await api("rpc/owner_tables_state", { method: "POST", body: { p_id: String(biz.id) } });
    if(ts && ts.status === "ok"){ setTst(ts); tablesReady = true; }
  } catch(e){}
  if(isInactive(biz)){ showLocked(); return; }
  customers = await api("customers?select=id,name,phone,stamps,rewards_available,last_stamp_at&business_id=eq." + biz.id + "&order=last_stamp_at.desc.nullslast&limit=500");
  var d = new Date(); d.setHours(0, 0, 0, 0);
  var ev = await api("stamp_events?select=id&business_id=eq." + biz.id + "&status=eq.approved&created_at=gte." + encodeURIComponent(d.toISOString()) + "&limit=1000");
  todayCount = ev.length;
  pending = await api(pendingQuery());
  render();
}

async function refreshPending(){
  if(document.hidden || !biz || !session) return;
  tickN++;
  try {
    if(tickN % 5 === 0){
      var st = await api("businesses?id=eq." + biz.id + "&select=paid_until,suspended");
      if(st && st.length){
        biz.paid_until = st[0].paid_until;
        biz.suspended = st[0].suspended;
        if(isInactive(biz)){ showLocked(); return; }
      }
    }
    pending = await api(pendingQuery());
    renderPending();
    if(tablesReady) await pollTables();
  } catch(e){}
}

function render(){
  var rewardsTotal = 0;
  customers.forEach(function(c){ rewardsTotal += c.rewards_available; });
  var link = location.origin + "/s/" + biz.tag_code;
  var dl = daysLeft(biz);
  app.innerHTML =
    '<div class="top"><div><div class="brand">Damgalio</div><h1>' + esc(biz.name) + '</h1>' +
    '<div class="sub">Hizmet bitişi: ' + esc(fmtDay(biz.paid_until)) + ' &middot; ' + dl + ' gün kaldı</div></div><button class="ghost" id="lo">Çıkış</button></div>' +
    (dl <= 7 ? '<div class="card pend"><b>Hizmet süren ' + dl + ' gün sonra bitiyor.</b><p>Kesinti olmaması için ödemeni yenile.</p>' + payHtml() + '<div class="acts">' + contactHtml() + '</div></div>' : '') +
    '<div class="card pend" id="pend" style="display:none"></div>' +
    (tablesReady ? '<div class="card" id="tbl"></div>' : '') +
    '<div class="stats">' +
    '<div class="stat"><b>' + customers.length + '</b><span>Müşteri</span></div>' +
    '<div class="stat"><b>' + todayCount + '</b><span>Bugün damga</span></div>' +
    '<div class="stat"><b>' + rewardsTotal + '</b><span>Bekleyen ödül bileti</span></div></div>' +
    '<div class="card" style="margin-top:12px"><label class="tg"><input type="checkbox" id="ra"' + (biz.require_approval ? ' checked' : '') + '>' +
    '<span><b>Damga onayı iste</b><br><span class="sub">Açıkken müşterinin damgası senin onayından sonra eklenir.</span></span></label></div>' +
    '<details class="card"><summary>Marka ve ödül ayarları</summary>' +
    '<label class="lb">Ödül (en fazla 60 karakter)</label><input type="text" id="s_rw" maxlength="60" placeholder="Bir filtre kahve">' +
    '<label class="lb">Ödül notu (en fazla 80 karakter)</label><input type="text" id="s_nt" maxlength="80" placeholder="İstediğin zaman kullan, süresi yok">' +
    '<label class="lb">Damga kuralı (en fazla 60 karakter)</label><input type="text" id="s_ru" maxlength="60" placeholder="Her kahve alışverişinde">' +
    '<label class="lb">Marka rengi</label><input type="color" id="s_col">' +
    '<label class="lb">WhatsApp numarası (isteğe bağlı)</label><input type="text" id="s_wa" placeholder="0555 123 45 67" inputmode="tel">' +
    '<label class="lb">Web sitesi (isteğe bağlı)</label><input type="text" id="s_site" placeholder="https://ornek.com" inputmode="url" autocapitalize="none">' +
    '<label class="lb">Instagram linki (isteğe bağlı)</label><input type="text" id="s_ig" placeholder="https://instagram.com/kullaniciadi" inputmode="url" autocapitalize="none">' +
    (reviewReady
      ? '<label class="lb">Google yorum linki (isteğe bağlı)</label><input type="text" id="s_gr" placeholder="https://g.page/r/.../review" inputmode="url" autocapitalize="none">' +
        '<p class="sub">Müşteri kartında "Yorum yap" butonu olarak görünür. Google İşletme Profili\'nde "Yorum iste" bölümündeki linki kopyalayıp yapıştır.</p>'
      : '') +
    '<button class="full" id="s_save">Kaydet</button><p id="s_msg"></p></details>' +
    '<details class="card"><summary>Ödeme bilgisi</summary>' + payHtml() + '<div class="acts">' + contactHtml() + '</div></details>' +
    '<details class="card"><summary>Şifremi değiştir</summary>' + pwFormHtml("chp") + '</details>' +
    '<div class="card"><div class="sub">NFC damgaya yazılacak link</div><div class="link">' + esc(link) + '</div>' +
    '<div class="acts" style="margin-top:8px"><button class="ghost" id="cp">Linki kopyala</button>' +

async function keepAwake(){
  try {
    if(sndOn && !wl && navigator.wakeLock && !document.hidden){
      wl = await navigator.wakeLock.request("screen");
      wl.addEventListener("release", function(){ wl = null; });
    }
  } catch(e){}
}
function unlockAudio(){
  try {
    if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
    if(actx.state !== "running") actx.resume();
  } catch(e){}
  keepAwake();
  setTimeout(renderSnd, 250);
}
function beep(){
  if(!sndOn || !actx || actx.state !== "running") return;
  var t = actx.currentTime;
  [0, 0.22, 0.6, 0.82].forEach(function(d, k){
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = k % 2 ? 1175 : 880;
    g.gain.setValueAtTime(0.0001, t + d);
    g.gain.exponentialRampToValueAtTime(0.4, t + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.32);
    o.connect(g); g.connect(actx.destination);
    o.start(t + d); o.stop(t + d + 0.36);
  });
}
function alertCall(){
  beep();
  try { if(navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
}
document.addEventListener("click", function(){ if(sndOn) unlockAudio(); }, true);
document.addEventListener("touchend", function(){ if(sndOn) unlockAudio(); }, true);

function parsePrice(v){
  v = String(v || "").trim().replace(/\s|₺|tl/gi, "").replace(",", ".");
  if(!/^[0-9]{1,6}(\.[0-9]{1,2})?$/.test(v)) return null;
  var n = Number(v);
  return n >= 0 && n <= 100000 ? n : null;
}

async function tItem(fn, body, btn, refresh){
  if(btn) btn.disabled = true;
  try {
    var r = await api("rpc/" + fn, { method: "POST", body: body });
    if(!r || r.status !== "ok"){ alert("İşlem yapılamadı: " + (r && r.status)); if(btn) btn.disabled = false; return; }
    selI = r;
    var t = findT(r.table_id);
    if(t){ t.total = r.total; t.n = r.items.length; }
    renderGrid(); renderEdit();
    if(refresh) await pollTables();
  } catch(e){ alert(e.message); if(btn) btn.disabled = false; }
}

function parseQuick(text){
  var out = [], lines = String(text || "").split("\n");
  for(var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if(!l) continue;
    var m = l.match(/^(.+?)\s*[=:]?\s*([0-9]{1,6}(?:[.,][0-9]{1,2})?)\s*(?:₺|tl)?$/i);
    if(!m){ alert((i + 1) + ". satır anlaşılmadı: \"" + l + "\"\nÖrnek: Latte = 120"); return false; }
    var n = m[1].replace(/[=:]\s*$/, "").trim(), p = Number(m[2].replace(",", "."));
    if(!n || n.length > 40){ alert((i + 1) + ". satırdaki ürün adı 1 ile 40 karakter arasında olmalı."); return false; }
    if(!(p >= 0 && p <= 100000)){ alert((i + 1) + ". satırdaki fiyat geçersiz."); return false; }
    out.push({ n: n, p: p });
  }
  if(out.length > 40){ alert("En fazla 40 hızlı ürün ekleyebilirsin."); return false; }
  return out;
}

  var n = parseInt(document.getElementById("t_n").value, 10);
  var wn = document.getElementById("t_wn").value.trim();
  var wp = document.getElementById("t_wp").value.trim();
  var mn = normUrl(document.getElementById("t_mn").value);
  var msg = document.getElementById("t_msg");
  if(!(n >= 0 && n <= 100)){ alert("Masa sayısı 0 ile 100 arasında olmalı."); return; }
  if(mn === false){ alert("Menü linki geçersiz. Örnek: https://ornek.com/menu"); return; }
  var q = parseQuick(document.getElementById("t_q").value);
  if(q === false) return;
  var before = (tst.tables || []).length;
  if(n < before && !confirm((before - n) + " masa kapatılacak. Kapanan masaların linkleri çalışmaz. Devam edilsin mi?")) return;
  var btn = document.getElementById("t_save");
  btn.disabled = true; btn.textContent = "Kaydediliyor...";
  try {
    var r = await api("rpc/owner_tables_save", { method: "POST", body: {
      p_id: String(biz.id), p_count: n, p_wifi_name: wn, p_wifi_pass: wp, p_menu_url: mn || "", p_quick: q } });
    var errs = { bad_count: "Masa sayısı geçersiz.", bad_wifi: "Wi-Fi bilgisi çok uzun.", bad_url: "Menü linki geçersiz.", bad_quick: "Hızlı ürün listesi geçersiz." };
    if(!r || r.status !== "ok") throw new Error(errs[r && r.status] || ("Kaydedilemedi: " + (r && r.status)));
    setTst(r);
    renderCalls(); renderGrid(); renderEdit(); renderLinks();
    msg.className = "ok"; msg.textContent = "Kaydedildi.";
  } catch(e){ msg.className = "err"; msg.textContent = e.message; }
  btn.disabled = false; btn.textContent = "Kaydet";
}

function renderLinks(){
  var box = document.getElementById("tlinks");
  if(!box) return;
  var ts = tst.tables || [];
  if(!ts.length){ box.innerHTML = '<p class="sub">Önce masa sayısını gir.</p>'; return; }
  var base = location.origin + "/m/";
  box.innerHTML = '<p class="sub">Her masanın NFC etiketine ve QR koduna kendi linki yazılır. Linkler değişmez.</p>' +
    ts.map(function(t){
      return '<div class="row"><div><div class="nm">Masa ' + t.no + '</div><div class="link">' + esc(base + t.token) + '</div></div>' +
        '<button class="ghost" data-cl="' + esc(base + t.token) + '">Kopyala</button></div>';
    }).join("") + '<button class="full" id="t_all">Tüm linkleri kopyala</button>';
  box.querySelectorAll("button[data-cl]").forEach(function(b){
    b.onclick = function(){ copyText(b.getAttribute("data-cl"), "Link kopyalandı."); };
  });
  document.getElementById("t_all").onclick = function(){
    copyText(biz.name + " masa linkleri\n" + ts.map(function(t){ return "Masa " + t.no + ": " + base + t.token; }).join("\n"), "Tüm linkler kopyalandı.");
  };
}

(async function(){
  var rt = savedRefresh();
  if(!rt){ showLogin(""); return; }
  app.innerHTML = '<p>Yükleniyor...</p>';
  try { saveSession(await authCall("refresh_token", { refresh_token: rt })); }
  catch(e){ clearSession(); showLogin("Oturum süresi doldu, tekrar giriş yap."); return; }
  if(needsNewPw()){ showSetPw(); return; }
  try { await loadAll(); } catch(e){ showFatal(e); }
})();
</script>
</body>
</html>
