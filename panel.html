function calendarHtml(ev){
  var t0 = startOfDay(Date.now()).getTime(), start = t0 - 89 * DAYMS, cnt = {};
  ev.forEach(function(e){ if(e.status === "approved"){ var k = startOfDay(e.created_at).getTime(); cnt[k] = (cnt[k] || 0) + 1; } });
  var max = 0;
  for(var k in cnt) if(cnt[k] > max) max = cnt[k];
  var first = start - wdMon(start) * DAYMS, cols = Math.ceil((t0 - first) / DAYMS / 7 + 0.01);
  var cells = "", months = "", lastM = -1;
  for(var c = 0; c < cols; c++){
    var colStart = first + c * 7 * DAYMS, m = new Date(colStart + 3 * DAYMS).getMonth();
    months += '<span style="grid-column:' + (c + 2) + '">' + (m !== lastM ? esc(new Date(colStart + 3 * DAYMS).toLocaleDateString("tr-TR", { month: "short" })) : "") + '</span>';
    lastM = m;
    for(var r = 0; r < 7; r++){
      var d = colStart + r * DAYMS;
      if(d < start || d > t0){ cells += '<i class="cal-x" style="grid-column:' + (c + 2) + ';grid-row:' + (r + 2) + '"></i>'; continue; }
      var v = cnt[d] || 0, lv = v === 0 ? 0 : Math.max(1, Math.ceil(v / max * 5));
      cells += '<i class="hc l' + lv + (d === t0 ? " today" : "") + '" style="grid-column:' + (c + 2) + ';grid-row:' + (r + 2) + '" title="' + attr(fmtLong(d) + ": " + v + " damga") + '" data-v="' + v + '" data-d="' + d + '"></i>';
    }
  }
  var rowL = WDM.map(function(w, i){ return '<span class="cal-y" style="grid-row:' + (i + 2) + '">' + (i % 2 === 0 ? w : "") + '</span>'; }).join("");
  return '<div class="cal-wrap"><div class="cal" style="--cols:' + cols + '">' + months + rowL + cells + '</div></div><div class="cal-info small muted" id="calInfo">Bir güne dokun, o günün sayısını gör.</div>';
}

/* =========================================================
   Ay sonu tahmini
   ========================================================= */
function monthForecast(ev){
  var now = new Date(), m0 = new Date(now.getFullYear(), now.getMonth(), 1).getTime(), mEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime();
  var t0 = startOfDay(now).getTime(), sofar = 0, last14 = 0;
  ev.forEach(function(e){
    if(e.status !== "approved") return;
    var t = new Date(e.created_at).getTime();
    if(t >= m0) sofar++;
    if(t >= t0 - 14 * DAYMS && t < t0) last14++;
  });
  var daysLeftM = Math.round((mEnd - t0) / DAYMS) - 1, todayPart = Math.max(0, 1 - (now.getHours() - 8) / 13);
  var perDay = last14 / 14;
  return { sofar: sofar, est: Math.round(sofar + perDay * (daysLeftM + clamp(todayPart, 0, 1))), month: now.toLocaleDateString("tr-TR", { month: "long" }), perDay: perDay };
}

/* =========================================================
   Tezgah modu PIN kilidi
   ========================================================= */
async function pinHash(p){
  try {
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("dmg:" + p));
    return Array.from(new Uint8Array(b)).map(function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
  } catch(e){
    var h = 5381; for(var i = 0; i < p.length; i++) h = ((h << 5) + h + p.charCodeAt(i)) | 0;
    return "s" + h;
  }
}
function pinPad(title, onDone){
  var d = document.createElement("div");
  d.className = "pin";
  d.setAttribute("role", "dialog");
  d.setAttribute("aria-modal", "true");
  var val = "";
  d.innerHTML = '<div class="pin-box"><h2>' + esc(title) + '</h2><div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>' +
    '<div class="pin-keys">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, "x", 0, "<"].map(function(k){
      return '<button type="button" data-pk="' + k + '">' + (k === "<" ? "⌫" : k === "x" ? "İptal" : k) + '</button>';
    }).join("") + '</div></div>';
  document.body.appendChild(d);
  function dots(){ d.querySelectorAll("#pinDots i").forEach(function(x, i){ x.classList.toggle("on", i < val.length); }); }
  function close(){ d.remove(); document.removeEventListener("keydown", key, true); }
  function press(k){
    if(k === "x"){ close(); onDone(null); return; }
    if(k === "<"){ val = val.slice(0, -1); dots(); return; }
    if(val.length >= 4) return;
    val += k; dots();
    if(val.length === 4){
      var v = val;
      setTimeout(function(){
        Promise.resolve(onDone(v)).then(function(ok){
          if(ok === false){ val = ""; dots(); var b = d.querySelector(".pin-box"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
          else close();
        });
      }, 120);
    }
  }
  function key(e){
    e.stopPropagation();
    if(/^[0-9]$/.test(e.key)) press(e.key);
    else if(e.key === "Backspace") press("<");
    else if(e.key === "Escape") press("x");
  }
  document.addEventListener("keydown", key, true);
  d.querySelectorAll("[data-pk]").forEach(function(b){ b.onclick = function(){ press(b.getAttribute("data-pk")); }; });
}

    '<div class="grow"><h3>Tezgah modu kilidi</h3><p class="small ink2">Tezgah modundan çıkmak için 4 haneli PIN iste. Kasadaki tableti personele bıraktığında müşteri listesi ve ayarlar kapalı kalır.</p></div></div>' +

/* =========================================================
   Masa QR sayfası (A4, masa başına bir kart)
   ========================================================= */
function tableUrl(t){ return (DEMO ? SITE : location.origin) + "/m/" + t.token; }
function tableSheetPages(tables){
  var per = 6, pages = [];
  for(var i = 0; i < tables.length; i += per) pages.push(tables.slice(i, i + per));
  return pages;
}
function renderTablePage(canvas, list){
  var W = 2480, H = 3508, m = 150, cols = 2, rows = 3, gx = 70, gy = 70;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d"), col = bizColor(), on = onColor(col);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  var cw = (W - m * 2 - gx * (cols - 1)) / cols, ch = (H - m * 2 - gy * (rows - 1)) / rows;
  list.forEach(function(t, i){
    var x = m + (i % cols) * (cw + gx), y = m + Math.floor(i / cols) * (ch + gy);
    ctx.setLineDash([18, 14]); ctx.strokeStyle = "#C9BFAE"; ctx.lineWidth = 3;
    rr(ctx, x, y, cw, ch, 40); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = col; rr(ctx, x + 40, y + 40, cw - 80, 150, 28); ctx.fill();
    ctx.fillStyle = on; ctx.textAlign = "left";
    ctx.font = "800 96px " + F_D;
    ctx.fillText("Masa " + t.no, x + 80, y + 148);
    ctx.font = "700 40px " + F_M; ctx.textAlign = "right";
    ctx.fillText(String(S.biz.name).toLocaleUpperCase("tr-TR").slice(0, 22), x + cw - 80, y + 136);
    var qs = Math.min(cw - 200, ch - 420);
    drawQrAt(ctx, tableUrl(t), x + (cw - qs) / 2, y + 230, qs, "#12231F", "#FFFFFF");
    ctx.fillStyle = "#12231F"; ctx.textAlign = "center"; ctx.font = "700 52px " + F_D;
    ctx.fillText("Menü · Wi-Fi · Garson çağır", x + cw / 2, y + 230 + qs + 80);
    ctx.fillStyle = "#4D5F5C"; ctx.font = "500 38px " + F_B;
    ctx.fillText("Telefonunla okut ya da NFC'ye yaklaştır", x + cw / 2, y + 230 + qs + 140);
  });
  ctx.fillStyle = "#8A968F"; ctx.font = "600 30px " + F_M; ctx.textAlign = "center";
  ctx.fillText("Kesik çizgilerden kes · Damgalio masa kartları", W / 2, H - 70);
}
function openTableQr(){
  var tables = (Mas.ts && Mas.ts.tables || []).filter(function(t){ return t.token; });
  if(!tables.length){ toast("Masa bulunamadı", "bad"); return; }
  var pages = tableSheetPages(tables);
  var el = openSheet('<div class="grow"><h2>Masa QR kartları</h2><div class="small muted">' + tables.length + ' masa · ' + pages.length + ' A4 sayfa</div></div>',
    '<p class="small ink2">Her masa için menü, Wi-Fi ve garson çağırma sayfasını açan QR. Yazdırıp kes, masaya koy ya da pleksi altına yerleştir.</p>' +
    '<div class="tq-pages">' + pages.map(function(p, i){ return '<figure><canvas id="tq' + i + '" aria-label="Sayfa ' + (i + 1) + '"></canvas><figcaption class="tiny muted">Sayfa ' + (i + 1) + ' · Masa ' + p[0].no + '–' + p[p.length - 1].no + '</figcaption></figure>'; }).join("") + '</div>' +
    '<div class="row"><button class="btn ghost grow" type="button" id="tqDl">' + I.dl + 'PNG indir</button><button class="btn grow" type="button" id="tqPr">' + I.printer + 'Yazdır</button></div>');
  el.setAttribute("data-k", "tableqr");
  fontsReady().then(function(){
    pages.forEach(function(p, i){ var c = $("tq" + i); if(c) renderTablePage(c, p); });
  });
  $("tqDl").onclick = function(){
    pages.forEach(function(p, i){
      var c = $("tq" + i);
      if(!c) return;
      setTimeout(function(){ c.toBlob(function(b){ if(b) downloadBlob("damgalio-masa-qr-" + (i + 1) + ".png", b); }, "image/png"); }, i * 400);
    });
    toast(pages.length + " sayfa indiriliyor");
  };
  $("tqPr").onclick = function(){
    var area = document.createElement("div");
    area.id = "printArea";
    area.innerHTML = '<style>@page{size:210mm 297mm;margin:0}#printArea img{page-break-after:always;break-after:page}</style>' +
      pages.map(function(p, i){ var c = $("tq" + i); return c ? '<img alt="" src="' + c.toDataURL("image/png") + '" style="width:210mm;height:297mm">' : ""; }).join("");
    document.body.appendChild(area);
    document.body.classList.add("printing-art");
    function done(){ document.body.classList.remove("printing-art"); area.remove(); window.removeEventListener("afterprint", done); }
    window.addEventListener("afterprint", done);
    setTimeout(function(){ window.print(); setTimeout(function(){ if(document.body.contains(area)) done(); }, 1500); }, 150);
  };
}

/* =========================================================

   ========================================================= */
function paretoHtml(d){
  var vi = visitIndex((Rep.ev || []).filter(function(e){ return new Date(e.created_at).getTime() >= d.from; }));
  var arr = Object.keys(vi).map(function(k){ return vi[k].n; }).sort(function(a, b){ return b - a; });
  if(arr.length < 5) return "";
  var tot = arr.reduce(function(a, x){ return a + x; }, 0), top = Math.max(1, Math.round(arr.length * 0.2));
  var share = Math.round(arr.slice(0, top).reduce(function(a, x){ return a + x; }, 0) / tot * 100);
  var avg = tot / arr.length;
  return '<section class="card"><div class="card-h"><div><h2>Damgalar kimden geliyor?</h2><p class="small muted">Müşteri yoğunlaşması</p></div></div>' +
    '<div class="pareto"><div class="pr-bar"><i style="width:' + share + '%"><span>%' + share + '</span></i><em>%' + (100 - share) + '</em></div>' +
    '<p class="small ink2">Damgaların <b>%' + share + '</b>\'i müşterilerin en çok gelen <b>%20</b>\'sinden (' + top + ' kişi) geliyor. ' +
    (share >= 60 ? 'Bu sadık çekirdeği kaybetmemek önemli; onlara teşekkür etmeyi unutma.' : 'Damgalar müşterilere dengeli dağılmış.') + '</p>' +
    '<dl class="kv"><dt>Müşteri başına damga</dt><dd>' + f1(avg) + '</dd><dt>En çok damga alan</dt><dd>' + arr[0] + '</dd></dl></div></section>';
}
