function exportCsv(){
  var rows = sortedFiltered();
  var lines = ["Ad;Telefon;Damga;Ödül bileti;Son damga;Etiketler;Not"];
  rows.forEach(function(c){
    var n = Store.note(c.id) || {};
    lines.push([c.name || "", fmtPhone(c.phone), c.stamps, c.rewards_available, c.last_stamp_at ? fmtDate(c.last_stamp_at) : "", (n.t || []).join(", "), n.n || ""].map(function(x){
      x = String(x); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
    }).join(";"));
  });
  try {
    var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "damgalio-musteriler.csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(rows.length + " müşteri indirildi");
  } catch(e){ toast("Liste indirilemedi", "bad"); }
}

async function redeem(c, btn){
  var ok = await confirmBox({ title: "Ödül kullanılsın mı?", text: (c.name || "Bu müşteri") + " için bir ödül bileti kullanıldı olarak işaretlenecek. Kalan bilet: " + (c.rewards_available - 1), ok: "Evet, kullanıldı" });
  if(!ok) return;
  if(btn){ btn.disabled = true; }
  try {
    var r = await api("rpc/redeem_reward", { method: "POST", body: { p_customer: c.id } });
    if(r.status !== "ok"){ toast("Ödül kullanılamadı: " + r.status, "bad"); if(btn) btn.disabled = false; return; }
    c.rewards_available = Math.max(0, c.rewards_available - 1);
    toast("Ödül kullanıldı. Afiyet olsun!");
    closeSheet();
    await loadAll();
  } catch(e){ toast(netMsg(e), "bad"); if(btn) btn.disabled = false; }
}

function renderApprList(){
  var box = $("apprL");

  }
  box.innerHTML = S.pending.map(function(p){

  box.querySelectorAll("[data-ap]").forEach(function(b){ b.onclick = function(){ decide("approve_stamp", Number(b.getAttribute("data-ap")), b); }; });
  box.querySelectorAll("[data-rj]").forEach(function(b){ b.onclick = function(){ decide("reject_stamp", Number(b.getAttribute("data-rj")), b); }; });
  var all = $("apAll");
  if(all) all.onclick = approveAll;
}

async function decide(fn, id, btn, quiet){
  if(btn) btn.disabled = true;
  try {
    var r = await api("rpc/" + fn, { method: "POST", body: { p_event: id } });
    if(r.status !== "ok"){ toast("İşlem yapılamadı: " + r.status, "bad"); if(btn) btn.disabled = false; return false; }
    var row = document.querySelector('[data-row="' + id + '"]');
    S.pending = S.pending.filter(function(p){ return p.id !== id; });
    if(row && !quiet){
      row.classList.add("leaving");
      setTimeout(renderApprList, 280);
    } else renderApprList();
    renderPendBar(); updateTitle();
    if(!quiet) toast(fn === "approve_stamp" ? "Damga onaylandı" : "Damga reddedildi", fn === "approve_stamp" ? "good" : "bad");
    reloadSoon();
    return true;
  } catch(e){ toast(netMsg(e), "bad"); if(btn) btn.disabled = false; return false; }
}

async function approveAll(){
  var ids = S.pending.map(function(p){ return p.id; });
  var b = $("apAll");
  if(b){ b.disabled = true; b.textContent = "Onaylanıyor..."; }
  var ok = 0;
  for(var i = 0; i < ids.length; i++){ if(await decide("approve_stamp", ids[i], null, true)) ok++; }
  toast(ok + " damga onaylandı");
}

function setColor(c){
  if(!hexOk(c)) return;
  S.draft.brand_color = c.toUpperCase();

  var ci = $("s_col"); if(ci && ci.value.toUpperCase() !== S.draft.brand_color) ci.value = S.draft.brand_color.toLowerCase();
  markDirty();
}

function markDirty(){
  var base = bizDraft(), d = S.draft;
  S.dirty = Object.keys(base).some(function(k){ return String(base[k] || "") !== String(d[k] || ""); });
  var bar = $("saveBar"); if(bar) bar.hidden = !S.dirty;
  var pv = $("pv"); if(pv) pv.innerHTML = previewHtml(d);
}

function downloadQr(link){
  try {
    var c = document.createElement("canvas");
    QR.draw(c, link, { scale: 24 });
    var out = document.createElement("canvas");
    var pad = 60, lh = 110;
    out.width = c.width + pad * 2; out.height = c.height + pad * 2 + lh;
    var x = out.getContext("2d");
    x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, out.width, out.height);
    x.drawImage(c, pad, pad);
    x.fillStyle = "#10221F"; x.textAlign = "center";
    x.font = "700 44px sans-serif";
    x.fillText(S.biz.name, out.width / 2, c.height + pad + 60);
    x.fillStyle = "#4D5F5C"; x.font = "500 30px sans-serif";
    x.fillText("Okut, damganı al · Damgalio", out.width / 2, c.height + pad + 104);
    var a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = "damgalio-qr-" + (S.biz.tag_code || "kart") + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    toast("QR indirildi");
  } catch(e){ toast("QR indirilemedi", "bad"); }
}

async function saveSettings(){
  var d = S.draft;
  var rt = String(d.reward_text).trim(), nt = String(d.reward_note).trim(), ru = String(d.stamp_rule).trim();
  var col = String(d.brand_color).toLowerCase();
  var wa = normWa(d.whatsapp), site = normUrl(d.website_url), ig = normUrl(d.instagram_url);
  var gr = S.reviewReady ? normUrl(d.google_review_url) : null;
  function bad(id, m){ var el = $(id); if(el){ el.classList.add("bad"); el.focus(); setTimeout(function(){ el.classList.remove("bad"); }, 2500); } toast(m, "bad"); }
  if(!rt || rt.length > 60) return bad("s_rw", "Ödül metni 1 ile 60 karakter arasında olmalı.");
  if(!nt || nt.length > 80) return bad("s_nt", "Ödül notu 1 ile 80 karakter arasında olmalı.");
  if(!ru || ru.length > 60) return bad("s_ru", "Damga kuralı 1 ile 60 karakter arasında olmalı.");
  if(wa === false) return bad("s_wa", "WhatsApp numarası geçersiz. Örnek: 0555 123 45 67");
  if(site === false) return bad("s_site", "Web adresi geçersiz. Örnek: https://ornek.com");
  if(ig === false) return bad("s_ig", "Instagram linki geçersiz. Örnek: https://instagram.com/kullaniciadi");
  if(gr === false) return bad("s_gr", "Google yorum linki geçersiz. Örnek: https://g.page/r/.../review");
  var btn = $("s_save");
  btn.disabled = true; btn.textContent = "Kaydediliyor...";
  try {
    var res = await api("businesses?id=eq." + S.biz.id + "&select=reward_text,reward_note,stamp_rule,brand_color,website_url,instagram_url,whatsapp", {
      method: "PATCH",
      body: { reward_text: rt, reward_note: nt, stamp_rule: ru, brand_color: col, whatsapp: wa, website_url: site, instagram_url: ig },
      headers: { "Prefer": "return=representation" }
    });
    if(!res || !res.length) throw new Error("Kaydedilemedi");
    var x = res[0];
    ["reward_text", "reward_note", "stamp_rule", "brand_color", "whatsapp", "website_url", "instagram_url"].forEach(function(k){ S.biz[k] = x[k]; });
    if(S.reviewReady && (gr || null) !== (S.biz.google_review_url || null)){
      var gres = await api("rpc/owner_set_review_url", { method: "POST", body: { p_id: String(S.biz.id), p_url: gr || "" } });
      if(!gres || gres.status !== "ok") throw new Error("Google yorum linki kaydedilemedi: " + (gres && gres.status));
      S.biz.google_review_url = gres.url || null;
    }
    S.draft = bizDraft(); S.dirty = false;
    toast("Ayarlar kaydedildi");
    renderShell();
  } catch(e){
    toast(netMsg(e), "bad");
    btn.disabled = false; btn.textContent = "Kaydet";
  }
}

async function toggleApproval(e){
  var box = e.target, val = box.checked;
  box.disabled = true;
  try {
    var res = await api("businesses?id=eq." + S.biz.id + "&select=require_approval", {
      method: "PATCH",
      body: { require_approval: val },
      headers: { "Prefer": "return=representation" }
    });
    if(!res || !res.length) throw new Error("Kaydedilemedi");
    S.biz.require_approval = val;
    toast(val ? "Damga onayı açıldı" : "Damga onayı kapatıldı");
  } catch(err){
    toast(netMsg(err), "bad");
    box.checked = !val;
  }
  box.disabled = false;
}

/* ---------- müşteri ziyaret analizi ---------- */
function visitIndex(events){
  var m = {};
  events.forEach(function(e){
    if(e.status !== "approved") return;
    var id = e.customers && e.customers.id;
    if(id == null) return;
    id = String(id);
    var t = new Date(e.created_at).getTime();
    var v = m[id] || (m[id] = { n: 0, first: t, last: t, times: [] });
    v.n++;
    if(t < v.first) v.first = t;
    if(t > v.last) v.last = t;
    v.times.push(t);
  });
  for(var k in m){
    var ts = m[k].times.sort(function(a, b){ return a - b; });
    var days = [], prevDay = null;
    ts.forEach(function(t){ var dk = dayKey(t); if(dk !== prevDay){ days.push(t); prevDay = dk; } });
    m[k].visitDays = days.length;
    var gaps = [];
    for(var i = 1; i < days.length; i++) gaps.push((days[i] - days[i - 1]) / 86400000);
    m[k].gap = gaps.length ? median(gaps) : null;
  }
  return m;
}
function median(a){
  if(!a.length) return null;
  var s = a.slice().sort(function(x, y){ return x - y; }), h = Math.floor(s.length / 2);
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
}

function computeSegments(vi, created){
  var need = S.biz.stamps_needed || 4, now = Date.now(), res = {};
  SEGMENTS.forEach(function(s){ res[s.id] = []; });
  var vipCut = Infinity;
  var counts = S.customers.map(function(c){ var v = vi[String(c.id)]; return v ? v.visitDays : 0; }).filter(function(n){ return n > 0; }).sort(function(a, b){ return b - a; });
  if(counts.length) vipCut = Math.max(6, counts[Math.max(0, Math.ceil(counts.length * 0.1) - 1)]);
  S.customers.forEach(function(c){
    var v = vi[String(c.id)], ds = daysSince(c.last_stamp_at);
    var firstAt = created && created[String(c.id)] ? new Date(created[String(c.id)]).getTime() : (v ? v.first : null);
    if(c.rewards_available > 0) res.ready.push(c);
    if(need > 1 && c.stamps === need - 1) res.near.push(c);
    if(firstAt && now - firstAt <= 14 * 86400000 && (created || (v && v.first > now - 76 * 86400000))) res["new"].push(c);
    if(v){
      var recentDays = {};
      v.times.forEach(function(t){ if(now - t <= 30 * 86400000) recentDays[dayKey(t)] = 1; });
      if(Object.keys(recentDays).length >= 4) res.loyal.push(c);
      if(v.visitDays >= vipCut) res.vip.push(c);
      if(v.visitDays >= 3 && v.gap && ds > Math.max(10, v.gap * 2) && ds < 30) res.risk.push(c);
      if(v.visitDays === 1 && ds >= 7 && ds < 30) res.once.push(c);
    }
    if(ds >= 30 && ds < Infinity) res.lost.push(c);
  });
  return res;
}

function lineChart(id, labels, series, opts){
  opts = opts || {};
  var W = Math.max(260, Math.round(opts.width || 640)), H = opts.height || 220, padL = 34, padR = 8, padT = 14, padB = 28;
  var max = 0;
  series.forEach(function(s){ s.values.forEach(function(v){ if(v != null && v > max) max = v; }); });
  var top = niceMax(max), steps = 4, n = labels.length;
  var iw = W - padL - padR, ih = H - padT - padB;
  function X(i){ return padL + (n <= 1 ? iw / 2 : iw * i / (n - 1)); }
  function Y(v){ return padT + ih - ih * (v / top); }
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + attr(opts.label || "") + '">';
  for(var s = 0; s <= steps; s++){
    var val = top / steps * s, y = Y(val);
    svg += '<line class="' + (s === 0 ? "base" : "grid") + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + Math.round(val) + '</text>';
  }
  var every = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(iw / 58))));
  labels.forEach(function(l, i){
    if((n - 1 - i) % every === 0) svg += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(l.s) + '</text>';
  });
  series.forEach(function(se, k){
    var pts = [];
    se.values.forEach(function(v, i){ if(v != null) pts.push([X(i), Y(v)]); });
    if(!pts.length) return;
    var d = pts.map(function(p, i){ return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    if(se.area) svg += '<path class="area s' + k + '" d="' + d + ' L' + pts[pts.length - 1][0].toFixed(1) + ',' + (padT + ih) + ' L' + pts[0][0].toFixed(1) + ',' + (padT + ih) + ' Z"/>';
    svg += '<path class="ln s' + k + (se.dash ? " dash" : "") + '" d="' + d + '"/>';
  });
  svg += '<line class="xh" x1="0" x2="0" y1="' + padT + '" y2="' + (padT + ih) + '" style="opacity:0"/>';
  series.forEach(function(se, k){ svg += '<circle class="dot s' + k + '" r="4.5" cx="-20" cy="-20"/>'; });
  svg += '<rect class="hit" x="' + padL + '" y="' + padT + '" width="' + iw + '" height="' + ih + '"/>';
  svg += '</svg><div class="tip" id="' + id + '-tip"></div>';
  var legend = series.length > 1 ? '<div class="legend">' + series.map(function(se, k){ return '<span><i class="lgd s' + k + (se.dash ? " dash" : "") + '"></i>' + esc(se.name) + '</span>'; }).join("") + '</div>' : '';
  return { html: legend + '<div class="chart-wrap line" id="' + id + '">' + svg + '</div>', bind: function(){
    bindChartGlobal();
    var wrap = $(id);
    if(!wrap) return;
    var svgEl = wrap.querySelector("svg"), tip = $(id + "-tip"), xh = wrap.querySelector(".xh"), dots = wrap.querySelectorAll(".dot");
    function show(clientX){
      var r = svgEl.getBoundingClientRect(), sx = (clientX - r.left) / r.width * W;
      var i = clamp(Math.round((sx - padL) / (n <= 1 ? 1 : iw / (n - 1))), 0, n - 1);
      var x = X(i);
      xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.style.opacity = 1;
      var rows = "";
      series.forEach(function(se, k){
        var v = se.values[i];
        if(v == null){ dots[k].setAttribute("cx", -20); return; }
        dots[k].setAttribute("cx", x); dots[k].setAttribute("cy", Y(v));
        rows += '<span class="tr"><i class="lgd s' + k + (se.dash ? " dash" : "") + '"></i>' + esc(se.name) + ' <b>' + (se.fmt ? se.fmt(v) : nf(v)) + '</b></span>';

/* ---------- grafik: yığılmış sütun (iki seri) ---------- */
function stackChart(id, cats, series, opts){
  opts = opts || {};
  var W = Math.max(260, Math.round(opts.width || 640)), H = opts.height || 210, padL = 34, padR = 6, padT = 14, padB = 28;
  var tot = cats.map(function(c, i){ return series.reduce(function(a, s){ return a + (s.values[i] || 0); }, 0); });
  var top = niceMax(Math.max.apply(null, tot.concat([0]))), steps = 4;
  var iw = W - padL - padR, ih = H - padT - padB, bw = iw / cats.length, barW = Math.max(8, Math.min(30, bw * 0.6));
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + attr(opts.label || "") + '">';
  for(var s = 0; s <= steps; s++){
    var val = top / steps * s, y = padT + ih - ih * (val / top);
    svg += '<line class="' + (s === 0 ? "base" : "grid") + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + Math.round(val) + '</text>';
  }
  var every = Math.max(1, Math.ceil(cats.length / Math.max(3, Math.floor(iw / 52))));
  cats.forEach(function(c, i){
    var cx = padL + bw * i + bw / 2, base = padT + ih, k, segs = [];
    for(k = 0; k < series.length; k++){
      var v = series[k].values[i] || 0;
      if(!v) continue;
      var h = ih * v / top;
      segs.push({ k: k, y: base - h, h: h });
      base -= h;
    }
    segs.forEach(function(sg, j){
      var isTop = j === segs.length - 1, gap = j > 0 ? 1 : 0;
      var x0 = cx - barW / 2, y0 = sg.y, hh = Math.max(0, sg.h - gap * 2), r = isTop ? Math.min(4, barW / 2, hh) : 0;
      var yb = y0 + hh;
      var p = 'M' + x0.toFixed(1) + ',' + yb.toFixed(1) + ' V' + (y0 + r).toFixed(1) +
        (r ? ' Q' + x0.toFixed(1) + ',' + y0.toFixed(1) + ' ' + (x0 + r).toFixed(1) + ',' + y0.toFixed(1) : '') +
        ' H' + (x0 + barW - r).toFixed(1) + (r ? ' Q' + (x0 + barW).toFixed(1) + ',' + y0.toFixed(1) + ' ' + (x0 + barW).toFixed(1) + ',' + (y0 + r).toFixed(1) : '') +
        ' V' + yb.toFixed(1) + ' Z';
      svg += '<path class="sb s' + sg.k + '" data-i="' + i + '" d="' + p + '"/>';
    });
    if((cats.length - 1 - i) % every === 0) svg += '<text x="' + cx.toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(c.s) + '</text>';
    svg += '<rect class="hit" data-i="' + i + '" x="' + (padL + bw * i).toFixed(1) + '" y="' + padT + '" width="' + bw.toFixed(1) + '" height="' + ih + '"/>';
  });
  svg += '</svg><div class="tip" id="' + id + '-tip"></div>';
  var legend = '<div class="legend">' + series.map(function(se, k){ return '<span><i class="lgd st' + k + '"></i>' + esc(se.name) + '</span>'; }).join("") + '</div>';
  return { html: legend + '<div class="chart-wrap stack" id="' + id + '">' + svg + '</div>', bind: function(){
    bindChartGlobal();
    var wrap = $(id), tip = $(id + "-tip");
    if(!wrap) return;
    function show(i){
      wrap.classList.add("hovering");
      wrap.querySelectorAll(".sb").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-i") === String(i)); });
      var rect = wrap.getBoundingClientRect();
      tip.innerHTML = '<b>' + esc(cats[i].l) + '</b>' + series.map(function(se, k){ return '<span class="tr"><i class="lgd st' + k + '"></i>' + esc(se.name) + ' <b>' + nf(se.values[i] || 0) + '</b></span>'; }).join("") +
        '<span class="tr muted2">Toplam <b>' + nf(tot[i]) + '</b></span>';
      tip.style.left = clamp((padL + bw * i + bw / 2) / W * rect.width, 70, rect.width - 70) + "px";
      tip.style.top = ((padT + ih - ih * tot[i] / top) / H * rect.height) + "px";
      tip.classList.add("on");
    }
    wrap.querySelectorAll(".hit").forEach(function(h){
      var i = Number(h.getAttribute("data-i"));
      h.addEventListener("mouseenter", function(){ show(i); });
      h.addEventListener("click", function(e){ e.stopPropagation(); show(i); });
    });
    wrap.addEventListener("mouseleave", function(){ wrap.classList.remove("hovering"); tip.classList.remove("on"); });
  } };
}

function reportData(){
  var R = Rep.range, now = Date.now(), t0 = startOfDay(now).getTime(), need = S.biz.stamps_needed || 4;
  var from = t0 - (R - 1) * DAYMS, prevFrom = from - R * DAYMS, hasPrev = R * 2 <= 90;
  var all = Rep.ev || [], created = Rep.created;
  var appr = all.filter(function(e){ return e.status === "approved"; });
  var inR = [], prev = [], rej = 0;
  all.forEach(function(e){
    var t = new Date(e.created_at).getTime();
    if(t >= from){ if(e.status === "approved") inR.push(e); else if(e.status === "rejected") rej++; }
    else if(hasPrev && t >= prevFrom && e.status === "approved") prev.push(e);
  });
  var vi90 = visitIndex(appr), viR = visitIndex(inR), viP = visitIndex(prev);
  function firstSeen(id){
    if(created && created[id]) return new Date(created[id]).getTime();
    return vi90[id] ? vi90[id].first : null;
  }
  var d = { R: R, from: from, need: need, hasPrev: hasPrev, approx: !created };
  d.stamps = inR.length; d.prevStamps = prev.length;
  d.uniq = Object.keys(viR).length; d.prevUniq = Object.keys(viP).length;
  d.newC = Object.keys(viR).filter(function(id){ var f = firstSeen(id); return f && f >= from; }).length;
  var gaps = [];
  Object.keys(vi90).forEach(function(id){ if(vi90[id].gap) gaps.push(vi90[id].gap); });
  d.gap = median(gaps);
  d.rewards = Math.floor(inR.length / need);
  d.rejRate = pct(rej, inR.length + rej);
  // günlük seri
  d.labels = []; d.daily = [];
  for(var i = R - 1; i >= 0; i--){
    var ds = t0 - i * DAYMS, dt = new Date(ds);
    d.labels.push({ s: R <= 7 ? WD3[dt.getDay()] : String(dt.getDate()), l: fmtLong(dt) });
    d.daily.push(0);
  }
  inR.forEach(function(e){ var ix = Math.floor((startOfDay(e.created_at).getTime() - from) / DAYMS + 0.01); if(ix >= 0 && ix < R) d.daily[ix]++; });
  d.ma = d.daily.map(function(x, i){
    if(i < 6) return null;
    var s = 0; for(var k = i - 6; k <= i; k++) s += d.daily[k];
    return Math.round(s / 7 * 10) / 10;
  });
  var best = 0; d.daily.forEach(function(x, i){ if(x > d.daily[best]) best = i; });
  d.bestDay = d.labels[best]; d.bestVal = d.daily[best];
  // ısı haritası
  d.heat = []; for(var r = 0; r < 7; r++) d.heat.push(new Array(24).fill(0));
  var hMin = 23, hMax = 0;
  inR.forEach(function(e){ var t = new Date(e.created_at), h = t.getHours(); d.heat[wdMon(t)][h]++; if(h < hMin) hMin = h; if(h > hMax) hMax = h; });
  if(hMin > hMax){ hMin = 8; hMax = 20; }
  hMin = Math.min(hMin, 8); hMax = Math.max(hMax, 20);
  d.hours = []; for(var h2 = hMin; h2 <= hMax; h2++) d.hours.push(("0" + h2).slice(-2));
  d.heatGrid = d.heat.map(function(row){ return row.slice(hMin, hMax + 1); });
  var pk = { v: -1 };
  d.heat.forEach(function(row, ri){ row.forEach(function(x, hi){ if(x > pk.v) pk = { v: x, r: ri, h: hi }; }); });
  d.peak = pk.v > 0 ? WDM_LONG[pk.r] + " " + ("0" + pk.h).slice(-2) + ":00" : null;
  // haftanın günleri ortalaması
  var wdCount = [0, 0, 0, 0, 0, 0, 0], wdN = [0, 0, 0, 0, 0, 0, 0];
  for(var j = 0; j < R; j++) wdN[wdMon(from + j * DAYMS + 3600000)]++;
  inR.forEach(function(e){ wdCount[wdMon(e.created_at)]++; });
  d.wdAvg = wdCount.map(function(c, k){ return wdN[k] ? c / wdN[k] : 0; });
  // yeni / dönen
  var bucket = R <= 7 ? 1 : 7, nb = Math.ceil(R / bucket);
  d.nrCats = []; d.nrNew = []; d.nrRet = [];
  for(var b = nb - 1; b >= 0; b--){
    var bEnd = t0 + DAYMS - b * bucket * DAYMS, bStart = Math.max(from, bEnd - bucket * DAYMS);
    var ids = {}, nw = 0, rt = 0;
    inR.forEach(function(e){ var t = new Date(e.created_at).getTime(); if(t >= bStart && t < bEnd && e.customers && e.customers.id != null) ids[String(e.customers.id)] = 1; });
    Object.keys(ids).forEach(function(id){ var f = firstSeen(id); if(f && f >= bStart) nw++; else rt++; });
    var sd = new Date(bStart), ed = new Date(bEnd - 1);
    d.nrCats.push({ s: bucket === 1 ? WD3[sd.getDay()] : trDate(sd).replace(/\s.*/, "") + "/" + (sd.getMonth() + 1), l: bucket === 1 ? fmtLong(sd) : trDate(sd) + " – " + trDate(ed) });
    d.nrNew.push(nw); d.nrRet.push(rt);
  }
  // damga dağılımı
  d.dist = [];
  for(var s = 0; s < need; s++) d.dist.push({ l: s + " damga", v: S.customers.filter(function(c){ return c.stamps === s && !c.rewards_available; }).length, hl: s === need - 1 });
  d.dist.push({ l: "Bileti var", v: S.customers.filter(function(c){ return c.rewards_available > 0; }).length });
  // ziyaret sıklığı
  var fb = [["1 gün", 1, 1], ["2 gün", 2, 2], ["3–4 gün", 3, 4], ["5–9 gün", 5, 9], ["10+ gün", 10, 1e9]];
  d.freq = fb.map(function(f){ return { l: f[0], v: Object.keys(viR).filter(function(id){ var n = viR[id].visitDays; return n >= f[1] && n <= f[2]; }).length }; });
  d.oncePct = pct(d.freq[0].v, d.uniq);
  // en iyi müşteriler
  d.top = Object.keys(viR).map(function(id){ return { id: id, n: viR[id].visitDays, s: viR[id].n, last: viR[id].last }; })
    .sort(function(a, b2){ return b2.n - a.n || b2.s - a.s || b2.last - a.last; }).slice(0, 10);
  // kohort (ilk ziyaret haftasına göre geri dönüş)
  d.cohorts = [];
  var weeks = 8, wk0 = t0 + DAYMS - weeks * 7 * DAYMS;
  var minStart = created ? 0 : (t0 - 89 * DAYMS + 21 * DAYMS);
  for(var w = 0; w < weeks; w++){
    var cs = wk0 + w * 7 * DAYMS, ce = cs + 7 * DAYMS;
    if(cs < minStart) continue;
    var members = Object.keys(vi90).filter(function(id){ var f = firstSeen(id); return f && f >= cs && f < ce; });
    var row = { l: trDate(cs), n: members.length, ret: [] };
    for(var k2 = 1; k2 <= 6; k2++){
      var ws = cs + k2 * 7 * DAYMS, we = ws + 7 * DAYMS;
      if(ws > now){ row.ret.push(null); continue; }
      var back = members.filter(function(id){ return vi90[id].times.some(function(t){ return t >= ws && t < we; }); }).length;
      row.ret.push(members.length ? Math.round(back / members.length * 100) : null);
    }
    d.cohorts.push(row);
  }
  d.vi90 = vi90;
  return d;
}

function cohortHtml(d){
  var rows = d.cohorts.filter(function(r){ return r.n > 0; });

  function lvl(p){ return p == null ? "na" : p === 0 ? "l0" : "l" + Math.min(5, Math.ceil(p / 20)); }
  return '<section class="card span2"><div class="card-h"><div><h2>Geri dönüş tablosu</h2><p class="small muted">İlk kez geldiği haftaya göre, sonraki haftalarda tekrar gelenlerin oranı' + (d.approx ? ' (yaklaşık)' : '') + '</p></div></div>' +

function reportText(d){
  var lines = [S.biz.name + " · Son " + d.R + " gün raporu", ""];
  lines.push("Damga: " + nf(d.stamps) + (d.hasPrev && d.prevStamps ? " (önceki döneme göre " + (d.stamps >= d.prevStamps ? "+" : "") + Math.round((d.stamps - d.prevStamps) / d.prevStamps * 100) + "%)" : ""));
  lines.push("Gelen müşteri: " + nf(d.uniq) + " · Yeni: " + nf(d.newC));
  if(d.gap) lines.push("Müşteriler ortalama " + f1(d.gap) + " günde bir geliyor");

function logReset(){ Log.rows = []; Log.done = false; Log.err = null; }

async function logMore(){
  if(Log.loading || Log.done) return;
  Log.loading = true; renderLog();
  try {
    var r = await api(logPath() + "&limit=100&offset=" + Log.rows.length);
    Log.rows = Log.rows.concat(r || []);
    if(!r || r.length < 100) Log.done = true;
    Log.err = null;
  } catch(e){ Log.err = e; }
  Log.loading = false;
  if(S.tab === "gunluk") renderLog();
}

function renderLog(){
  var box = $("logL");
  if(!box) return;

async function campData(){

  Camp.created = r[1];
  Camp.segs = computeSegments(Camp.vi, Camp.created);
  return Camp.segs;
}

function histHtml(hist){
  if(!hist.length) return '<div class="empty">' + I.megaphone + '<b>Henüz kampanya yok</b><span class="small">İlk mesajını gönderdiğinde sonuçlarını burada görürsün.</span></div>';
  var vi = Camp.vi || {};
  return '<div class="hist-c">' + hist.slice(0, 12).map(function(k){
    var at = new Date(k.at).getTime(), sent = k.sent || [];
    var back = sent.filter(function(id){ var v2 = vi[String(id)]; return v2 && v2.times.some(function(t){ return t > at; }); }).length;
    var seg = SEGMENTS.filter(function(s){ return s.id === k.seg; })[0];
    var title = k.name || (seg ? seg.t : (k.tag ? "Etiket: " + k.tag : "Kampanya"));

      '<div class="hc-r"><span class="ring-val sm">' + ring(rate, 100, 46, 5) + '<span>%' + rate + '</span></span><span class="tiny muted">' + back + ' kişi<br>geri geldi</span></div>' +
      '<button class="icon-btn sm" type="button" data-hd="' + attr(k.id) + '" aria-label="Kaydı sil">' + I.trash + '</button></div>';

/* ---------- mesaj hazırlama ---------- */
function audience(o){
  if(o.ids) return o.ids.map(custById).filter(Boolean);
  if(o.tag) return S.customers.filter(function(c){ var n = Store.note(c.id); return n && (n.t || []).indexOf(o.tag) > -1; });
  return (Camp.segs && Camp.segs[o.seg]) || [];
}

function openComposer(o){
  var base = audience(o).filter(function(c){ return /^\d{10,13}$/.test(String(c.phone || "").replace(/\D/g, "")); });
  var seg = o.seg ? SEGMENTS.filter(function(x){ return x.id === o.seg; })[0] : null;
  var title = seg ? seg.t : (o.tag ? "Etiket: " + o.tag : (o.title || "Seçili müşteriler"));
  var st = { skip: true, perm: false, text: o.text || CAMP_TPL[o.seg || "tag"] || CAMP_TPL.tag, consent: false };
  var saved = Store.pref("templates", []);
  var presets = [{ id: "_p", name: "Önerilen", text: CAMP_TPL[o.seg || "tag"] || CAMP_TPL.tag }].concat(saved);
  var el = openSheet('<div class="grow"><div class="eyebrow">Kampanya hazırla</div><h2 class="ell">' + esc(title) + '</h2></div>',
    '<div class="comp">' +
      '<div class="comp-step"><span class="cs-n">1</span><div class="grow"><h3>Kimlere?</h3>' +
        '<label class="check"><input type="checkbox" id="cpSkip" checked><span>Son 7 günde mesaj attıklarımı çıkar</span></label>' +
        '<label class="check"><input type="checkbox" id="cpPerm"><span>Sadece <b>Mesaj izni</b> etiketli olanlar</span></label>' +
        '<p class="small" id="cpCount"></p></div></div>' +
      '<div class="comp-step"><span class="cs-n">2</span><div class="grow"><h3>Mesaj</h3>' +
        '<div class="chips wrap-c" id="cpTpls">' + presets.map(function(t, i){ return '<button class="chip" type="button" data-tp="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(t.name) + '</button>'; }).join("") + '</div>' +
        '<textarea class="textarea" id="cpText" rows="5" maxlength="700">' + esc(st.text) + '</textarea>' +
        '<div class="var-row">' + CAMP_VARS.map(function(x){ return '<button class="chip xs" type="button" data-var="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join("") + '</div>' +
        '<div class="row between"><span class="tiny muted" id="cpLen"></span><button class="link-btn small" type="button" id="cpSave">Şablon olarak kaydet</button></div>' +
        '<div class="wa-prev"><div class="wa-h">' + I.wa + '<span id="cpWho"></span></div><div class="wa-b" id="cpPrev"></div></div></div></div>' +
      '<div class="comp-step"><span class="cs-n">3</span><div class="grow"><h3>Onay</h3>' +
        '<label class="check"><input type="checkbox" id="cpOk"><span>Bu kişilerin WhatsApp\'tan mesaj almayı kabul ettiğini onaylıyorum.</span></label>' +
        '<button class="btn block" type="button" id="cpGo" disabled>' + I.send + 'Gönderime başla</button>' +
        '<p class="tiny muted">Her kişi için WhatsApp açılır, mesaj hazır gelir. Gönder\'e sen basarsın.</p></div></div>' +
    '</div>');
  el.setAttribute("data-k", "comp");
  function list(){
    var rec = st.skip ? recentlyMessaged(7) : {};
    return base.filter(function(c){ return !rec[String(c.id)] && (!st.perm || hasPerm(c)); });
  }
  function upd(){
    var l = list(), ex = base.length - l.length;
    $("cpCount").innerHTML = '<b>' + l.length + '</b> kişiye gidecek' + (ex ? ' <span class="muted">(' + ex + ' kişi çıkarıldı)</span>' : '') +
      (base.length && !l.length ? '<br><span class="muted">Filtreler herkesi çıkardı.</span>' : '');
    var sample = l[0] || base[0] || { name: "Ayşe", stamps: 2, rewards_available: 1 };
    $("cpWho").textContent = (sample.name || "Müşteri") + " için önizleme";
    $("cpPrev").textContent = fillMsg(st.text, sample);
    $("cpLen").textContent = fillMsg(st.text, sample).length + " karakter";
    $("cpGo").disabled = !(st.consent && l.length && st.text.trim());
  }
  $("cpSkip").onchange = function(){ st.skip = this.checked; upd(); };
  $("cpPerm").onchange = function(){ st.perm = this.checked; upd(); };
  $("cpOk").onchange = function(){ st.consent = this.checked; upd(); };
  var ta = $("cpText");
  ta.oninput = function(){ st.text = ta.value; el.querySelectorAll("[data-tp]").forEach(function(x){ x.setAttribute("aria-pressed", "false"); }); upd(); };
  el.querySelectorAll("[data-tp]").forEach(function(b){
    b.onclick = function(){
      st.text = presets[Number(b.getAttribute("data-tp"))].text; ta.value = st.text;
      el.querySelectorAll("[data-tp]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      upd();
    };
  });
  el.querySelectorAll("[data-var]").forEach(function(b){
    b.onclick = function(){
      var v2 = b.getAttribute("data-var"), s0 = ta.selectionStart || ta.value.length, s1 = ta.selectionEnd || s0;
      ta.value = ta.value.slice(0, s0) + v2 + ta.value.slice(s1);
      ta.focus(); ta.setSelectionRange(s0 + v2.length, s0 + v2.length);
      st.text = ta.value; upd();
    };
  });
  $("cpSave").onclick = function(){ openTplEditor(null, st.text); };
  $("cpGo").onclick = function(){
    var l = list();
    var rec = { id: "k" + Date.now().toString(36), at: new Date().toISOString(), seg: o.seg || null, tag: o.tag || null, name: o.seg ? null : title, text: st.text, sent: [] };
    var all = campaigns().concat([rec]);
    if(all.length > 15) all = all.slice(all.length - 15);
    Store.setPref("campaigns", all);
    Camp.q = { id: rec.id, title: title, text: st.text, ids: l.map(function(c){ return String(c.id); }), idx: 0, done: {}, skipped: {} };
    openQueue();
  };
  upd();
}

/* ---------- gönderim kuyruğu ---------- */
function campRecord(){
  var q = Camp.q;
  return q ? campaigns().filter(function(k){ return k.id === q.id; })[0] : null;
}
function markSent(cid){
  var q = Camp.q, all = campaigns();
  all.forEach(function(k){ if(k.id === q.id && (k.sent || []).indexOf(cid) < 0){ k.sent = (k.sent || []).concat([cid]).slice(0, 400); } });
  Store.setPref("campaigns", all);
  q.done[cid] = 1;
}
function openQueue(){
  var el = openSheet('<div class="grow"><div class="eyebrow">Gönderim</div><h2 class="ell">' + esc(Camp.q.title) + '</h2></div>', '<div id="qBody"></div>', function(){ renderQueueBanner(); });
  el.setAttribute("data-k", "queue");
  renderQueue();
}
function renderQueue(){
  var box = $("qBody"), q = Camp.q;
  if(!box || !q) return;
  var total = q.ids.length, doneN = Object.keys(q.done).length, skipN = Object.keys(q.skipped).length;
  while(q.idx < total && (q.done[q.ids[q.idx]] || q.skipped[q.ids[q.idx]])) q.idx++;
  var c = q.idx < total ? custById(q.ids[q.idx]) : null;
  var prog = '<div class="q-prog"><div class="row between small"><b>' + doneN + ' / ' + total + ' gönderildi</b><span class="muted">' + skipN + ' atlandı</span></div>' +
    '<div class="bar-t"><i style="width:' + (total ? (doneN + skipN) / total * 100 : 0).toFixed(1) + '%"></i></div></div>';
  if(!c){
    box.innerHTML = prog + '<div class="empty">' + I.check + '<b>Gönderim tamamlandı</b><span class="small">' + doneN + ' kişiye mesaj hazırlandı. Geri gelenleri Kampanyalar sayfasında göreceksin.</span>' +
      '<button class="btn" type="button" id="qEnd">Bitir</button></div>';
    $("qEnd").onclick = function(){ Camp.q = null; closeSheet(); if(S.tab === "kampanya") renderCampaigns(); };
    return;
  }
  var msg = fillMsg(q.text, c);
  box.innerHTML = prog +
    '<div class="q-card"><div class="row">' + avatar(c) + '<div class="grow"><b class="ell" style="display:block">' + esc(c.name || "İsimsiz müşteri") + '</b><span class="small muted num">' + esc(phoneP(c.phone)) + '</span></div>' +
    '<span class="tiny muted">' + (q.idx + 1) + '. kişi</span></div>' +
    '<div class="wa-prev"><div class="wa-b">' + esc(msg) + '</div></div>' +
    '<a class="btn block wa" id="qSend" href="' + attr(waLink(c.phone, msg)) + '" target="_blank" rel="noopener">' + I.wa + 'WhatsApp\'ta aç</a>' +
    '<div class="row"><button class="btn ghost sm grow" type="button" id="qSkip">Atla</button><button class="btn ghost sm grow" type="button" id="qDone">Gönderdim, sıradaki</button></div></div>' +
    '<p class="tiny muted">WhatsApp açılınca Gönder\'e bas, sonra bu sayfaya dön. "WhatsApp\'ta aç"a basınca kişi gönderildi sayılır.</p>' +
    '<details class="q-rest"><summary class="small">Sıradaki kişiler (' + (total - q.idx - 1) + ')</summary><div class="small ink2">' +
      q.ids.slice(q.idx + 1, q.idx + 31).map(function(id){ var x = custById(id); return x ? esc(x.name || "İsimsiz") : ""; }).filter(Boolean).join(", ") + (total - q.idx - 1 > 30 ? "…" : "") + '</div></details>';
  $("qSend").onclick = function(){ markSent(String(c.id)); setTimeout(function(){ q.idx++; renderQueue(); }, 500); };
  $("qDone").onclick = function(){ markSent(String(c.id)); q.idx++; renderQueue(); };
  $("qSkip").onclick = function(){ q.skipped[String(c.id)] = 1; q.idx++; renderQueue(); };
}
function renderQueueBanner(){
  var h = $("campQ");
  if(!h) return;
  var q = Camp.q;
  if(!q){ h.innerHTML = ""; return; }
  var left = q.ids.filter(function(id){ return !q.done[id] && !q.skipped[id]; }).length;
  if(!left){ h.innerHTML = ""; return; }
  h.innerHTML = '<div class="card q-banner"><div class="opt"><span class="i-ic">' + I.send + '</span><div class="grow"><b>Yarım kalan gönderim: ' + esc(q.title) + '</b>' +
    '<div class="small ink2">' + Object.keys(q.done).length + ' gönderildi, ' + left + ' kişi kaldı</div></div>' +
    '<button class="btn sm" type="button" id="qCont">Devam et</button><button class="icon-btn sm" type="button" id="qDrop" aria-label="Bırak">' + I.x + '</button></div></div>';
  $("qCont").onclick = openQueue;
  $("qDrop").onclick = function(){ Camp.q = null; renderQueueBanner(); };
}

/* ---------- şablonlar ---------- */
function openTplEditor(id, text){
  var list = Store.pref("templates", []), t = id ? list.filter(function(x){ return x.id === id; })[0] : null;
  var d = document.createElement("div");
  d.className = "dialog wide";
  d.setAttribute("role", "dialog");
  d.innerHTML = '<h2>' + (t ? "Şablonu düzenle" : "Yeni şablon") + '</h2>' +
    '<div class="field"><label for="tpN">Ad</label><input class="input" id="tpN" maxlength="40" value="' + attr(t ? t.name : "") + '" placeholder="Örn. Hafta sonu daveti"></div>' +
    '<div class="field"><label for="tpT">Mesaj</label><textarea class="textarea" id="tpT" rows="5" maxlength="700">' + esc(t ? t.text : (text || "Merhaba {ad}! ")) + '</textarea>' +
    '<span class="hint">Kullanabileceğin alanlar: ' + CAMP_VARS.map(function(x){ return x[0]; }).join(" ") + '</span></div>' +
    '<div class="acts"><button class="btn ghost" type="button" data-r="0">Vazgeç</button><button class="btn" type="button" data-r="1">Kaydet</button></div>';
  document.body.appendChild(d);
  var own = document.createElement("div"); own.className = "scrim on top"; document.body.appendChild(own);
  function close(){ d.classList.remove("on"); own.remove(); setTimeout(function(){ d.remove(); }, 200); document.removeEventListener("keydown", key, true); }
  function key(e){ if(e.key === "Escape"){ e.stopPropagation(); close(); } }
  document.addEventListener("keydown", key, true);
  own.onclick = close;
  d.querySelector('[data-r="0"]').onclick = close;
  d.querySelector('[data-r="1"]').onclick = function(){
    var nm = $("tpN").value.trim(), tx = $("tpT").value.trim();
    if(!nm){ $("tpN").classList.add("bad"); $("tpN").focus(); return; }
    if(!tx){ $("tpT").classList.add("bad"); $("tpT").focus(); return; }
    var l2 = Store.pref("templates", []).slice();
    if(t) l2 = l2.map(function(x){ return x.id === t.id ? { id: x.id, name: nm, text: tx } : x; });
    else l2.push({ id: "t" + Date.now().toString(36), name: nm, text: tx });
    if(l2.length > 20){ toast("En fazla 20 şablon kaydedebilirsin", "bad"); return; }
    Store.setPref("templates", l2);
    close();
    toast("Şablon kaydedildi");
    if(S.tab === "kampanya" && $("campBody") && Camp.segs) renderCampaigns();
  };
  requestAnimationFrame(function(){ d.classList.add("on"); $("tpN").focus(); });
}
async function delTpl(id){
  var ok = await confirmBox({ title: "Şablon silinsin mi?", ok: "Sil", danger: true });
  if(!ok) return;
  Store.setPref("templates", Store.pref("templates", []).filter(function(x){ return x.id !== id; }));
  renderCampaigns();
}
async function delCampaign(id){
  var ok = await confirmBox({ title: "Kampanya kaydı silinsin mi?", text: "Sadece bu listedeki kayıt silinir. Gönderilmiş mesajlar etkilenmez.", ok: "Sil", danger: true });
  if(!ok) return;
  Store.setPref("campaigns", campaigns().filter(function(x){ return x.id !== id; }));
  renderCampaigns();
}

function custInsightHtml(rows){

  });

  var gaps = [];

/* ---------- çizim yardımcıları ---------- */
function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
var F_D = "'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif", F_B = "'Instrument Sans', -apple-system, 'Segoe UI', sans-serif", F_M = "'JetBrains Mono', ui-monospace, monospace";
function wrapLines(ctx, text, maxW){
  var words = String(text || "").split(/\s+/).filter(Boolean), lines = [], cur = "";
  words.forEach(function(w){
    var t = cur ? cur + " " + w : w;
    if(ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function fitText(ctx, text, maxW, maxLines, size, weight, fam, minSize){
  var s = size, lines;
  do {
    ctx.font = weight + " " + s + "px " + fam;
    lines = wrapLines(ctx, text, maxW);
    if(lines.length <= maxLines && lines.every(function(l){ return ctx.measureText(l).width <= maxW; })) break;
    s -= Math.max(1, Math.round(s * 0.05));
  } while(s > (minSize || 10));
  return { size: s, lines: lines.slice(0, maxLines) };
}
function drawLines(ctx, fit, x, y, lh, align){
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  fit.lines.forEach(function(l, i){ ctx.fillText(l, x, y + fit.size + i * fit.size * lh); });
  return fit.lines.length ? fit.size + (fit.lines.length - 1) * fit.size * lh : 0;
}
function drawQrAt(ctx, url, x, y, size, dark, light){
  var q = QR.encode(url), quiet = 3, n = q.size + quiet * 2, m = size / n;
  ctx.fillStyle = light;
  rr(ctx, x, y, size, size, size * 0.06); ctx.fill();
  ctx.fillStyle = dark;
  for(var yy = 0; yy < q.size; yy++) for(var xx = 0; xx < q.size; xx++){
    if(q.get(xx, yy)) ctx.fillRect(Math.floor(x + (xx + quiet) * m), Math.floor(y + (yy + quiet) * m), Math.ceil(m), Math.ceil(m));
  }
}
function drawNfc(ctx, cx, cy, s, col, bg){
  // telefon + dalgalar
  ctx.save();
  ctx.lineWidth = s * 0.07; ctx.strokeStyle = col; ctx.lineCap = "round";
  var pw = s * 0.46, ph = s * 0.8;
  rr(ctx, cx - s * 0.42, cy - ph / 2, pw, ph, s * 0.09); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - s * 0.42 + pw * 0.38, cy + ph / 2 - s * 0.1); ctx.lineTo(cx - s * 0.42 + pw * 0.62, cy + ph / 2 - s * 0.1); ctx.stroke();
  for(var i = 0; i < 3; i++){
    ctx.globalAlpha = 1 - i * 0.25;
    ctx.beginPath();
    ctx.arc(cx + s * 0.1, cy, s * (0.16 + i * 0.14), -Math.PI / 3.2, Math.PI / 3.2);
    ctx.stroke();
  }
  ctx.restore();

}
function drawSlots(ctx, x, y, w, need, filled, col, ring, dotCol, maxD){
  var g = w * 0.04, d = Math.min((w - g * (need - 1)) / need, w * 0.22, maxD || 1e9), tot = d * need + g * (need - 1), x0 = x + (w - tot) / 2;
  for(var i = 0; i < need; i++){
    var cx = x0 + i * (d + g) + d / 2, cy = y + d / 2;
    ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
    if(i < filled){ ctx.fillStyle = col; ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy, d * 0.16, 0, Math.PI * 2); ctx.fillStyle = dotCol; ctx.fill(); }
    else { ctx.setLineDash([d * 0.12, d * 0.1]); ctx.lineWidth = Math.max(2, d * 0.05); ctx.strokeStyle = ring; ctx.stroke(); ctx.setLineDash([]); }
  }

function drawTicket(ctx, x, y, w, h, col, on, bg, title, note, meta){
  ctx.fillStyle = col;
  rr(ctx, x, y, w, h, h * 0.16); ctx.fill();
  var py = y + h * 0.66, nr = h * 0.09;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(x, py, nr, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = on; ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1.5, h * 0.012);

  ctx.fillStyle = on;

  ctx.font = "700 " + Math.round(h * 0.1) + "px " + F_M; ctx.textAlign = "left";
  ctx.globalAlpha = 0.85; ctx.fillText(meta, x + pad, y + h * 0.2); ctx.globalAlpha = 1;
  var ft = fitText(ctx, title, w - pad * 2, 1, Math.round(h * 0.2), "800", F_D, 8);
  drawLines(ctx, ft, x + pad, y + h * 0.24, 1.1);
  if(note){
    var fn = fitText(ctx, note, w - pad * 2, 1, Math.round(h * 0.115), "500", F_B, 8);
    ctx.globalAlpha = 0.9; drawLines(ctx, fn, x + pad, y + h * 0.75, 1.1); ctx.globalAlpha = 1;
  }

  if(s.style === "renkli") {
    var on = onColor(c), dk = on === "#FFFFFF";
    return { bg: c, ink: on, ink2: dk ? "rgba(255,255,255,.8)" : "rgba(28,43,41,.75)", acc: dk ? "#FFFFFF" : "#12231F", on: dk ? c : "#FFFFFF", card: dk ? "rgba(255,255,255,.14)" : "rgba(18,35,31,.08)", ring: dk ? "rgba(255,255,255,.5)" : "rgba(18,35,31,.35)", qrD: "#12231F", qrL: "#FFFFFF" };
  }
  return { bg: "#F6F1E7", ink: "#12231F", ink2: "#4D5F5C", acc: c, on: onColor(c), card: "#FFFDF8", ring: "#C9BFAE", qrD: "#12231F", qrL: "#FFFFFF" };
}
function studioSize(t){ return t.px ? { w: t.px[0], h: t.px[1] } : { w: Math.round(t.mm[0] / 25.4 * 300), h: Math.round(t.mm[1] / 25.4 * 300) }; }

/* ---------- şablonlar ---------- */
function renderStudio(canvas, s){
  var t = s.tpl, sz = studioSize(t), W = sz.w, H = sz.h;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d"), p = palette(s), u = Math.min(W, H) / 100;
  var need = S.biz.stamps_needed || 4, url = qrUrl(s.qr), name = S.biz.name;
  ctx.fillStyle = p.bg; ctx.fillRect(0, 0, W, H);
  function brandRow(x, y, sz2, align){
    ctx.fillStyle = p.acc;
    var bw = sz2 * 1.6;
    var bx = align === "center" ? x - (bw + sz2 * 0.5 + measure(name, sz2)) / 2 : x;
    rr(ctx, bx, y, bw, bw, bw * 0.28); ctx.fill();
    ctx.fillStyle = p.on; ctx.font = "800 " + Math.round(sz2 * 0.8) + "px " + F_D; ctx.textAlign = "center";
    ctx.fillText(initials(name), bx + bw / 2, y + bw * 0.68);
    ctx.fillStyle = p.ink; ctx.font = "800 " + Math.round(sz2) + "px " + F_D; ctx.textAlign = "left";
    ctx.fillText(name, bx + bw + sz2 * 0.5, y + bw * 0.7);
  }
  function measure(txt, sz2){ ctx.font = "800 " + Math.round(sz2) + "px " + F_D; return ctx.measureText(txt).width; }
  function foot(y, align, x){
    ctx.fillStyle = p.ink2; ctx.font = "600 " + Math.round(u * 2.6) + "px " + F_M; ctx.textAlign = align || "center";
    var parts = [igHandle(), (S.biz.website_url || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")].filter(Boolean);
    ctx.fillText((parts.join("  ·  ") || "damgalio.com").toLocaleUpperCase("tr-TR"), x == null ? W / 2 : x, y);
  }
  if(t.id === "tezgah"){
    var m = u * 7;
    ctx.fillStyle = p.acc; rr(ctx, m * 0.6, m * 0.6, W - m * 1.2, H * 0.06, u * 2); ctx.fill();
    ctx.fillStyle = p.on; ctx.font = "700 " + Math.round(u * 3) + "px " + F_M; ctx.textAlign = "center";
    ctx.fillText("SADAKAT KARTI", W / 2, m * 0.6 + H * 0.04);
    var y = m * 0.6 + H * 0.06 + u * 6;
    brandRow(W / 2, y, u * 4.4, "center");
    y += u * 12;
    ctx.fillStyle = p.ink;
    y += drawLines(ctx, fitText(ctx, s.head, W - m * 2, 2, Math.round(u * 9.5), "800", F_D, 20), W / 2, y, 1.05, "center") + u * 2.5;
    ctx.fillStyle = p.ink2;
    y += drawLines(ctx, fitText(ctx, s.sub, W - m * 2, 2, Math.round(u * 4.2), "500", F_B, 12), W / 2, y, 1.3, "center") + u * 5;
    var d = drawSlots(ctx, m, y, W - m * 2, need, need - 1, p.acc, p.ring, p.on, u * 13);
    y += d + u * 5;
    if(s.ticket){ drawTicket(ctx, m, y, W - m * 2, u * 16, p.acc, p.on, p.bg, S.biz.reward_text || "Ödül", S.biz.reward_note || "", "ÖDÜL · " + need + " DAMGA"); y += u * 16 + u * 5; }
    var bottom = H - u * 13, qs = Math.min(u * 40, bottom - y);
    if(url && qs > u * 16){
      if(s.nfc){
        drawQrAt(ctx, url, m, y, qs, p.qrD, p.qrL);
        var tx = m + qs + u * 5, tw = W - m - tx;
        drawNfc(ctx, tx + u * 7, y + qs * 0.14, u * 12, p.ink);
        ctx.fillStyle = p.ink;
        var hh = drawLines(ctx, fitText(ctx, "Telefonunu damgaya yaklaştır", tw, 3, Math.round(u * 4.4), "700", F_D, 12), tx, y + qs * 0.36, 1.15);
        ctx.fillStyle = p.ink2;
        drawLines(ctx, fitText(ctx, "ya da QR'ı kamerayla okut", tw, 2, Math.round(u * 3.4), "500", F_B, 10), tx, y + qs * 0.36 + hh + u * 2.5, 1.25);
      } else drawQrAt(ctx, url, W / 2 - qs / 2, y, qs, p.qrD, p.qrL);
    } else if(s.nfc){ drawNfc(ctx, W / 2 + u * 3, y + Math.min(u * 14, (bottom - y) / 2), u * 24, p.ink); }
    foot(H - m * 0.9);
  } else if(t.id === "kapi"){
    ctx.fillStyle = p.acc; ctx.beginPath(); ctx.arc(W / 2, H / 2, W * 0.46, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = p.on; ctx.lineWidth = u * 0.8; ctx.setLineDash([u * 2, u * 1.6]);
    ctx.beginPath(); ctx.arc(W / 2, H / 2, W * 0.42, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = p.on; ctx.font = "700 " + Math.round(u * 3.4) + "px " + F_M; ctx.textAlign = "center";
    ctx.fillText(name.toLocaleUpperCase("tr-TR"), W / 2, H * 0.2);
    var yk = H * 0.25;
    if(s.nfc && !url){ drawNfc(ctx, W / 2 + u * 3, yk + u * 8, u * 16, p.on); yk += u * 19; }
    ctx.fillStyle = p.on;
    yk += drawLines(ctx, fitText(ctx, s.head, W * 0.66, 2, Math.round(u * 9), "800", F_D, 20), W / 2, yk, 1.05, "center") + u * 2.5;
    ctx.globalAlpha = 0.9;
    yk += drawLines(ctx, fitText(ctx, s.sub, W * 0.6, 2, Math.round(u * 3.8), "500", F_B, 12), W / 2, yk, 1.3, "center") + u * 3;
    ctx.globalAlpha = 1;
    if(url){ var q2 = u * 20; drawQrAt(ctx, url, W / 2 - q2 / 2, yk, q2, p.qrD, p.qrL); }
    else if(s.ticket){
      ctx.fillStyle = p.on; rr(ctx, W * 0.27, yk, W * 0.46, u * 8, u * 4); ctx.fill();
      ctx.fillStyle = p.acc; ctx.font = "800 " + Math.round(u * 3.4) + "px " + F_D; ctx.textAlign = "center";
      var ft2 = fitText(ctx, need + " damga = " + (S.biz.reward_text || "ödül"), W * 0.42, 1, Math.round(u * 3.4), "800", F_D, 10);
      ctx.font = "800 " + ft2.size + "px " + F_D; ctx.fillText(ft2.lines[0] || "", W / 2, yk + u * 5.3);
    }
  } else if(t.id === "kartvizit"){
    var mk = u * 9, qk = url ? Math.min(H - mk * 2, W * 0.34) : 0;
    ctx.fillStyle = p.acc; ctx.fillRect(0, 0, u * 3, H);
    brandRow(mk, mk * 0.9, u * 7.4);
    var yy = mk * 0.9 + u * 18;
    ctx.fillStyle = p.ink;
    yy += drawLines(ctx, fitText(ctx, s.head, W - mk * 2.4 - qk, 2, Math.round(u * 10), "800", F_D, 14), mk, yy, 1.05) + u * 4;
    if(s.ticket){
      ctx.fillStyle = p.ink2; ctx.font = "600 " + Math.round(u * 5) + "px " + F_B; ctx.textAlign = "left";
      ctx.fillText(need + " damga = " + (S.biz.reward_text || "ödül"), mk, yy + u * 5);
      yy += u * 10;
    }
    drawSlots(ctx, mk, Math.min(yy, H - mk - u * 12), Math.min(W * 0.42, (W - qk - mk * 3)), need, 0, p.acc, p.ring, p.on);
    if(url) drawQrAt(ctx, url, W - mk - qk, (H - qk) / 2, qk, p.qrD, p.qrL);
    if(s.nfc){ ctx.fillStyle = p.ink2; foot(H - mk * 0.55, "left", mk); }
  } else {
    // story & post
    var story = t.id === "story", ms = u * 8, ys = story ? H * 0.11 : H * 0.07;
    ctx.fillStyle = p.acc; ctx.globalAlpha = s.style === "renkli" ? 0.16 : 1;
    ctx.beginPath(); ctx.arc(W * 0.92, H * 0.05, W * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    brandRow(ms, ys, u * 4.6);
    ys += u * (story ? 16 : 13);
    ctx.fillStyle = p.ink;
    ys += drawLines(ctx, fitText(ctx, s.head, W - ms * 2, story ? 3 : 2, Math.round(u * (story ? 13 : 10.5)), "800", F_D, 24), ms, ys, 1.02) + u * 3.5;
    ctx.fillStyle = p.ink2;
    ys += drawLines(ctx, fitText(ctx, s.sub, W - ms * 2, 2, Math.round(u * (story ? 5 : 4.4)), "500", F_B, 14), ms, ys, 1.3) + u * (story ? 8 : 5);
    var cw = W - ms * 2, cBottom = H - u * 12, chh = cBottom - ys;
    ctx.fillStyle = p.card; rr(ctx, ms, ys, cw, chh, u * 5); ctx.fill();
    var pad = u * 6, iy = ys + u * 7, inner = cw - pad * 2;
    ctx.fillStyle = p.ink2; ctx.font = "700 " + Math.round(u * 3) + "px " + F_M; ctx.textAlign = "left";
    ctx.fillText("DAMGA KARTIN", ms + pad, iy);
    iy += u * 4;
    iy += drawSlots(ctx, ms + pad, iy, inner, need, need - 1, p.acc, p.ring, p.on, u * (story ? 18 : 14)) + u * 5;
    var tkH = u * (story ? 20 : 16);
    if(s.ticket && iy + tkH < cBottom - u * 4){ drawTicket(ctx, ms + pad, iy, inner, tkH, p.acc, p.on, p.card, S.biz.reward_text || "Ödül", S.biz.reward_note || "", "ÖDÜL · " + need + " DAMGA"); iy += tkH + u * 5; }
    var room = cBottom - u * 5 - iy;
    if(url && room > u * 14){
      var qq = Math.min(u * 26, room);
      drawQrAt(ctx, url, ms + pad, iy, qq, p.qrD, p.qrL);
      ctx.fillStyle = p.ink; ctx.textAlign = "left";
      var lbl = { review: "Yorumunu bekliyoruz", ig: "Bizi takip et", web: "Web sitemiz", stamp: "Okut, kartın açılsın" }[s.qr] || "";
      drawLines(ctx, fitText(ctx, lbl, inner - qq - u * 4, 2, Math.round(u * 4.4), "700", F_D, 12), ms + pad + qq + u * 4, iy + qq * 0.3, 1.15);
    } else if(s.nfc && room > u * 12){
      var ns = Math.min(u * 18, room);
      drawNfc(ctx, ms + pad + ns * 0.5, iy + ns * 0.5, ns, p.ink);
      ctx.fillStyle = p.ink;
      drawLines(ctx, fitText(ctx, "Kasada telefonunu yaklaştır, o kadar.", inner - ns - u * 4, 2, Math.round(u * 4.4), "700", F_B, 12), ms + pad + ns + u * 4, iy + ns * 0.18, 1.2);
    }
    foot(H - u * 6);
  }
}

function studioDraw(){
  clearTimeout(Studio.drawT);
  Studio.drawT = setTimeout(function(){
    var c = $("stC");
    if(!c) return;
    try { renderStudio(c, Studio.st); } catch(e){ toast("Tasarım çizilemedi", "bad"); }
  }, 60);
}

function studioFile(){ return "damgalio-" + Studio.st.tpl.id + "-" + (S.biz.tag_code || "isletme") + ".png"; }
function studioDownload(){

function studioPrint(){

  renderStudio(c, Studio.st);
  var area = document.createElement("div");
  area.id = "printArea";
  area.innerHTML = '<style>@page{size:' + t.mm[0] + 'mm ' + t.mm[1] + 'mm;margin:0}</style><img alt="" src="' + c.toDataURL("image/png") + '" style="width:' + t.mm[0] + 'mm;height:' + t.mm[1] + 'mm">';
  document.body.appendChild(area);
  document.body.classList.add("printing-art");
  function done(){ document.body.classList.remove("printing-art"); area.remove(); window.removeEventListener("afterprint", done); }
  window.addEventListener("afterprint", done);
  Dev.set("qrDone", true);
  setTimeout(function(){ window.print(); setTimeout(function(){ if(document.body.contains(area)) done(); }, 1500); }, 120);
}
/* =========================================================
   Tezgah modu: kasadaki tablet/telefon için tam ekran onay
   ========================================================= */
var Counter = {
  el: null, lock: null, clockT: null, feedT: null, feed: [], busy: {},
  open: function(){
    if(this.el) return;
    closeSheet(true); scrim(false);
    var el = document.createElement("div");
    el.className = "ctr";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", "Tezgah modu");
    var col = bizColor();
    el.innerHTML =
      '<header class="ctr-h"><div class="biz-av" style="background:' + col + ';color:' + onColor(col) + '">' + esc(initials(S.biz.name)) + '</div>' +
      '<div class="grow"><b class="ell">' + esc(S.biz.name) + '</b><span class="ctr-sub">Tezgah modu · ekran açık kalır</span></div>' +
      '<div class="ctr-clock" id="ctrClock"></div>' +
      '<button class="icon-btn" type="button" id="ctrSnd" aria-label="Ses"></button>' +
      '<button class="icon-btn" type="button" id="ctrFs" aria-label="Tam ekran">' + I.expand + '</button>' +
      '<button class="btn ghost sm" type="button" id="ctrX">' + I.x + 'Çık</button></header>' +
      '<main class="ctr-main" id="ctrMain"></main>';
    document.body.appendChild(el);
    document.body.classList.add("ctr-open");
    this.el = el;
    var self = this;
    $("ctrX").onclick = counterExit;
    $("ctrFs").onclick = function(){ self.fullscreen(); };
    $("ctrSnd").onclick = function(){ Dev.set("sound", Dev.get("sound", "zil") === "kapali" ? "zil" : "kapali"); self.sndBtn(); if(Dev.get("sound") !== "kapali"){ unlockAudio(); playSound(); } };
    this.sndBtn();
    document.addEventListener("keydown", this.key);
    this.tick(); this.clockT = setInterval(function(){ self.tick(); }, 15000);
    this.loadFeed(); this.feedT = setInterval(function(){ self.loadFeed(); }, 12000);
    this.wake();
    document.addEventListener("visibilitychange", this.vis);
    this.update();
    requestAnimationFrame(function(){ el.classList.add("on"); });
  },
  key: function(e){
    if(e.key === "Escape" && !document.querySelector(".dialog.on") && !document.querySelector(".pin")) counterExit();
    if(e.key === "Enter" && S.pending.length && !e.target.closest("input,textarea,button")){
      var b = document.querySelector(".ctr [data-cap]"); if(b) b.click();
    }
  },
  vis: function(){ if(!document.hidden && Counter.el){ Counter.wake(); Counter.tick(); } },
  sndBtn: function(){ var b = $("ctrSnd"); if(b) b.innerHTML = Dev.get("sound", "zil") === "kapali" ? I.mute : I.volume; },
  wake: async function(){
    try { if(navigator.wakeLock && !this.lock){ this.lock = await navigator.wakeLock.request("screen"); this.lock.addEventListener("release", function(){ Counter.lock = null; }); } } catch(e){}
  },
  fullscreen: function(){
    try {
      var d = document.documentElement;
      if(document.fullscreenElement){ document.exitFullscreen(); return; }
      if(d.requestFullscreen) d.requestFullscreen().catch(function(){ toast("Bu cihaz tam ekranı desteklemiyor. Ana ekrana ekleyip oradan aç.", "bad"); });
      else toast("Bu cihaz tam ekranı desteklemiyor. Ana ekrana ekleyip oradan aç.", "bad");
    } catch(e){}
  },
  tick: function(){
    var c = $("ctrClock");
    if(c) c.textContent = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  },
  loadFeed: async function(){
    if(!this.el) return;
    try {
      var r = await api("stamp_events?select=id,created_at,status,customers(id,name)&business_id=eq." + S.biz.id + "&status=eq.approved&created_at=gte." + encodeURIComponent(startOfDay(new Date()).toISOString()) + "&order=created_at.desc,id.desc&limit=1000");
      this.feed = r || [];
      if(S.stats) S.stats.today = this.feed.length;
      this.update();
    } catch(e){}
  },
  close: function(instant){
    if(!this.el) return;
    var el = this.el;
    this.el = null;
    clearInterval(this.clockT); clearInterval(this.feedT);
    document.removeEventListener("keydown", this.key);
    document.removeEventListener("visibilitychange", this.vis);
    document.body.classList.remove("ctr-open");
    try { if(this.lock) this.lock.release(); } catch(e){}
    this.lock = null;
    try { if(document.fullscreenElement) document.exitFullscreen(); } catch(e){}
    if(instant){ el.remove(); return; }
    el.classList.remove("on");
    setTimeout(function(){ el.remove(); }, 250);
    if(S.biz && $("view")) reloadSoon();
  },
  flash: function(){
    if(!this.el) return;
    this.el.classList.remove("flash"); void this.el.offsetWidth; this.el.classList.add("flash");
  },
  update: function(){
    var m = $("ctrMain");
    if(!this.el || !m) return;
    var p = S.pending, today = this.feed.length || (S.stats ? S.stats.today : 0), goal = Store.pref("goalDay", 0);
    var statHtml = '<div class="ctr-stat"><div class="ring-val">' + (goal ? ring(Math.min(today, goal), goal, 120, 10) : ring(1, 1, 120, 10)) + '<span><b>' + nf(today) + '</b><em>' + (goal ? "/ " + goal + " hedef" : "bugün") + '</em></span></div>' +
      '<div class="small">bugün verilen damga</div></div>';
    if(p.length){
      m.innerHTML = '<div class="ctr-pend"><div class="ctr-title"><span class="pulse"></span>' + (p.length === 1 ? "Onay bekleyen damga" : p.length + " damga onay bekliyor") + '</div>' +
        '<div class="ctr-cards">' + p.map(function(x){
          var c = x.customers || {};
          return '<article class="ctr-card" data-row="' + attr(x.id) + '">' + avatar({ name: c.name || "?", stamps: 0, rewards_available: 0 }) +
            '<div class="cc-n"><b class="ell">' + esc(c.name || "İsimsiz müşteri") + '</b><span class="num">••• ' + esc(String(c.phone || "").slice(-2)) + ' · ' + esc(rel(x.created_at)) + '</span></div>' +
            '<div class="cc-a"><button class="btn danger" type="button" data-crj="' + attr(x.id) + '" aria-label="Reddet">' + I.x + '</button>' +
            '<button class="btn good big" type="button" data-cap="' + attr(x.id) + '">' + I.check + 'Onayla</button></div></article>';
        }).join("") + '</div>' +
        (p.length > 1 ? '<button class="btn teal big block" type="button" id="ctrAll">' + I.check + 'Hepsini onayla (' + p.length + ')</button>' : '') +
        '<p class="small muted ctr-hint">Enter tuşu ilk damgayı onaylar.</p></div>' + '<aside class="ctr-side">' + statHtml + this.feedHtml() + '</aside>';
    } else {
      var link = cardLink();
      m.innerHTML = '<div class="ctr-idle">' +
        '<div class="ctr-qr"><canvas id="ctrQr" aria-label="Damga QR kodu"></canvas></div>' +
        '<div><h2>Damga için okut</h2><p class="ink2">iPhone\'da telefonunu NFC damgaya yaklaştır. Android\'de QR\'ı da okutabilirsin.</p>' +
        '<div class="ctr-rw">' + I.gift + '<span>' + (S.biz.stamps_needed || 4) + ' damgada <b>' + esc(S.biz.reward_text || "ödül") + '</b></span></div>' +
        (S.biz.require_approval ? '<p class="small muted">Yeni damga istekleri burada büyük olarak görünecek.</p>' : '<p class="small muted">Damga onayı kapalı, damgalar otomatik ekleniyor.</p>') + '</div></div>' +
        '<aside class="ctr-side">' + statHtml + this.feedHtml() + '</aside>';
      try { QR.draw($("ctrQr"), link, { scale: 9 }); } catch(e){}
    }
    var self = this;
    m.querySelectorAll("[data-cap]").forEach(function(b){ b.onclick = function(){ self.decide("approve_stamp", Number(b.getAttribute("data-cap")), b); }; });
    m.querySelectorAll("[data-crj]").forEach(function(b){ b.onclick = function(){ self.decide("reject_stamp", Number(b.getAttribute("data-crj")), b); }; });
    var all = $("ctrAll");
    if(all) all.onclick = async function(){
      all.disabled = true;
      var ids = S.pending.map(function(x){ return x.id; }), n = 0;
      for(var i = 0; i < ids.length; i++){ if(await decide("approve_stamp", ids[i], null, true)) n++; }
      toast(n + " damga onaylandı");
      self.loadFeed(); self.update();
    };
  },
  decide: async function(fn, id, btn){
    if(this.busy[id]) return;
    this.busy[id] = 1;
    var card = document.querySelector('.ctr [data-row="' + id + '"]');
    if(card) card.classList.add("leaving");
    var ok = await decide(fn, id, btn, true);
    delete this.busy[id];
    if(ok){ toast(fn === "approve_stamp" ? "Damga onaylandı" : "Damga reddedildi", fn === "approve_stamp" ? "good" : "bad"); if(fn === "approve_stamp") this.loadFeed(); }
    else if(card) card.classList.remove("leaving");
    this.update();
  },
  feedHtml: function(){
    var f = this.feed.slice(0, 6);
    if(!f.length) return '<div class="ctr-feed"><div class="eyebrow">Son damgalar</div><p class="small muted">Bugün henüz damga yok.</p></div>';
    return '<div class="ctr-feed"><div class="eyebrow">Son damgalar</div>' + f.map(function(e){
      var c = e.customers || {};
      return '<div class="cf-i"><span class="d"></span><span class="ell grow">' + esc(firstName(c.name) || "Müşteri") + '</span><span class="num muted">' + esc(fmtHM(e.created_at)) + '</span></div>';
    }).join("") + '</div>';
  }
};

var SOUNDS = [["zil", "Zil"], ["damga", "Damga"], ["kus", "Kuş"], ["kapali", "Kapalı"]];
function playSound(kind){
  var a = S.audio, mode = Dev.get("sound", "zil");
  if(mode === "kapali" || !a || a.state !== "running") return;
  var vol = clamp(Number(Dev.get("vol", 0.7)), 0.05, 1), t = a.currentTime;
  function note(at, f, len, type, peak){
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + at);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, (peak || 0.3) * vol), t + at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + len);
    o.connect(g); g.connect(a.destination);
    o.start(t + at); o.stop(t + at + len + 0.05);
  }
  if(kind === "call"){ [0, 0.18, 0.36].forEach(function(d){ note(d, 988, 0.14, "triangle", 0.35); }); }
  else if(mode === "damga"){ note(0, 140, 0.18, "sine", 0.6); note(0.01, 90, 0.25, "sine", 0.5); note(0.12, 660, 0.3, "sine", 0.18); }
  else if(mode === "kus"){ [0, 0.09, 0.18].forEach(function(d, i){ note(d, 2100 + i * 250, 0.08, "sine", 0.18); }); note(0.32, 2600, 0.12, "sine", 0.16); }
  else { note(0, 880, 0.45, "sine", 0.28); note(0.16, 1318.5, 0.5, "sine", 0.28); }
  try { if(navigator.vibrate) navigator.vibrate(kind === "call" ? [80, 50, 80, 50, 80] : [120, 60, 120]); } catch(e){}
}

function goalStreak(goal){
  if(!goal || !S.eventsOk) return 0;
  var t0 = startOfDay(Date.now()).getTime(), cnt = {};
  S.events.forEach(function(e){ if(e.status === "approved"){ var k = startOfDay(e.created_at).getTime(); cnt[k] = (cnt[k] || 0) + 1; } });
  var n = (cnt[t0] || 0) >= goal ? 1 : 0;
  for(var i = 1; i < 30; i++){ if((cnt[t0 - i * DAYMS] || 0) >= goal) n++; else break; }
  return n;
}

/* =========================================================
   Gün sonu raporu
   ========================================================= */
function dayEndData(off){
  off = off || 0;
  var t0 = startOfDay(Date.now()).getTime() - off * DAYMS, t1 = t0 + DAYMS, isToday = off === 0;
  var cut = isToday ? Date.now() - t0 : DAYMS, lw = t0 - 7 * DAYMS;
  var day = S.events.filter(function(e){ var t = new Date(e.created_at).getTime(); return t >= t0 && t < t1; });
  var appr = day.filter(function(e){ return e.status === "approved"; });
  var lastWeek = S.events.filter(function(e){ var t = new Date(e.created_at).getTime(); return e.status === "approved" && t >= lw && t < lw + cut; });
  var ids = {}, hours = new Array(24).fill(0);
  appr.forEach(function(e){ if(e.customers && e.customers.id != null) ids[e.customers.id] = 1; hours[new Date(e.created_at).getHours()]++; });
  var firstEver = {};
  S.events.forEach(function(e){ if(e.status === "approved" && e.customers){ var id = e.customers.id, t = new Date(e.created_at).getTime(); if(!firstEver[id] || t < firstEver[id]) firstEver[id] = t; } });
  var oldest = S.events.length ? new Date(S.events[S.events.length - 1].created_at).getTime() : t0;
  var newC = Object.keys(ids).filter(function(id){
    if(firstEver[id] < t0) return false;
    if(isToday){ var c = custById(id); return !(c && c.stamps + (c.rewards_available || 0) * (S.biz.stamps_needed || 4) > 1); }
    return t0 - oldest > 14 * DAYMS;
  }).length;
  var ph = hours.indexOf(Math.max.apply(null, hours));
  var need = S.biz.stamps_needed || 4, rewards = 0;
  if(isToday) rewards = S.customers.filter(function(c){ return c.rewards_available > 0 && c.last_stamp_at && new Date(c.last_stamp_at).getTime() >= t0 && c.stamps === 0; }).length;
  else rewards = Math.round(appr.length / need);
  return {
    off: off, isToday: isToday, date: fmtLong(new Date(t0)), stamps: appr.length, uniq: Object.keys(ids).length, newC: newC,
    rejected: day.filter(function(e){ return e.status === "rejected"; }).length, pending: isToday ? S.pending.length : 0,
    lastWeek: lastWeek.length, peak: appr.length ? ("0" + ph).slice(-2) + ":00–" + ("0" + ((ph + 1) % 24)).slice(-2) + ":00" : null,
    rewards: rewards, goal: Store.pref("goalDay", 0), hours: hours
  };
}
function dayEndText(d){
  var l = [S.biz.name + " · Gün sonu", d.date, ""];
  l.push("Verilen damga: " + d.stamps + (d.lastWeek ? " (geçen hafta " + (d.isToday ? "aynı saatte " : "aynı gün ") + d.lastWeek + ")" : ""));
  l.push("Gelen müşteri: " + d.uniq + (d.newC ? " · ilk kez gelen: " + d.newC : ""));
  if(d.peak) l.push("En yoğun saat: " + d.peak);
  if(d.rewards) l.push((d.isToday ? "Bugün ödül kazanan: " : "Kazanılan ödül (yaklaşık): ") + d.rewards);
  if(d.goal) l.push("Hedef: " + d.goal + " · " + (d.stamps >= d.goal ? "tamamlandı" : "%" + Math.round(d.stamps / d.goal * 100)));
  if(d.rejected) l.push("Reddedilen: " + d.rejected);
  if(d.pending) l.push("Hâlâ bekleyen onay: " + d.pending);
  return l.join("\n");
}

function bindRoi(){
  var b = $("roiB"), c = $("roiC"), l = $("roiL");
  if(!b) return;
  function calc(){
    var basket = Number(b.value), cost = Number(c.value), lift = Number(l.value), need = S.biz.stamps_needed || 4;
    $("roiLv").textContent = "%" + lift;
    Store.setPref("roi", { basket: basket || null, cost: cost || null, lift: lift });
    var out = $("roiOut");
    if(!(basket > 0) || !(cost >= 0) || c.value === ""){ out.innerHTML = '<p class="small muted">Sepet ve ödül maliyetini gir, sonucu hemen gör.</p>'; return; }
    var month = S.eventsOk ? S.stats.days.reduce(function(a, d){ return a + d.v; }, 0) : 0;
    var rewards = month / need, rcost = rewards * cost, disc = cost / (need * basket) * 100;
    var extraVisits = month * lift / (100 + lift), extraRev = extraVisits * basket, net = extraRev - rcost;
    out.innerHTML =
      '<div class="roi-g"><div><span>Ödül başına indirim</span><b>%' + f1(disc) + '</b><em>' + need + ' alışverişte 1 ikram</em></div>' +
      '<div><span>Aylık ödül maliyeti</span><b>' + esc(money(Math.round(rcost))) + '</b><em>≈' + f1(rewards) + ' ödül</em></div>' +
      '<div><span>Ek ziyaret cirosu</span><b>' + esc(money(Math.round(extraRev))) + '</b><em>≈' + Math.round(extraVisits) + ' ek ziyaret</em></div>' +
      '<div class="' + (net >= 0 ? "pos" : "neg") + '"><span>Aylık net etki</span><b>' + (net >= 0 ? "+" : "") + esc(money(Math.round(net))) + '</b><em>' + (net >= 0 ? "program kârlı görünüyor" : "ödül maliyeti yüksek kalıyor") + '</em></div></div>';
  }
  [b, c, l].forEach(function(x){ x.oninput = calc; });
  calc();
}

    SEGMENTS.forEach(function(s){ a.push({ k: "act", t: "Kampanya: " + s.t, s: s.act, i: s.i, run: function(){ Camp.focus = s.id; goTab("kampanya"); } }); });
    return a;
  },
  open: function(){
    if(this.el) return;
    var el = document.createElement("div");
    el.className = "pal";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", "Ara ve komutlar");
    el.innerHTML = '<div class="pal-box"><div class="pal-in">' + I.search + '<input id="palQ" placeholder="Müşteri, bölüm ya da işlem ara..." autocomplete="off" aria-label="Ara"><kbd>Esc</kbd></div><div class="pal-l" id="palL" role="listbox"></div>' +
      '<div class="pal-f tiny muted"><span>↑↓ seç</span><span>Enter aç</span><span>Esc kapat</span></div></div>';
    document.body.appendChild(el);
    this.el = el;
    var self = this;
    el.addEventListener("click", function(e){ if(e.target === el) self.close(); });
    var q = $("palQ");
    q.oninput = function(){ self.sel = 0; self.render(q.value); };
    q.onkeydown = function(e){
      if(e.key === "ArrowDown"){ e.preventDefault(); self.sel = Math.min(self.items.length - 1, self.sel + 1); self.mark(); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); self.sel = Math.max(0, self.sel - 1); self.mark(); }
      else if(e.key === "Enter"){ e.preventDefault(); self.run(self.sel); }
      else if(e.key === "Escape"){ e.preventDefault(); self.close(); }
    };
    this.render("");
    requestAnimationFrame(function(){ el.classList.add("on"); q.focus(); });
  },
  render: function(q){
    var n = q.toLocaleLowerCase("tr-TR").trim(), qp = q.replace(/\D/g, ""), out = [];
    function m(s){ return String(s || "").toLocaleLowerCase("tr-TR").indexOf(n) > -1; }
    var acts = this.actions().filter(function(a){ return !n || m(a.t) || m(a.s); });
    var cust = n ? S.customers.filter(function(c){ var no = Store.note(c.id); return m(c.name) || (qp.length >= 3 && String(c.phone).indexOf(qp) > -1) || (no && (m(no.n) || (no.t || []).some(m))); }).slice(0, 8) : [];
    cust.forEach(function(c){ out.push({ k: "cust", t: c.name || "İsimsiz müşteri", s: phoneP(c.phone) + " · " + c.stamps + "/" + (S.biz.stamps_needed || 4) + " damga" + (c.rewards_available ? " · " + c.rewards_available + " bilet" : ""), c: c, run: function(){ openCustomer(c.id); } }); });
    out = out.concat(acts.slice(0, n ? 12 : 9));
    this.items = out;
    var box = $("palL");
    if(!out.length){ box.innerHTML = '<div class="pal-e small muted">"' + esc(q) + '" için sonuç yok</div>'; return; }
    var lastK = null;
    box.innerHTML = out.map(function(it, i){
      var head = it.k !== lastK ? '<div class="pal-g tiny muted">' + (it.k === "cust" ? "Müşteriler" : it.k === "nav" ? "Bölümler" : "İşlemler") + '</div>' : '';
      if(it.k === "nav" && lastK === "act") head = "";
      lastK = it.k;
      return head + '<button class="pal-i" type="button" role="option" data-pi="' + i + '">' + (it.c ? avatar(it.c, true) : '<span class="pal-ic">' + (I[it.i] || I.chev) + '</span>') +
        '<span class="grow"><b class="ell">' + esc(it.t) + '</b><span class="tiny muted ell">' + esc(it.s || "") + '</span></span>' + I.chev.replace('<svg', '<svg class="chev"') + '</button>';
    }).join("");
    var self = this;
    box.querySelectorAll("[data-pi]").forEach(function(b){
      b.onclick = function(){ self.run(Number(b.getAttribute("data-pi"))); };
      b.onmousemove = function(){ var i = Number(b.getAttribute("data-pi")); if(self.sel !== i){ self.sel = i; self.mark(); } };
    });
    this.mark();
  },
  mark: function(){
    var self = this;
    document.querySelectorAll(".pal-i").forEach(function(b){
      var on = Number(b.getAttribute("data-pi")) === self.sel;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", String(on));
      if(on) b.scrollIntoView({ block: "nearest" });
    });
  },
  run: function(i){
    var it = this.items[i];
    if(!it) return;
    this.close();
    setTimeout(function(){ it.run(); }, 30);
  },
  close: function(){
    if(!this.el) return;
    var el = this.el; this.el = null;
    el.classList.remove("on");
    setTimeout(function(){ el.remove(); }, 180);
  }
};

var KEYS = [["Ctrl K veya /", "Ara ve komutlar"], ["G sonra Ö", "Özet"], ["G sonra M", "Müşteriler"], ["G sonra R", "Raporlar"], ["G sonra K", "Kampanyalar"], ["G sonra A", "Ayarlar"], ["T", "Tezgah modu"], ["O", "Onay bekleyenler"], ["?", "Bu liste"]];

  if(!S.biz || !$("view")) return;

  var tag = (e.target && e.target.tagName) || "";

  if(Palette.el || Counter.el || sheetEl || document.querySelector(".dialog.on") || Tour.el) return;
  var k = e.key.toLocaleLowerCase("tr-TR");

    gPending = 0;
    var map = { "ö": "ozet", "o": "ozet", "m": "musteriler", "r": "raporlar", "k": "kampanya", "a": "ayarlar", "h": "hesap", "d": "oduller", "s": "studyo", "y": "yardim" };

  else if(k === "g"){ gPending = Date.now(); }
  else if(k === "t"){ e.preventDefault(); Counter.open(); }
  else if(k === "o" && S.pending.length){ e.preventDefault(); openApprovals(); }
  else if(e.key === "?"){ e.preventDefault(); openShortcuts(); }
});

      { sel: "#ctrB", t: "Tezgah modu", d: "Kasadaki tablette aç: onay istekleri büyük görünür, boşta QR gösterir, ekran kapanmaz." },
      { sel: desk ? '.rail [data-tab="raporlar"]' : '.tabbar [data-tab="raporlar"]', t: "Raporlar", d: "En yoğun saatlerin, yeni ve dönen müşterilerin, kimlerin geri geldiği." },
      { sel: desk ? '.rail [data-tab="kampanya"]' : "#moreTab", t: "Kampanyalar ve daha fazlası", d: desk ? "Uzaklaşan müşterilere tek tek WhatsApp mesajı hazırla, sonucunu ölç." : "Kampanyalar, afiş stüdyosu, masalar ve ayarlar Menü'de." },
      { sel: '[data-tab="musteriler"]', t: "Müşteri notları", d: "Bir müşteriye dokun: not ve etiket ekle, geliş alışkanlığını gör." }
    ];
  },
  start: function(){
    closeSheet(true); scrim(false);
    if(S.tab !== "ozet"){ goTab("ozet"); var self = this; setTimeout(function(){ self.start(); }, 120); return; }
    this.i = 0;
    if(!this.el){
      this.el = document.createElement("div");
      this.el.className = "tour";
      this.el.innerHTML = '<div class="tour-hole" id="tourHole"></div><div class="tour-card" id="tourCard" role="dialog" aria-live="polite"></div>';
      document.body.appendChild(this.el);
      this.el.addEventListener("click", function(e){ if(e.target === Tour.el) Tour.end(); });
      window.addEventListener("resize", Tour.place);
      document.addEventListener("keydown", Tour.key);
    }
    this.show();
  },
  key: function(e){ if(!Tour.el) return; if(e.key === "Escape") Tour.end(); else if(e.key === "ArrowRight") Tour.next(1); else if(e.key === "ArrowLeft") Tour.next(-1); },
  visible: function(sel){
    var list = document.querySelectorAll(sel);
    for(var i = 0; i < list.length; i++){ var r = list[i].getBoundingClientRect(); if(r.width > 0 && r.height > 0) return list[i]; }
    return null;
  },
  show: function(){
    var st = this.steps(), s = st[this.i];
    var target = this.visible(s.sel);
    if(!target && this.i < st.length - 1){ this.i++; this.show(); return; }
    var card = $("tourCard");
    card.innerHTML = '<div class="tiny muted">' + (this.i + 1) + ' / ' + st.length + '</div><h3>' + esc(s.t) + '</h3><p class="small ink2">' + esc(s.d) + '</p>' +
      '<div class="row between"><button class="link-btn small" type="button" id="tourSkip">Turu bitir</button><div class="row">' +
      (this.i ? '<button class="btn ghost sm" type="button" id="tourPrev">Geri</button>' : '') +
      '<button class="btn sm" type="button" id="tourNext">' + (this.i === st.length - 1 ? "Bitir" : "İleri") + '</button></div></div>';
    $("tourSkip").onclick = function(){ Tour.end(); };
    $("tourNext").onclick = function(){ Tour.next(1); };
    var pv = $("tourPrev"); if(pv) pv.onclick = function(){ Tour.next(-1); };
    this.target = target;
    if(target){
      var r = target.getBoundingClientRect();
      if(r.top < 70 || r.bottom > window.innerHeight - 90) target.scrollIntoView({ block: "center" });
    }
    requestAnimationFrame(Tour.place);
    this.el.classList.add("on");
    $("tourNext").focus();
  },
  place: function(){
    if(!Tour.el) return;
    var hole = $("tourHole"), card = $("tourCard"), t = Tour.target;
    var vw = window.innerWidth, vh = window.innerHeight;
    if(!t){ hole.style.cssText = "left:50%;top:40%;width:0;height:0"; card.style.left = Math.max(16, vw / 2 - 160) + "px"; card.style.top = (vh * 0.35) + "px"; return; }
    var r = t.getBoundingClientRect(), pad = 8;
    hole.style.left = (r.left - pad) + "px"; hole.style.top = (r.top - pad) + "px";
    hole.style.width = (r.width + pad * 2) + "px"; hole.style.height = (r.height + pad * 2) + "px";
    var cw = Math.min(320, vw - 32), ch = card.offsetHeight || 170;
    var top = r.bottom + 16 + ch < vh ? r.bottom + 16 : Math.max(16, r.top - ch - 16);
    card.style.width = cw + "px";
    card.style.left = clamp(r.left + r.width / 2 - cw / 2, 16, vw - cw - 16) + "px";
    card.style.top = top + "px";
  },
  next: function(d){
    var n = this.i + d, st = this.steps();
    if(n >= st.length){ this.end(); return; }
    if(n < 0) return;
    this.i = n; this.show();
  },
  end: function(){
    if(!this.el) return;
    var el = this.el; this.el = null; this.target = null;
    window.removeEventListener("resize", Tour.place);
    document.removeEventListener("keydown", Tour.key);
    el.classList.remove("on");
    setTimeout(function(){ el.remove(); }, 200);
    Dev.set("tourDone", true);
  }
};

function expectedToday(){

function todayChart(box){
  var t0 = startOfDay(Date.now()).getTime(), wd = new Date().getDay(), now = new Date().getHours();
  var today = new Array(24).fill(0), past = new Array(24).fill(0), weeks = 0;
  for(var w = 1; w <= 4; w++){ if(t0 - w * 7 * DAYMS >= startOfDay(Date.now() - 29 * DAYMS).getTime()) weeks++; }
  S.events.forEach(function(e){
    if(e.status !== "approved") return;
    var t = new Date(e.created_at), ts = t.getTime();
    if(ts >= t0) today[t.getHours()]++;
    else if(t.getDay() === wd && ts >= t0 - weeks * 7 * DAYMS) past[t.getHours()]++;
  });
  var avg = past.map(function(x){ return weeks ? x / weeks : 0; });
  var lo = 7, hi = 22;
  for(var h = 0; h < 24; h++){ if((today[h] || avg[h] >= 0.5) && h < lo) lo = h; if((today[h] || avg[h] >= 0.5) && h > hi) hi = h; }
  var labels = [], tv = [], av = [];
  for(var k = lo; k <= hi; k++){ labels.push({ s: ("0" + k).slice(-2), l: ("0" + k).slice(-2) + ":00–" + ("0" + ((k + 1) % 24)).slice(-2) + ":00" }); tv.push(k <= now ? today[k] : null); av.push(Math.round(avg[k] * 10) / 10); }
  var w2 = box.clientWidth || 600;
  box.setAttribute("data-w", w2);
  var lc = lineChart("ch1", labels, [{ name: "Bugün", values: tv, area: true }, { name: "Normal " + WD[wd] + " (" + weeks + " hafta ort.)", values: av, dash: true, fmt: f1 }], { width: w2, height: w2 < 480 ? 190 : 230, label: "Bugün saat saat damga ve aynı günün ortalaması" });
  var sumT = today.reduce(function(a, x){ return a + x; }, 0), sumA = 0;
  for(var j = 0; j <= now; j++) sumA += avg[j];
  box.innerHTML = lc.html + '<div class="chart-sum"><span>Şu ana kadar <b>' + sumT + '</b></span><span>Normalde bu saate kadar <b>' + f1(sumA) + '</b></span>' +
    (sumA >= 3 ? '<span>' + deltaHtml(sumT, Math.round(sumA)) + '</span>' : '') + '</div>';
  lc.bind();
}
