<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Damgalio">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1715" media="(prefers-color-scheme: dark)">
<title>Damgalio Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Damgalio İşletme Paneli
   Layout: phone-first app shell (sticky header, bottom tab bar); from 960px a left rail + two-column content.
   Motif: the stamp card itself — dashed stamp rings, ticket perforations, monospace "card" labels. */
:root {
  --bg: #F6F1E7;
  --bg-2: #EFE8DA;
  --surface: #FFFDF8;
  --surface-2: #FBF6EC;
  --ink: #12231F;
  --ink-2: #3E504C;
  --muted: #74837F;
  --line: #E4DACA;
  --line-2: #D6CAB6;
  --accent: #E8612C;
  --accent-ink: #B8461A;
  --accent-soft: #FBE3D6;
  --on-accent: #FFFFFF;
  --teal: #24504C;
  --teal-soft: #DDEAE6;
  --sun: #F2C94C;
  --sun-soft: #FCF1CC;
  --good: #1E7F55;
  --good-soft: #DCF1E6;
  --warn: #A86B00;
  --warn-soft: #FBEFD2;
  --bad: #B93A26;
  --bad-soft: #F9E0DA;
  --shadow: 0 1px 0 rgba(18, 35, 31, .04), 0 10px 30px -18px rgba(18, 35, 31, .35);
  --shadow-lg: 0 30px 80px -30px rgba(18, 35, 31, .45);
  --scrim: rgba(18, 35, 31, .38);
  --chart-grid: #E9E1D2;
  --seg-on: #FFFFFF;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --tab-h: 64px;
  --hdr-h: 60px;
  color-scheme: light;
}
[hidden] {
  display: none !important;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1715;
    --bg-2: #10201D;
    --surface: #14231F;
    --surface-2: #182A26;
    --ink: #F1ECE2;
    --ink-2: #C3CDC9;
    --muted: #8D9C98;
    --line: #243631;
    --line-2: #2F443E;
    --accent: #F0743F;
    --accent-ink: #F59A70;
    --accent-soft: #3A2117;
    --on-accent: #1A0E08;
    --teal: #8FC3B8;
    --teal-soft: #1C3530;
    --sun: #F2CF5B;
    --sun-soft: #3A3115;
    --good: #5BCB95;
    --good-soft: #15352A;
    --warn: #F0BE55;
    --warn-soft: #3A2E12;
    --bad: #F08A76;
    --bad-soft: #3D1C17;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -18px rgba(0, 0, 0, .7);
    --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, .8);
    --scrim: rgba(0, 0, 0, .55);
    --chart-grid: #22342F;
    --seg-on: #2B423C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1715;
  --bg-2: #10201D;
  --surface: #14231F;
  --surface-2: #182A26;
  --ink: #F1ECE2;
  --ink-2: #C3CDC9;
  --muted: #8D9C98;
  --line: #243631;
  --line-2: #2F443E;
  --accent: #F0743F;
  --accent-ink: #F59A70;
  --accent-soft: #3A2117;
  --on-accent: #1A0E08;
  --teal: #8FC3B8;
  --teal-soft: #1C3530;
  --sun: #F2CF5B;
  --sun-soft: #3A3115;
  --good: #5BCB95;
  --good-soft: #15352A;
  --warn: #F0BE55;
  --warn-soft: #3A2E12;
  --bad: #F08A76;
  --bad-soft: #3D1C17;
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -18px rgba(0, 0, 0, .7);
  --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, .8);
  --scrim: rgba(0, 0, 0, .55);
  --chart-grid: #22342F;
  --seg-on: #2B423C;
  color-scheme: dark;
}

/* ---------- base ---------- */
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 60;
  background: var(--bg);
}
a {
  color: var(--accent-ink);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: .55;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 8px;
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  letter-spacing: -.02em;
  text-wrap: balance;
  margin: 0;
}
h1 {
  font-size: 30px;
  line-height: 1.05;
  font-weight: 800;
}
h2 {
  font-size: 20px;
  line-height: 1.15;
  font-weight: 700;
}
h3 {
  font-size: 16px;
  font-weight: 700;
}
p {
  margin: 0;
}
.num {
  font-variant-numeric: tabular-nums;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.muted {
  color: var(--muted);
}
.ink2 {
  color: var(--ink-2);
}
.small {
  font-size: 13px;
}
.tiny {
  font-size: 12px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.row.wrap {
  flex-wrap: wrap;
}
.row.between {
  justify-content: space-between;
}
.stack {
  display: grid;
  gap: 12px;
  min-width: 0;
}
.stack.lg {
  gap: 18px;
}
.grow {
  flex: 1;
  min-width: 0;
}
.ell {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  white-space: nowrap;
  transition: transform .12s ease, background .2s ease, border-color .2s ease;
}
.btn:active {
  transform: scale(.98);
}
.btn svg {
  width: 18px;
  height: 18px;
  flex: none;
}
.btn.block {
  width: 100%;
}
.btn.ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-2);
}
.btn.soft {
  background: var(--surface-2);
  color: var(--ink);
  border-color: var(--line);
}
.btn.teal {
  background: var(--teal);
  color: var(--surface);
}
.btn.good {
  background: var(--good);
  color: #fff;
}
.btn.danger {
  background: transparent;
  color: var(--bad);
  border-color: var(--bad-soft);
}
.btn.sm {
  min-height: 36px;
  padding: 7px 12px;
  font-size: 14px;
  border-radius: 12px;
}
.btn.xs {
  min-height: 30px;
  padding: 5px 10px;
  font-size: 13px;
  border-radius: 10px;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  flex: none;
}
.icon-btn svg {
  width: 19px;
  height: 19px;
}
.icon-btn.spin svg {
  animation: spin .8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.link-btn {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent-ink);
  font-weight: 700;
}

/* ---------- forms ---------- */
.field {
  display: grid;
  gap: 6px;
}
.field > label,
.field > .lbl {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
}
.field .hint {
  font-size: 12px;
  color: var(--muted);
}
.input,
.textarea,
.select {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.input.bad {
  border-color: var(--bad);
}
.textarea {
  min-height: 96px;
  resize: vertical;
}
.input-wrap {
  position: relative;
}
.input-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  width: 18px;
  height: 18px;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.input-wrap .input {
  padding-left: 42px;
}
.counter {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  justify-self: end;
}
.form-msg {
  font-size: 14px;
  font-weight: 600;
  min-height: 20px;
}
.form-msg.ok {
  color: var(--good);
}
.form-msg.err {
  color: var(--bad);
}
.switch {
  position: relative;
  width: 52px;
  height: 32px;
  flex: none;
}
.switch input {
  position: absolute;
  inset: 0;
  opacity: 0;
  margin: 0;
  cursor: pointer;
  z-index: 1;
}
.switch span {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: var(--line-2);
  transition: background .2s ease;
}
.switch span::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
  transition: transform .2s ease;
}
.switch input:checked + span {
  background: var(--good);
}
.switch input:checked + span::after {
  transform: translateX(20px);
}
.switch input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.seg {
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
}
.seg button {
  white-space: nowrap;
  border: 0;
  background: transparent;
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink-2);
}
.seg button[aria-pressed="true"] {
  background: var(--seg-on);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.swatch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid var(--surface);
  box-shadow: 0 0 0 1px var(--line-2);
  padding: 0;
}
.swatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--ink);
}
.swatch-custom {
  position: relative;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px dashed var(--line-2);
  display: grid;
  place-items: center;
  color: var(--muted);
}
.swatch-custom input {
  position: absolute;
  inset: -8px;
  width: 52px;
  height: 52px;
  opacity: 0;
  cursor: pointer;
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card.flat {
  box-shadow: none;
}
.card.tint {
  background: var(--surface-2);
}
.card-h {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.card-h p {
  margin-top: 4px;
}
.divider {
  height: 1px;
  background: var(--line);
  margin: 14px 0;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  background: var(--bg-2);
  color: var(--ink-2);
}
.pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.pill.good {
  background: var(--good-soft);
  color: var(--good);
}
.pill.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.pill.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.pill.accent {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.pill.sun {
  background: var(--sun-soft);
  color: var(--warn);
}
.badge {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.empty {
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 8px;
  padding: 26px 12px;
  color: var(--muted);
}
.empty svg {
  width: 44px;
  height: 44px;
  color: var(--line-2);
}
.empty b {
  color: var(--ink);
  font-size: 15px;
}

/* ---------- auth screens ---------- */
.auth {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px;
}
.auth-art {
  display: none;
}
.auth-main {
  width: 100%;
  max-width: 420px;
  margin: auto;
  display: grid;
  gap: 22px;
}
.brandmark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -.02em;
  color: var(--ink);
  text-decoration: none;
}
.brandmark .logo {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--accent);
  display: grid;
  place-items: center;
}
.brandmark .logo svg {
  width: 24px;
  height: 24px;
}
.auth h1 {
  font-size: 36px;
}
.auth-card {
  display: grid;
  gap: 14px;
}
.auth-foot {
  display: grid;
  gap: 10px;
  justify-items: center;
  text-align: center;
}
.demo-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--r);
  border: 1px dashed var(--line-2);
  color: var(--ink);
  text-decoration: none;
  background: var(--surface-2);
}
.demo-link b {
  display: block;
}
.demo-link svg {
  width: 20px;
  height: 20px;
  color: var(--accent-ink);
  flex: none;
}
.lock-ring {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 2px dashed var(--bad);
  display: grid;
  place-items: center;
  color: var(--bad);
}
.lock-ring svg {
  width: 32px;
  height: 32px;
}

/* ---------- shell ---------- */
.shell {
  min-height: 100vh;
}
.hdr {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.3) blur(14px);
  backdrop-filter: saturate(1.3) blur(14px);
  border-bottom: 1px solid var(--line);
}
.hdr-in {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--hdr-h);
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
.biz-av {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 18px;
  flex: none;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .18);
}
.hdr-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -.01em;
  line-height: 1.1;
}
.hdr-sub {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.hdr-sub i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
}
.hdr-sub i.warn {
  background: var(--warn);
}
.demo-strip {
  background: var(--teal);
  color: var(--surface);
  font-size: 13px;
  font-weight: 600;
}
.demo-strip .in {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.demo-strip a {
  color: var(--surface);
  font-weight: 800;
}
.page {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 18px;
  padding-bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.layout {
  display: grid;
  gap: 20px;
  min-width: 0;
}
.rail {
  display: none;
}
.view {
  display: grid;
  gap: 16px;
  min-width: 0;
  animation: viewIn .28s ease both;
}
@keyframes viewIn {
  from {
    opacity: .4;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.view-h {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.view-h p {
  margin-top: 6px;
}

/* bottom tab bar */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 45;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.3) blur(16px);
  backdrop-filter: saturate(1.3) blur(16px);
  border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  max-width: 560px;
  margin: 0 auto;
  height: var(--tab-h);
}
.tab {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
}
.tab svg {
  width: 23px;
  height: 23px;
}
.tab[aria-current="page"] {
  color: var(--ink);
}
.tab[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: 0;
  width: 28px;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--accent);
}
.tab .badge {
  position: absolute;
  top: 6px;
  left: calc(50% + 6px);
  min-width: 18px;
  height: 18px;
  font-size: 10px;
}

/* side rail (desktop) */
.rail-in {
  position: sticky;
  top: calc(var(--hdr-h) + 18px + env(safe-area-inset-top, 0px));
  display: grid;
  gap: 4px;
}
.rail a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 14px;
  color: var(--ink-2);
  font-weight: 600;
  text-decoration: none;
}
.rail a svg {
  width: 20px;
  height: 20px;
}
.rail a[aria-current="page"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}
.rail a .badge {
  margin-left: auto;
}
.rail .rail-foot {
  margin-top: 18px;
  padding: 14px;
  border-radius: var(--r);
  border: 1px dashed var(--line-2);
  display: grid;
  gap: 8px;
}

/* pending banner */
.pend-bar {
  position: sticky;
  top: calc(var(--hdr-h) + env(safe-area-inset-top, 0px));
  z-index: 35;
  margin: 0 auto;
  max-width: 1180px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px;
}
.pend-in {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px 10px 14px;
  border-radius: 18px;
  background: var(--sun);
  color: #2A2208;
  box-shadow: var(--shadow-lg);
  animation: pendIn .35s cubic-bezier(.2, 1.4, .4, 1) both;
}
.pend-in .dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px dashed rgba(42, 34, 8, .55);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  flex: none;
}
.pend-in b {
  display: block;
  font-size: 15px;
}
.pend-in span {
  font-size: 13px;
  opacity: .8;
}
.pend-in .btn {
  background: #2A2208;
  color: var(--sun);
  margin-left: auto;
}
@keyframes pendIn {
  from {
    opacity: 0;
    transform: translateY(-10px) scale(.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---------- dashboard ---------- */
.hello {
  display: grid;
  gap: 4px;
}
.hello h1 {
  font-size: 32px;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.kpi {
  position: relative;
  display: grid;
  gap: 6px;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  min-width: 0;
  overflow: hidden;
}
.kpi .k-lbl {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
}
.kpi .k-lbl svg {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.kpi .k-val {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.kpi .k-foot {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.delta svg {
  width: 13px;
  height: 13px;
}
.delta.up {
  color: var(--good);
}
.delta.down {
  color: var(--bad);
}
.delta.flat {
  color: var(--muted);
}
.kpi.hero {
  background: var(--teal);
  border-color: transparent;
  color: var(--surface);
}
.kpi.hero .k-lbl,
.kpi.hero .k-lbl svg,
.kpi.hero .k-foot {
  color: color-mix(in srgb, var(--surface) 78%, transparent);
}
.kpi.hero .delta.up,
.kpi.hero .delta.down,
.kpi.hero .delta.flat {
  color: var(--surface);
}
.kpi.hero .stamps-row {
  position: absolute;
  right: -14px;
  top: -14px;
  display: flex;
  gap: 6px;
  opacity: .22;
}
@media (max-width: 559px) {
  .kpi.hero .stamps-row { display: none; }
}
.kpi.hero .stamps-row i {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px dashed currentColor;
}
.dash-grid {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.ozet > .col {
  display: contents;
}
.chart-wrap {
  position: relative;
  min-width: 0;
}
.chart-wrap svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.chart-wrap .bar {
  fill: var(--accent);
  transition: opacity .15s ease;
}
.chart-wrap .bar.dim {
  fill: var(--line-2);
}
.chart-wrap .bar.today {
  fill: var(--teal);
}
.chart-wrap.hovering .bar:not(.on) {
  opacity: .45;
}
.chart-wrap .grid {
  stroke: var(--chart-grid);
  stroke-width: 1;
}
.chart-wrap .base {
  stroke: var(--line-2);
  stroke-width: 1;
}
.chart-wrap text {
  fill: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
}
.chart-wrap text.strong {
  fill: var(--ink);
  font-weight: 600;
}
.chart-wrap .hit {
  fill: transparent;
  cursor: pointer;
}
.tip {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  padding: 8px 10px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--surface);
  font-size: 12px;
  line-height: 1.3;
  white-space: nowrap;
  box-shadow: var(--shadow-lg);
  transform: translate(-50%, calc(-100% - 10px));
  opacity: 0;
  transition: opacity .12s ease;
}
.tip.on {
  opacity: 1;
}
.tip b {
  display: block;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.chart-sum {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
}
.chart-sum b {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.insights {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.insights.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.insight {
  display: grid;
  gap: 10px;
  align-content: start;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: left;
  color: var(--ink);
  min-width: 0;
}
button.insight {
  cursor: pointer;
  transition: border-color .15s ease, transform .12s ease;
}
button.insight:hover {
  border-color: var(--line-2);
}
button.insight:active {
  transform: scale(.99);
}
.insight .i-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.insight .i-ic {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.insight .i-ic svg {
  width: 18px;
  height: 18px;
}
.insight .i-ic.teal {
  background: var(--teal-soft);
  color: var(--teal);
}
.insight .i-ic.sun {
  background: var(--sun-soft);
  color: var(--warn);
}
.insight .i-ic.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.insight .i-val {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.insight .i-txt {
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.35;
}
.insight .chev {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.ring-val {
  position: relative;
  width: 64px;
  height: 64px;
}
.ring-val svg {
  width: 64px;
  height: 64px;
  transform: rotate(-90deg);
}
.ring-val .tr {
  stroke: var(--line);
}
.ring-val .pr {
  stroke: var(--teal);
  transition: stroke-dashoffset .8s ease;
}
.ring-val span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.hours {
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  align-items: end;
  gap: 3px;
  height: 64px;
}
.hours i {
  display: block;
  border-radius: 3px 3px 0 0;
  background: var(--teal-soft);
  min-height: 3px;
}
.hours i.top {
  background: var(--teal);
}
.hours-lbl {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}
.feed {
  display: grid;
}
.feed-i {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
  min-width: 0;
}
.feed-i:first-child {
  border-top: 0;
  padding-top: 0;
}
.feed-i .when {
  margin-left: auto;
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.quick {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.quick a,
.quick button {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 14px 8px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  text-align: center;
}
.quick svg {
  width: 22px;
  height: 22px;
  color: var(--accent-ink);
}
.tables-w {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 4px;
}
.tables-w div {
  padding: 12px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.tables-w b {
  display: block;
  font-family: var(--font-display);
  font-size: 22px;
  font-variant-numeric: tabular-nums;
}
.tables-w span {
  font-size: 12px;
  color: var(--muted);
}
.tables-w .hot {
  background: var(--sun-soft);
  border-color: var(--sun);
}

/* ---------- customers ---------- */
.toolbar {
  display: grid;
  gap: 10px;
}
.chips {
  display: flex;
  gap: 8px;
  min-width: 0;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar {
  display: none;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  flex: none;
}
.chip b {
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-weight: 700;
}
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--surface);
}
.chip[aria-pressed="true"] b {
  color: color-mix(in srgb, var(--surface) 70%, transparent);
}
.clist {
  display: grid;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.ci {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  width: 100%;
  min-width: 0;
  color: var(--ink);
}
.ci:first-child {
  border-top: 0;
}
.ci:hover {
  background: var(--surface-2);
}
.ci .nm {
  font-weight: 700;
}
.ci .meta {
  font-size: 13px;
  color: var(--muted);
}
.ci .end {
  margin-left: auto;
  display: grid;
  justify-items: end;
  gap: 4px;
  flex: none;
}
.ci .chev {
  width: 16px;
  height: 16px;
  color: var(--muted);
  flex: none;
}
.av {
  position: relative;
  width: 46px;
  height: 46px;
  flex: none;
}
.av svg {
  position: absolute;
  inset: 0;
  width: 46px;
  height: 46px;
  transform: rotate(-90deg);
}
.av .tr {
  stroke: var(--line);
}
.av .pr {
  stroke: var(--accent);
}
.av span {
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
  color: var(--ink-2);
}
.av.full .pr {
  stroke: var(--good);
}
.av.sm {
  width: 36px;
  height: 36px;
}
.av.sm svg {
  width: 36px;
  height: 36px;
}
.av.sm span {
  inset: 4px;
  font-size: 12px;
}
.more {
  display: flex;
  justify-content: center;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.list-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}

/* ---------- stamp card + ticket ---------- */
.scard {
  display: grid;
  gap: 14px;
  padding: 18px;
  border-radius: var(--r-xl);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.slots {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.slot {
  position: relative;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px dashed var(--line-2);
  background: var(--surface);
}
.slot.on {
  border: 0;
  background: var(--accent);
}
.slot.on::before {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  border: 1.5px dashed rgba(255, 255, 255, .65);
}
.slot.on::after {
  content: "";
  position: absolute;
  inset: 16px;
  border-radius: 50%;
  background: var(--teal);
}
.ticket {
  position: relative;
  display: grid;
  gap: 4px;
  padding: 16px 18px;
  border-radius: 20px;
  background: var(--accent);
  color: #fff;
  overflow: hidden;
}
.ticket .t-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .85;
}
.ticket .t-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  line-height: 1.1;
}
.ticket .t-note {
  font-size: 13px;
  opacity: .9;
}
.ticket .t-perf {
  position: relative;
  height: 2px;
  margin: 10px -18px;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .55) 0 8px, transparent 8px 14px);
}
.ticket .t-perf::before,
.ticket .t-perf::after {
  content: "";
  position: absolute;
  top: -10px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--surface);
}
.ticket .t-perf::before {
  left: -11px;
}
.ticket .t-perf::after {
  right: -11px;
}
.ticket .t-bot {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
}
.tk-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px dashed var(--line-2);
  min-width: 0;
}
.tk-row:first-child {
  border-top: 0;
}
.tk-n {
  display: grid;
  place-items: center;
  min-width: 44px;
  height: 30px;
  padding: 0 8px;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
}

/* ---------- settings: live card preview ---------- */
.set-grid {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.preview {
  display: grid;
  justify-items: center;
  gap: 10px;
  padding: 18px 12px 0;
  border-radius: var(--r-xl);
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--surface-2));
  border: 1px solid var(--line);
  overflow: hidden;
}
.pv-phone {
  width: 260px;
  max-width: 100%;
  border-radius: 34px 34px 0 0;
  background: #0E1110;
  padding: 9px 9px 0;
  box-shadow: var(--shadow-lg);
}
.pv-scr {
  border-radius: 26px 26px 0 0;
  background: #FDF8EC;
  color: #24504C;
  padding: 26px 16px 18px;
  display: grid;
  gap: 10px;
  min-height: 330px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.pv-scr .pv-lab {
  text-align: center;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #6F8C88;
}
.pv-scr .pv-h {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.05;
}
.pv-scr .pv-bn {
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
}
.pv-scr .pv-tk {
  border-radius: 14px;
  padding: 11px 12px;
  color: #fff;
  display: grid;
  gap: 2px;
}
.pv-scr .pv-tk small {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 8px;
  letter-spacing: .12em;
  opacity: .85;
}
.pv-scr .pv-tk b {
  font-size: 15px;
  line-height: 1.15;
}
.pv-scr .pv-tk span {
  font-size: 10px;
  opacity: .9;
}
.pv-slots {
  display: flex;
  justify-content: center;
  gap: 7px;
  flex-wrap: wrap;
}
.pv-slots i {
  position: relative;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px dashed #CDD9D4;
  background: rgba(255, 255, 255, .6);
}
.pv-slots i.on {
  border: 0;
}
.pv-slots i.on::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: #24504C;
}
.pv-rule {
  text-align: center;
  font-size: 10px;
  color: #6F8C88;
}
.pv-links {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.pv-links span {
  font-size: 9px;
  font-weight: 700;
  padding: 5px 8px;
  border-radius: 8px;
  background: #EEF2EF;
  color: #24504C;
}
.sticky-save {
  position: sticky;
  bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px 10px 16px;
  border-radius: 18px;
  background: var(--ink);
  color: var(--surface);
  box-shadow: var(--shadow-lg);
}
.sticky-save > span {
  margin-right: auto;
}
.qr-box {
  display: grid;
  gap: 14px;
  justify-items: center;
  text-align: center;
}
.qr-frame {
  padding: 14px;
  border-radius: 22px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.qr-frame canvas {
  display: block;
  width: 200px;
  height: 200px;
  image-rendering: pixelated;
}
.linkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 10px 10px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 13px;
  min-width: 0;
}
.linkbox span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
}
.opt {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.opt .grow p {
  margin-top: 4px;
}

/* ---------- account ---------- */
.sub-card {
  display: grid;
  gap: 14px;
}
.days {
  display: flex;
  align-items: center;
  gap: 16px;
}
.days .ring-val {
  width: 84px;
  height: 84px;
}
.days .ring-val svg {
  width: 84px;
  height: 84px;
}
.days .ring-val span {
  font-size: 22px;
}
.paybox {
  display: grid;
  gap: 10px;
  padding: 14px;
  border-radius: var(--r);
  border: 1px dashed var(--line-2);
  background: var(--surface-2);
}
.paybox .iban {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .02em;
  word-break: normal;
  overflow-wrap: anywhere;
}
.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 14px;
  font-size: 14px;
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
  font-weight: 600;
  text-align: right;
  min-width: 0;
  word-break: break-word;
}
.help-steps {
  display: grid;
  gap: 8px;
  margin: 0;
  padding-left: 20px;
  font-size: 14px;
  color: var(--ink-2);
}

/* ---------- overlays ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: var(--scrim);
  opacity: 0;
  transition: opacity .2s ease;
}
.scrim.on {
  opacity: 1;
}
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 90;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px));
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-lg);
  transform: translateY(105%);
  transition: transform .28s cubic-bezier(.2, .9, .3, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.on {
  transform: none;
}
.sheet-grab {
  width: 44px;
  height: 5px;
  border-radius: 9px;
  background: var(--line-2);
  margin: 10px auto 0;
  flex: none;
}
.sheet-h {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px 12px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  flex: none;
}
.sheet-b {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 18px 22px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-auto-rows: max-content;
  gap: 16px;
}
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 100;
  width: min(380px, calc(100% - 32px));
  padding: 22px;
  border-radius: 24px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  display: grid;
  gap: 12px;
  transform: translate(-50%, -46%) scale(.96);
  opacity: 0;
  transition: transform .2s ease, opacity .2s ease;
}
.dialog.on {
  transform: translate(-50%, -50%);
  opacity: 1;
}
.dialog .acts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 6px;
}
.toast-host {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom, 0px));
  z-index: 120;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  width: min(420px, calc(100% - 32px));
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--ink);
  color: var(--surface);
  font-weight: 600;
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  animation: toastIn .25s ease both;
}
.toast svg {
  width: 18px;
  height: 18px;
  flex: none;
}
.toast.good svg {
  color: var(--good);
}
.toast.bad svg {
  color: var(--bad);
}
.toast.out {
  animation: toastOut .25s ease both;
}
@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes toastOut {
  to {
    opacity: 0;
    transform: translateY(10px);
  }
}
.appr {
  display: grid;
  gap: 10px;
}
.appr-i {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  min-width: 0;
}
.appr-i .acts {
  margin-left: auto;
  display: flex;
  gap: 6px;
  flex: none;
}
.appr-i.leaving {
  animation: leave .3s ease both;
}
@keyframes leave {
  to {
    opacity: 0;
    transform: translateX(30px);
  }
}
.hist {
  display: grid;
}
.hist-i {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}
.hist-i:first-child {
  border-top: 0;
}
.hist-i .d {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  flex: none;
}
.hist-i .d.pending {
  border-color: var(--warn);
}
.hist-i .d.rejected {
  border-color: var(--bad);
}
.skel {
  border-radius: 12px;
  background: linear-gradient(90deg, var(--bg-2), var(--surface-2), var(--bg-2));
  background-size: 200% 100%;
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer {
  to {
    background-position: -200% 0;
  }
}
.boot {
  min-height: 100vh;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.boot .stamp-spin {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 3px dashed var(--accent);
  animation: spin 2.4s linear infinite;
}

/* ---------- responsive ---------- */
@media (min-width: 560px) {
  .kpis {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .insights {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .slot {
    width: 54px;
    height: 54px;
  }
}
@media (min-width: 760px) {
  .sheet {
    left: 50%;
    right: auto;
    width: 560px;
    transform: translate(-50%, 105%);
  }
  .sheet.on {
    transform: translate(-50%, 0);
  }
  .auth {
    grid-template-columns: 1.05fr 1fr;
    gap: 40px;
    align-items: center;
  }
  .auth-art {
    display: grid;
    align-content: center;
    gap: 22px;
    min-height: 520px;
    padding: 40px;
    border-radius: 34px;
    background: var(--teal);
    color: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .auth-art h2 {
    font-size: 40px;
    line-height: 1.02;
    max-width: 12ch;
  }
  .auth-art p {
    max-width: 36ch;
    color: color-mix(in srgb, var(--surface) 80%, transparent);
  }
}
@media (min-width: 960px) {
  .tabbar {
    display: none;
  }
  .page {
    padding-bottom: 40px;
  }
  .layout {
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 28px;
  }
  .rail {
    display: block;
  }
  .dash-grid {
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    align-items: start;
  }
  .ozet > .col {
    display: grid;
    gap: 16px;
    align-content: start;
    min-width: 0;
  }
  .dash-grid .span2 {
    grid-column: 1 / -1;
  }
  .set-grid {
    grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr);
    align-items: start;
  }
  .set-grid .side {
    position: sticky;
    top: calc(var(--hdr-h) + 18px + env(safe-area-inset-top, 0px));
  }
  .sticky-save {
    bottom: 18px;
  }
  .toast-host {
    bottom: 24px;
  }
  .hello h1 {
    font-size: 38px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

.rail-in {

}
.rail-g {

  text-transform: uppercase;
}
.rail a {
  padding: 9px 14px;
}
.rail-cmd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.rail-cmd svg {

}
.rail-cmd span {

}
.rail-cmd:hover {

}
button.tab {

}
.menu-grid {

.menu-i {

.menu-i.on {

.menu-i b {

.mi-ic {

.mi-ic svg {

}

/* ---------- grafikler ---------- */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin-bottom: 8px;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
}
.legend span,
.tip .tr {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.lgd {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 4px;
  background: var(--accent);
}
.lgd.s1 {
  background: var(--teal);
}
.lgd.st0 {
  background: var(--teal);
}
.lgd.st1 {
  background: var(--accent);
}
.chart-wrap.line .lgd.s1,
.legend .lgd.s1.dash,
.tip .lgd.s1.dash {
  height: 3px;
  border-radius: 2px;
  background: var(--ink);
}
.chart-wrap.stack + .tip,
.tip .tr {
  white-space: nowrap;
}
.tip .tr {
  display: flex;
  margin-top: 3px;
  font-size: 12px;
  font-weight: 500;
}
.tip .tr b {
  margin-left: auto;
  padding-left: 10px;
}
.tip .muted2 {
  opacity: .75;
}
.chart-wrap .area.s0 {
  fill: color-mix(in srgb, var(--accent) 16%, transparent);
}
.chart-wrap .ln {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.chart-wrap .ln.s0 {
  stroke: var(--accent);
}
.chart-wrap .ln.s1 {
  stroke: var(--ink);
  opacity: .75;
}
.chart-wrap .ln.dash {
  stroke-dasharray: 5 5;
}
.chart-wrap .xh {
  stroke: var(--line-2);
  stroke-width: 1;
  transition: opacity .12s ease;
}
.chart-wrap .dot {
  stroke: var(--surface);
  stroke-width: 2.5;
  opacity: 0;
}
.chart-wrap.hovering .dot {
  opacity: 1;
}
.chart-wrap .dot.s0 {
  fill: var(--accent);
}
.chart-wrap .dot.s1 {
  fill: var(--ink);
}
.chart-wrap.line .hit {
  fill: transparent;
  cursor: crosshair;
}
.chart-wrap .sb.s0 {
  fill: var(--teal);
}
.chart-wrap .sb.s1 {
  fill: var(--accent);
}
.chart-wrap.stack.hovering .sb:not(.on) {
  opacity: .4;
}
.heat {
  position: relative;
  display: grid;
  grid-template-columns: 30px repeat(var(--cols), minmax(0, 1fr));
  gap: 3px;
  align-items: center;
}
.heat .hx,
.heat .hy {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 9.5px;
  text-align: center;
}
.heat .hy {

  font-size: 10.5px;
}
.hc {
  display: block;
  aspect-ratio: 1;
  min-height: 12px;
  border-radius: 4px;
  background: var(--bg-2);
  cursor: pointer;
  transition: transform .1s ease;
}
td.hc {
  display: table-cell;
  aspect-ratio: auto;
  border-radius: 6px;
  cursor: default;
}
.hc.l1 { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.hc.l2 { background: color-mix(in srgb, var(--accent) 36%, var(--surface)); }
.hc.l3 { background: color-mix(in srgb, var(--accent) 56%, var(--surface)); }
.hc.l4 { background: color-mix(in srgb, var(--accent) 78%, var(--surface)); }

.heat .hc.on {

/* ---------- tezgah modu ---------- */
body.ctr-open {
  overflow: hidden;
}
.ctr {
  position: fixed;
  inset: 0;
  z-index: 140;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  opacity: 0;
  transform: scale(.99);
  transition: opacity .2s ease, transform .2s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.ctr.on {
  opacity: 1;
  transform: none;
}
.ctr.flash {
  animation: ctrFlash 1s ease;
}
@keyframes ctrFlash {
  0% { box-shadow: inset 0 0 0 0 var(--accent); }
  30% { box-shadow: inset 0 0 0 10px var(--accent); }
  100% { box-shadow: inset 0 0 0 0 transparent; }
}
.ctr-h {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.ctr-h .grow {
  display: grid;
  min-width: 0;
}
.ctr-sub {
  color: var(--muted);
  font-size: 12px;
}

  font-size: 26px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.ctr-main {
  flex: 1;
  overflow-y: auto;
  display: grid;
  gap: 18px;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ctr-title {
  display: flex;

  gap: 10px;

  font-size: 24px;
  font-weight: 800;
}
.pulse {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
  50% { box-shadow: 0 0 0 10px transparent; }
}
.ctr-cards {
  display: grid;

  font-weight: 700;
}
.tb-amt {
  font-size: 14px;
  font-weight: 700;
}
.tbl.free {
  background: var(--bg-2);
  border-style: dashed;
}
.tbl.free .tb-no {
  color: var(--muted);
}
.tbl.open {
  border-color: color-mix(in srgb, var(--teal) 50%, var(--line));
}
.tbl.open .tb-st {
  color: var(--teal);
}
.tbl.call {
  border: 2px solid var(--bad);
  background: var(--bad-soft);
  animation: hotPulse 1.6s ease-in-out infinite;
}
.tbl.call .tb-st {
  color: var(--bad);
}
.tbl-badge {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--teal);
  color: var(--surface);
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 800;
}
.bill {
  display: grid;
  padding: 6px 16px;
  border-radius: var(--r);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.bill-i {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line-2);
  font-size: 14px;
}
.bill-i b {
  min-width: 70px;
  text-align: right;
}
.bill-t {
  display: flex;
  justify-content: space-between;
  padding: 12px 0 8px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
}

/* ---------- hedef, gün sonu, hesaplayıcı ---------- */
.goal-c .i-ic {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  flex: none;
}
.goal-in {
  display: flex;
  align-items: center;
  gap: 16px;
}
.goal-in .grow {
  display: grid;
  gap: 4px;
  justify-items: start;
}
.goal-in h3 {
  font-size: 18px;
}
.goal-c .ring-val .pr {
  stroke: var(--accent);
}
.goal-c.done {
  border-color: var(--good);
  background: var(--good-soft);
}
.goal-c.done .ring-val .pr {
  stroke: var(--good);
}
.pill svg {
  width: 13px;
  height: 13px;
}
.stepper {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}
.stepper .icon-btn {
  width: 52px;
  height: 52px;
  font-size: 26px;
  font-weight: 700;
}
.stepper .input {
  width: 120px;
  text-align: center;
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 800;
}
.de-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.de-grid > div {
  display: grid;
  gap: 2px;
  padding: 14px;
  border-radius: var(--r);
  background: var(--bg-2);
}
.de-grid b {
  font-family: var(--font-display);
  font-size: 30px;
  line-height: 1;
}
.de-grid span {
  color: var(--ink-2);
  font-size: 13px;
}
.de-text {
  margin: 0;
  padding: 14px;
  border-radius: var(--r);
  border: 1px dashed var(--line-2);
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.roi h2 {
  display: flex;
  align-items: center;
  gap: 8px;
}
.roi h2 svg {
  width: 20px;
  height: 20px;
  color: var(--accent-ink);
}
.roi {
  display: grid;
  gap: 14px;
}
.roi .card-h {
  margin: 0;
}
.roi-in {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.roi-g {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.roi-g > div {
  display: grid;
  gap: 2px;
  padding: 12px;
  border-radius: var(--r);
  background: var(--bg-2);
}
.roi-g span {
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
}
.roi-g b {
  font-family: var(--font-display);
  font-size: 20px;
}
.roi-g em {
  color: var(--muted);
  font-size: 11px;
  font-style: normal;
}
.roi-g .pos {
  background: var(--good-soft);
}
.roi-g .pos b {
  color: var(--good);
}
.roi-g .neg {
  background: var(--bad-soft);
}
.roi-g .neg b {
  color: var(--bad);
}

/* ---------- komut paleti ---------- */
.pal {
  position: fixed;
  inset: 0;
  z-index: 150;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: max(70px, env(safe-area-inset-top, 0px)) 16px 16px;
  background: var(--scrim);
  opacity: 0;
  transition: opacity .15s ease;
}
.pal.on {
  opacity: 1;
}
.pal-box {
  width: min(560px, 100%);
  max-height: min(70vh, 560px);
  display: flex;
  flex-direction: column;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateY(-8px);
  transition: transform .15s ease;
}
.pal.on .pal-box {
  transform: none;
}
.pal-in {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.pal-in svg {
  width: 20px;
  height: 20px;
  color: var(--muted);
}
.pal-in input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: 17px;
}
.pal-l {
  overflow-y: auto;
  padding: 6px;
}
.pal-g {
  padding: 10px 10px 4px;
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.pal-i {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.pal-i .grow {
  display: grid;
  min-width: 0;
}
.pal-i.on {
  background: var(--bg-2);
}
.pal-i .chev {
  width: 16px;
  height: 16px;
  color: var(--muted);
  opacity: 0;
}
.pal-i.on .chev {
  opacity: 1;
}
.pal-ic {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--bg-2);
  color: var(--ink-2);
}
.pal-i.on .pal-ic {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.pal-ic svg {
  width: 18px;
  height: 18px;
}
.pal-e {
  padding: 24px;
  text-align: center;
}
.pal-f {
  display: flex;
  gap: 14px;
  padding: 10px 16px;
  border-top: 1px solid var(--line);
}
.kv.keys dt {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

/* ---------- kurulum, yardım, tur ---------- */
.setup {
  display: grid;
  gap: 12px;
}
.setup .card-h {
  margin: 0;
}
.setup-l {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 2px;
}
.setup-l li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}
.setup-l li .grow {
  display: grid;
}
.setup-l li.ok b {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--line-2);
}
.sl-c {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px dashed var(--line-2);
}
.setup-l li.ok .sl-c {
  border: 0;
  background: var(--good);
  color: #fff;
}
.sl-c svg {
  width: 14px;
  height: 14px;
}
.faq details {
  border-top: 1px solid var(--line);
}
.faq details:first-child {
  border-top: 0;
}
.faq summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0;
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.faq summary::-webkit-details-marker {
  display: none;
}
.faq summary .chev {
  width: 18px;
  height: 18px;
  flex: none;
  color: var(--muted);
  transform: rotate(90deg);
  transition: transform .2s ease;
}
.faq details[open] summary .chev {
  transform: rotate(-90deg);
}
.faq details p {
  padding: 0 0 14px;
  font-size: 14px;
}
.say {
  margin: 0 0 12px;
  padding: 14px 16px;
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--r) var(--r) 0;
  background: var(--accent-soft);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.35;
}
.news {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.news li {
  display: grid;
  gap: 2px;
  padding-left: 14px;
  border-left: 3px solid var(--teal);
}
.tour {
  position: fixed;
  inset: 0;
  z-index: 160;
  opacity: 0;
  transition: opacity .2s ease;
}
.tour.on {
  opacity: 1;
}
.tour-hole {
  position: fixed;
  border-radius: 16px;
  box-shadow: 0 0 0 9999px rgba(12, 23, 21, .62);
  transition: all .3s cubic-bezier(.2, .9, .3, 1);
  pointer-events: none;
}
.tour-hole::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 18px;
  border: 2px solid var(--accent);
}
.tour-card {
  position: fixed;
  display: grid;
  gap: 8px;
  padding: 18px;
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  transition: top .3s ease, left .3s ease;
}
.tour-card h3 {
  font-size: 19px;
}

/* ---------- konfeti ---------- */
.confetti {
  position: fixed;
  inset: 0;
  z-index: 200;
  pointer-events: none;
  overflow: hidden;
}
.confetti i {
  position: absolute;
  top: -12px;
  width: 9px;
  height: 14px;
  border-radius: 2px;
  animation: confetti 2.2s cubic-bezier(.25, .6, .4, 1) forwards;
}
@keyframes confetti {
  to {
    transform: translate(var(--dx), 105vh) rotate(var(--rot));
    opacity: .9;
  }
}

/* ---------- geniş ekranlar ---------- */
@media (min-width: 420px) {
  .net-b span {
    display: inline;
  }
}
@media (min-width: 560px) {
  .hide-s {
    display: inline-grid;
  }
  .kpis.six {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .menu-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .quick.six {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .de-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .hb {
    grid-template-columns: 110px minmax(0, 1fr) 56px;
  }
  .ctr-cards {
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr));
  }
}
@media (min-width: 760px) {
  .rep-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
  }
  .rep-grid .span2 {
    grid-column: 1 / -1;
  }
  .studio {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    align-items: start;
  }
  .studio-prev {
    position: sticky;
    top: calc(var(--hdr-h) + 18px + env(safe-area-inset-top, 0px));
  }
  .ctr-main {
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 24px;
    padding: 24px 28px;
  }
  .ctr-idle {
    grid-template-columns: auto minmax(0, 1fr);
    justify-items: start;
    text-align: left;
    gap: 36px;
    min-height: 60vh;
  }
  .ctr-idle p {
    margin-left: 0;
  }
  .ctr-qr canvas {
    width: min(34vw, 340px);
  }
  .ctr-clock {
    font-size: 34px;
  }
}
@media (min-width: 960px) {
  .kpis.six {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .kpis.six .k-val {
    font-size: 30px;
  }
}

/* ---------- yazdırma ---------- */
@media print {
  .hdr,
  .rail,
  .tabbar,
  .pend-bar,
  .demo-strip,
  .toast-host,
  .no-print,
  .scrim,
  .sheet,
  .sticky-save,
  .tour,
  .pal {
    display: none !important;
  }
  body {
    background: #fff;
  }
  .page {
    padding: 0;
    max-width: none;
  }
  .layout {
    display: block;
  }
  .card,
  .kpi {
    break-inside: avoid;
    box-shadow: none;
  }
  .rep-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  body.printing-art > *:not(#printArea) {
    display: none !important;
  }
  body.printing-art #printArea {
    display: block !important;
  }
  body.printing-art #printArea img {
    display: block;
  }
}
.hdr-sub {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.demo-strip .in > span {
  flex: 1;
  min-width: 0;
}
.demo-strip a {
  white-space: nowrap;
}

/* ---------- öneriler ---------- */
.sugs h2,
.fc-b {
  display: flex;
  align-items: center;
  gap: 8px;
}
.sugs h2 svg {
  width: 20px;
  height: 20px;
  color: var(--accent-ink);
}
.sug-l {
  display: grid;
  gap: 10px;
}
.sug {
  --tone: var(--accent);
  --tone-soft: var(--accent-soft);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px;
  border-radius: var(--r);
  background: var(--tone-soft);
  transition: opacity .2s ease, transform .2s ease;
}
.sug.leaving {
  opacity: 0;
  transform: translateX(20px);
}
.sug.tone-teal { --tone: var(--teal); --tone-soft: var(--teal-soft); }
.sug.tone-sun { --tone: #8A6500; --tone-soft: var(--sun-soft); }
.sug.tone-good { --tone: var(--good); --tone-soft: var(--good-soft); }
.sug.tone-warn { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.sug.tone-bad { --tone: var(--bad); --tone-soft: var(--bad-soft); }
.sug .grow {
  display: grid;
  gap: 2px;
  flex: 1 1 200px;
  min-width: 0;
}
.sug-ic {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface);
  color: var(--tone);
}
.sug-ic svg {
  width: 19px;
  height: 19px;
}
.sug-a {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.exp-l {
  display: grid;
  gap: 6px;
}
.exp-i {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.exp-i .grow {
  display: grid;
  gap: 3px;
  min-width: 0;
}
.exp-n {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 600;
}
.exp-n svg {
  width: 14px;
  height: 14px;
  flex: none;
}
.fc-b {
  padding: 12px 14px;
  border-radius: var(--r);
  background: var(--teal-soft);
  color: var(--ink);
  font-size: 14px;
  margin-bottom: 16px;
}
.fc-b .sc-ic {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--surface);
  color: var(--teal);
}
.fc-b .sc-ic svg {
  width: 18px;
  height: 18px;
}

/* ---------- seviye rozeti ---------- */
.lv {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 99px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  vertical-align: 2px;
}
.lv.altin { background: var(--sun); color: #2A2208; }
.lv.gumus { background: color-mix(in srgb, var(--muted) 24%, var(--surface)); color: var(--ink); }
.lv.bronz { background: color-mix(in srgb, #B0683A 22%, var(--surface)); color: #8A4A22; }
.pill.sm-p {
  padding: 1px 7px;
  font-size: 10.5px;
  margin-left: 4px;
}

/* ---------- takvim ---------- */
.cal-wrap {
  overflow-x: auto;
  padding-bottom: 4px;
}
.cal {
  display: grid;
  grid-template-columns: 30px repeat(var(--cols), minmax(14px, 1fr));
  grid-template-rows: 16px repeat(7, auto);
  gap: 3px;
  min-width: 300px;
}
.cal > span {
  grid-row: 1;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  white-space: nowrap;
}
.cal .cal-y {
  grid-column: 1;
}
.cal i {
  aspect-ratio: 1;
  min-height: 12px;
  border-radius: 4px;
}
.cal .cal-x {
  background: transparent;
}
.cal .hc.today {
  outline: 2px solid var(--teal);
  outline-offset: 1px;
}
.cal .hc.on {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}
.cal-info {
  margin-top: 10px;
}

/* ---------- toplu seçim ---------- */
.ci.sel {
  padding-left: 12px;
}
.ci .ck {
  flex: none;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 2px solid var(--line-2);
  color: transparent;
}
.ci .ck svg {
  width: 15px;
  height: 15px;
}
.ci[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.ci[aria-pressed="true"] .ck {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}
.sel-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 10px);
  z-index: 60;
  display: flex;
  justify-content: center;
  padding: 0 max(12px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.sel-in {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 18px;
  background: var(--ink);
  color: var(--surface);
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
}
.sel-in b {
  margin-right: 6px;
}
.sel-in .btn.ghost {
  color: var(--surface);
  border-color: color-mix(in srgb, var(--surface) 30%, transparent);
}
@media (min-width: 960px) {
  .sel-bar {
    bottom: 22px;
  }
}

/* ---------- PIN ---------- */
.pin {
  position: fixed;
  inset: 0;
  z-index: 170;
  display: grid;
  place-items: center;
  padding: 16px;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.pin-box {
  display: grid;
  gap: 20px;
  justify-items: center;
  width: min(320px, 100%);
  padding: 26px 22px;
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
}
.pin-box.shake {
  animation: shake .4s ease;
}
@keyframes shake {
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
.pin-dots {
  display: flex;
  gap: 14px;
}
.pin-dots i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--line-2);
  transition: background .1s ease;
}
.pin-dots i.on {
  background: var(--ink);
  border-color: var(--ink);
}
.pin-keys {
  display: grid;

  host.appendChild(el);
  setTimeout(function(){ el.classList.add("out"); setTimeout(function(){ el.remove(); }, 260); }, 2600);
}

  if(on){
    if(!scrimEl){ scrimEl = document.createElement("div"); scrimEl.className = "scrim"; document.body.appendChild(scrimEl); }
    scrimEl.onclick = onClick || null;
    requestAnimationFrame(function(){ scrimEl.classList.add("on"); });

}

    document.body.appendChild(d);
    function done(v){
      d.classList.remove("on"); scrim(false);

      document.removeEventListener("keydown", key);

function unlockAudio(){

    if(!S.audio){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; S.audio = new AC(); }
    if(S.audio.state !== "running") S.audio.resume();
  } catch(e){}
}

function chime(){
  var a = S.audio;
  if(!a || a.state !== "running") return;
  var t = a.currentTime;
  [[0, 880], [0.16, 1318.5]].forEach(function(n){
    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = n[1];
    g.gain.setValueAtTime(0.0001, t + n[0]);
    g.gain.exponentialRampToValueAtTime(0.28, t + n[0] + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + n[0] + 0.45);
    o.connect(g); g.connect(a.destination);
    o.start(t + n[0]); o.stop(t + n[0] + 0.5);
  });
  try { if(navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch(e){}
}

  if(DEMO) return Demo.api(path, opts);
  var h = { "apikey": SB_KEY, "Authorization": "Bearer " + S.session.access_token, "Content-Type": "application/json" };
  if(opts.headers){ for(var k in opts.headers){ h[k] = opts.headers[k]; } }

    method: opts.method || "GET",

  if(r.status === 401 && !retry){
    saveSession(await authCall("refresh_token", { refresh_token: S.session.refresh_token }));
    return api(path, opts, true);
  }
  var t = await r.text();
  if(!r.ok){ throw new Error(r.status + " " + t); }

}

var QR = (function(){

    }

  function rsDivisor(degree){
    var res = [];
    for(var i = 0; i < degree - 1; i++) res.push(0);
    res.push(1);
    var root = 1;
    for(var k = 0; k < degree; k++){
      for(var j = 0; j < res.length; j++){
        res[j] = gfMul(res[j], root);
        if(j + 1 < res.length) res[j] ^= res[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return res;
  }

    var res = div.map(function(){ return 0; });
    data.forEach(function(b){

    for(; ver <= 10; ver++){

  }

   Grafikler: tek seri sütun grafiği (gün gün damga)
   ========================================================= */
function barChart(id, data, opts){
  opts = opts || {};
  var W = Math.max(260, Math.round(opts.width || 640)), H = opts.height || 220, padL = 32, padR = 6, padT = 14, padB = 28;
  var max = 0;
  data.forEach(function(d){ if(d.v > max) max = d.v; });
  var top = niceMax(max), steps = 4;
  var iw = W - padL - padR, ih = H - padT - padB;
  var bw = iw / data.length, barW = Math.max(6, Math.min(26, bw * 0.58));
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + attr(opts.label || "") + '">';
  for(var s = 0; s <= steps; s++){
    var val = top / steps * s, y = padT + ih - ih * (val / top);
    svg += '<line class="' + (s === 0 ? "base" : "grid") + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + Math.round(val) + '</text>';
  }
  data.forEach(function(d, i){
    var cx = padL + bw * i + bw / 2;
    var h = top ? ih * (d.v / top) : 0;
    var y = padT + ih - h, r = Math.min(4, barW / 2, h);
    var path = h > 0
      ? 'M' + (cx - barW / 2).toFixed(1) + ',' + (padT + ih) + ' V' + (y + r).toFixed(1) +
        ' Q' + (cx - barW / 2).toFixed(1) + ',' + y.toFixed(1) + ' ' + (cx - barW / 2 + r).toFixed(1) + ',' + y.toFixed(1) +
        ' H' + (cx + barW / 2 - r).toFixed(1) + ' Q' + (cx + barW / 2).toFixed(1) + ',' + y.toFixed(1) + ' ' + (cx + barW / 2).toFixed(1) + ',' + (y + r).toFixed(1) +
        ' V' + (padT + ih) + ' Z'
      : '';
    if(path) svg += '<path class="bar' + (d.today ? " today" : "") + '" data-i="' + i + '" d="' + path + '"/>';
    var showLbl = data.length <= 14 ? (i % 2 === (data.length - 1) % 2) : (i % 5 === (data.length - 1) % 5);
    if(showLbl || d.today) svg += '<text x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" class="' + (d.today ? "strong" : "") + '">' + esc(d.l) + '</text>';
    svg += '<rect class="hit" data-i="' + i + '" x="' + (padL + bw * i).toFixed(1) + '" y="' + padT + '" width="' + bw.toFixed(1) + '" height="' + ih + '"/>';
  });
  svg += '</svg><div class="tip" id="' + id + '-tip"></div>';
  return { html: svg, bind: function(){
    var wrap = $(id), tip = $(id + "-tip");
    if(!wrap) return;
    function show(i, evX){
      var d = data[i];
      wrap.classList.add("hovering");
      wrap.querySelectorAll(".bar").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-i") === String(i)); });
      tip.innerHTML = '<b>' + nf(d.v) + ' damga</b>' + esc(d.full);
      var rect = wrap.getBoundingClientRect();
      var cx = (padL + bw * i + bw / 2) / W * rect.width;
      var h = top ? (H - padT - padB) * (d.v / top) : 0;
      var cy = (padT + (H - padT - padB) - h) / H * rect.height;
      tip.style.left = clamp(cx, 60, rect.width - 60) + "px";
      tip.style.top = cy + "px";
      tip.classList.add("on");
    }
    function hide(){ wrap.classList.remove("hovering"); tip.classList.remove("on"); }
    wrap.querySelectorAll(".hit").forEach(function(h){
      var i = Number(h.getAttribute("data-i"));
      h.addEventListener("mouseenter", function(){ show(i); });
      h.addEventListener("click", function(e){ e.stopPropagation(); show(i); });
    });
    wrap.addEventListener("mouseleave", hide);
    document.addEventListener("click", function(e){ if(!wrap.contains(e.target)) hide(); });
  } };
}
function niceMax(v){
  if(v <= 4) return 4;
  var raw = v / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  var m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  var step = m * p;
  if(step < 1) step = 1;
  if(step !== Math.round(step)) step = Math.ceil(step);
  return step * 4;
}

function ring(val, max, size, stroke, cls){
  size = size || 64; stroke = stroke || 7;
  var r = (size - stroke) / 2, c = 2 * Math.PI * r, p = max ? clamp(val / max, 0, 1) : 0;
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true"><circle class="tr" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + stroke + '"/>' +
    '<circle class="pr ' + (cls || "") + '" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + (c * (1 - p)).toFixed(2) + '"/></svg>';
}

async function login(){
  var em = $("em").value.trim();
  var pw = $("pw").value;
  var b = $("lg");
  if(!em || !pw){ showLogin("E-posta ve şifreni yaz."); return; }
  b.disabled = true; b.textContent = "Giriş yapılıyor...";
  unlockAudio();
  try { saveSession(await authCall("password", { email: em, password: pw })); }
  catch(e){ showLogin(e.message === "Invalid login credentials" ? "E-posta veya şifre hatalı." : netMsg(e)); return; }
  if(needsNewPw()){ showSetPw(); return; }
  try { await loadAll(); } catch(e){ showFatal(e); }
}

async function loadAll(){

  if(!bs || !bs.length){ showNoBiz(); return; }
  S.biz = bs[0];
  try { S.payInfo = (await api("rpc/payment_info", { method: "POST", body: {} })) || {}; } catch(e){ S.payInfo = {}; }
  S.reviewReady = false;
  try {
    var g = await api("rpc/owner_get_review_url", { method: "POST", body: { p_id: String(S.biz.id) } });
    if(g && g.status === "ok"){ S.biz.google_review_url = g.url || null; S.reviewReady = true; }
  } catch(e){}
  if(isInactive(S.biz)){ showLocked(); return; }
  var since = startOfDay(Date.now() - 29 * 86400000).toISOString();
  var res = await Promise.all([
    fetchAll("customers?select=id,name,phone,stamps,rewards_available,last_stamp_at&business_id=eq." + S.biz.id + "&order=last_stamp_at.desc.nullslast,id", 10000),
    api(pendingQuery()),
    fetchAll("stamp_events?select=id,created_at,status,customers(id,name)&business_id=eq." + S.biz.id + "&created_at=gte." + encodeURIComponent(since) + "&order=created_at.desc,id.desc", 30000)
      .then(function(r){ return { ok: true, r: r || [] }; }, function(){ return { ok: false, r: [] }; }),
    api("rpc/owner_tables_state", { method: "POST", body: { p_id: String(S.biz.id) } })
      .then(function(r){ return r && r.status === "ok" ? r : null; }, function(){ return null; }),
    Store.load().catch(function(){})
  ]);
  Data.invalidate();
  S.customers = res[0] || [];
  S.pending = res[1] || [];
  S.events = res[2].r;
  S.eventsOk = res[2].ok;
  S.tables = res[3] && res[3].tables && res[3].tables.length ? res[3] : null;
  if(!S.eventsOk){
    try {
      var d = startOfDay(new Date());
      var ev = await api("stamp_events?select=id&business_id=eq." + S.biz.id + "&status=eq.approved&created_at=gte." + encodeURIComponent(d.toISOString()) + "&limit=1000");
      S.todayCount = ev.length;
    } catch(e){ S.todayCount = 0; }
  }
  if(S.seenPending === null){
    S.seenPending = {};
    S.pending.forEach(function(p){ S.seenPending[p.id] = 1; });
  }
  derive();
  renderShell();
  startPoll();
}

function derive(){
  var need = S.biz.stamps_needed || 4;
  var now = Date.now(), t0 = startOfDay(now).getTime(), DAY = 86400000;
  var appr = S.events.filter(function(e){ return e.status === "approved"; });
  function between(a, b){ return appr.filter(function(e){ var t = new Date(e.created_at).getTime(); return t >= a && t < b; }).length; }
  var st = {};
  st.today = S.eventsOk ? between(t0, now + 60000) : S.todayCount;
  st.yestSoFar = between(t0 - DAY, t0 - DAY + (now - t0));
  st.week = between(t0 - 6 * DAY, now + 60000);
  st.prevWeek = between(t0 - 13 * DAY, t0 - 6 * DAY);
  st.days = [];
  for(var i = 29; i >= 0; i--){
    var ds = t0 - i * DAY;
    var dt = new Date(ds);
    st.days.push({ v: between(ds, ds + DAY), l: String(dt.getDate()), full: fmtLong(dt), today: i === 0 });
  }
  st.hours = new Array(24).fill(0);
  appr.forEach(function(e){ st.hours[new Date(e.created_at).getHours()]++; });
  var ids = {};
  appr.forEach(function(e){ var id = e.customers && e.customers.id; if(id != null) ids[id] = (ids[id] || 0) + 1; });
  var counts = Object.keys(ids).map(function(k){ return ids[k]; });
  st.active = counts.length;
  st.repeat = counts.filter(function(n){ return n >= 2; }).length;
  st.repeatRate = pct(st.repeat, st.active);
  st.monthByCustomer = ids;
  st.near = S.customers.filter(function(c){ return need > 1 && c.stamps === need - 1; });
  st.tickets = S.customers.filter(function(c){ return c.rewards_available > 0; });
  st.ticketTotal = st.tickets.reduce(function(a, c){ return a + c.rewards_available; }, 0);
  st.lost = S.customers.filter(function(c){ return c.last_stamp_at && daysSince(c.last_stamp_at) >= 21; });
  st.recent = S.events.slice(0, 8);
  var bh = -1, bv = 0;
  st.hours.forEach(function(v, h){ if(v > bv){ bv = v; bh = h; } });
  st.peakHour = bh;
  st.vi30 = visitIndex(S.events);
  S.stats = st;
}

function stopPoll(){ if(S.poller){ clearInterval(S.poller); S.poller = null; } }
function startPoll(){
  stopPoll();
  S.tick = 0;
  S.poller = setInterval(refreshPending, 4000);
}

async function refreshPending(){
  if(!S.biz || !S.session || !$("view")) return;
  if(document.hidden && !bgPoll()) return;
  if(!online()) return;
  S.tick++;
  try {
    if(S.tick % 5 === 0){
      var st = await api("businesses?id=eq." + S.biz.id + "&select=paid_until,suspended");
      if(st && st.length){
        S.biz.paid_until = st[0].paid_until;
        S.biz.suspended = st[0].suspended;
        if(isInactive(S.biz)){ closeSheet(true); scrim(false); showLocked(); return; }
      }
    }
    var p = await api(pendingQuery());
    var fresh = 0;
    p.forEach(function(x){ if(!S.seenPending[x.id]){ S.seenPending[x.id] = 1; fresh++; } });
    S.pending = p;
    if(fresh) notifyNew(p, fresh);
    renderPendBar();
    updateBadges();
    if(sheetEl && sheetEl.getAttribute("data-k") === "appr") renderApprList();
    Counter.update();
    var tv = S.tab === "masalar";
    if((S.tables || tv) && S.tick % (tv ? 2 : 3) === 0){
      var ts = await api("rpc/owner_tables_state", { method: "POST", body: { p_id: String(S.biz.id) } });
      if(ts && ts.status === "ok"){
        var prevCalls = (S.tables && S.tables.calls || []).map(function(c){ return c.id; });
        S.tables = ts.tables && ts.tables.length ? ts : null;
        var w = $("tblW"); if(w) w.innerHTML = tablesInner();
        var newCall = (ts.calls || []).some(function(c){ return prevCalls.indexOf(c.id) < 0; });
        if(newCall && prevCalls !== null && S.tablesSeen) callAlert(ts.calls);
        S.tablesSeen = true;
        if(tv) masalarRefresh(ts);
      }
    }
  } catch(e){}
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshPending(); });

  var box = $("chartBox");
  if(!box) return;

  if(!S.eventsOk){

  var data = st.days.slice(-chartRange);
  var total = data.reduce(function(a, d){ return a + d.v; }, 0);
  var best = data.reduce(function(a, d){ return d.v > a.v ? d : a; }, data[0]);
  var w = box.clientWidth || 600;
  box.setAttribute("data-w", w);
  var ch = barChart("ch1", data, { width: w, height: w < 480 ? 190 : 230, label: "Son " + chartRange + " günde günlük onaylanan damga sayısı" });
  box.innerHTML = '<div class="chart-wrap" id="ch1">' + ch.html + '</div>' +
    '<div class="chart-sum"><span>Toplam <b>' + nf(total) + '</b></span><span>Günlük ortalama <b>' + (total / data.length).toLocaleString("tr-TR", { maximumFractionDigits: 1 }) + '</b></span>' +
    (best && best.v ? '<span>En iyi gün <b>' + esc(best.full.split(" ").slice(0, 2).join(" ")) + ' (' + best.v + ')</b></span>' : '') + '</div>';
  ch.bind();
}

function filterList(f){

function tagChipsHtml(){
  var tags = Store.allTags();
  if(!tags.length) return "";

    return '<button class="chip sm" type="button" data-tf="' + attr(t.t) + '" aria-pressed="' + (S.tagF === t.t) + '">' + esc(t.t) + ' <b>' + t.n + '</b></button>';
  }).join("") + '</div>';
}

function sortedFiltered(){
  var qn = S.q.toLocaleLowerCase("tr-TR").trim(), qp = S.q.replace(/\D/g, "");
  var rows = filterList(S.filter).filter(function(c){
    var n = Store.note(c.id);
    if(S.tagF && !(n && (n.t || []).indexOf(S.tagF) > -1)) return false;
    if(!qn) return true;
    return (c.name || "").toLocaleLowerCase("tr-TR").indexOf(qn) > -1 || (qp && String(c.phone).indexOf(qp) > -1) ||
      (n && ((n.n || "").toLocaleLowerCase("tr-TR").indexOf(qn) > -1 || (n.t || []).some(function(t){ return t.toLocaleLowerCase("tr-TR").indexOf(qn) > -1; })));
  });
  if(S.sort === "stamps") rows.sort(function(a, b){ return (b.rewards_available * 100 + b.stamps) - (a.rewards_available * 100 + a.stamps); });
  else if(S.sort === "name") rows.sort(function(a, b){ return (a.name || "~").localeCompare(b.name || "~", "tr"); });
  else rows.sort(function(a, b){ return (b.last_stamp_at || "") > (a.last_stamp_at || "") ? 1 : (b.last_stamp_at || "") < (a.last_stamp_at || "") ? -1 : 0; });
  return rows;
}

function noteMark(c){
  var n = Store.note(c.id);
  if(!n) return "";
  return '<span class="note-mk" title="' + attr((n.t || []).join(", ") + (n.n ? (n.t && n.t.length ? " · " : "") + n.n : "")) + '">' + (n.n ? I.note : I.tag) + '</span>';
