<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fdf8ec">
<title>Damgalio</title>
<style>
:root{--bg:#fdf8ec;--ink:#24504c;--mut:#6f8c88;--line:#e2e9e3;--ac:#ee6a37;--onac:#ffffff;--acsoft:rgba(238,106,55,.15);--card:#ffffff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.page{max-width:480px;margin:0 auto;padding:26px 18px 40px}
.lab{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mut)}
.top{text-align:center}
h1{font-size:40px;line-height:1.05;letter-spacing:-1px;margin:10px 0 6px;font-weight:800}
h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
.subt{color:var(--mut);font-size:16px;margin:0;line-height:1.4}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 0}
.cb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:116px;border:0;border-radius:22px;background:var(--ac);color:var(--onac);font-size:18px;font-weight:800;font-family:inherit;padding:14px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.cb:active{transform:scale(.97)}
.cb.alt{background:var(--ink);color:#fff}
.cb svg{width:34px;height:34px}
.cb small{font-size:13px;font-weight:700;opacity:.85}
.cb.on{opacity:.92}
.cb.on::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:3px solid var(--ac);animation:ring 1.6s infinite}
.cb.alt.on::after{border-color:var(--ink)}
.cb[disabled]{cursor:default}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.banner{margin:14px 0 0;padding:13px 15px;border-radius:14px;background:var(--acsoft);font-weight:700;line-height:1.4;display:none}
.banner.ok{background:#e3f4ea;color:#1f6b43}
.banner.bad{background:#fde8e6;color:#8a2c22}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.live{display:flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:#2fb36b;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.it{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:16px}
.it .q{color:var(--mut);font-weight:700;margin-right:6px}
.it .p{font-weight:700;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.tot b{font-size:30px;letter-spacing:-.5px}
.empty{color:var(--mut);line-height:1.5;margin:8px 0 0}
.note{font-size:12px;color:var(--mut);margin:12px 0 0;line-height:1.4}
.wf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wf:last-child{border-bottom:0;padding-bottom:0}
.wf .v{font-weight:800;font-size:18px;word-break:break-all}
.sm{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.menu{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:17px;border-radius:18px;background:var(--ink);color:#fff;font-weight:800;font-size:18px;text-decoration:none}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.links a{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 8px;border-radius:16px;font-weight:800;font-size:15px;text-decoration:none;color:var(--ink);text-align:center}
.links a.ig{background:#fbe9f1}
.links a.gr{background:#fff4d6}
.links a.wa{background:#e5f5ec}
.links a.web{background:var(--acsoft)}
.links a.wide{grid-column:1 / -1}
.stamp{display:flex;gap:14px;align-items:center}
.stamp .ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--ac);display:grid;place-items:center}
.stamp p{margin:0;line-height:1.45}
.names{display:flex;gap:8px;margin-top:12px}
.names input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--acsoft);border-radius:999px;padding:7px 8px 7px 13px;font-weight:700;font-size:14px}
.chip button{border:0;background:rgba(0,0,0,.08);color:var(--ink);width:22px;height:22px;border-radius:50%;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.wheel{position:relative;width:280px;height:280px;margin:18px auto 0}
.wheel canvas{width:280px;height:280px;display:block}
.wheel .pin{position:absolute;left:50%;top:-6px;margin-left:-13px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.pri{width:100%;padding:16px;border:0;border-radius:14px;background:var(--ac);color:var(--onac);font-size:18px;font-weight:800;font-family:inherit;margin-top:14px;cursor:pointer}
.pri[disabled]{opacity:.5}
.res{text-align:center;font-size:20px;font-weight:800;margin:14px 0 0;min-height:26px}
.foot{margin-top:28px;text-align:center;font-size:12px;color:#8aa09c}
.foot a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"><div class="page"><div class="top"><p class="subt">Yükleniyor...</p></div></div></div>
<div class="toast" id="toast"></div>
<script>
var SB_URL = "https://rgtexozixcqrqhoepapr.supabase.co";
var SB_KEY = "sb_publishable_bKdS0htkq5rqCLIaulu5lQ_8LEqnFvg";
var app = document.getElementById("app");
var parts = location.pathname.split("/").filter(Boolean);
var token = parts[0] === "m" ? decodeURIComponent(parts[1] || "") : "";
var D = null, brand = null, skew = 0, built = false, pollT = null, fastUntil = 0, busy = {};
var names = [], spinning = false, rot = 0;

var I_BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15V11a6 6 0 0 1 12 0v4l1.5 2.5h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M12 3v2"/></svg>';
var I_BILL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>';
var I_MENU = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>';
var I_STAMP = '<svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="9" r="3.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M14 12.5h4v4h-4z" fill="#fff"/><rect x="7" y="16.5" width="18" height="6" rx="2" fill="#fff"/><path d="M8 26h16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';

function esc(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function okUrl(u){ return typeof u === "string" && /^https:\/\/[^\s"'<>]+$/.test(u); }
function $(id){ return document.getElementById(id); }
function money(n){
  n = Number(n || 0);
  return n.toLocaleString("tr-TR", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + " ₺";
}
function hm(v){ try { return new Date(v).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }); } catch(e){ return ""; } }
function srvNow(){ return Date.now() + skew; }
function ago(v){
  var s = Math.max(0, Math.round((srvNow() - new Date(v).getTime()) / 1000));
  if(s < 60) return "az önce";
  return Math.floor(s / 60) + " dk önce";
}
function igLabel(u){
  try { var p = new URL(u).pathname.split("/").filter(Boolean)[0]; return p ? "@" + p : "Instagram"; }
  catch(e){ return "Instagram"; }
}
function lum(r, g, b){
  function f(c){ c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function applyBrand(){
  if(!brand) return;
  if(/^#[0-9a-fA-F]{6}$/.test(brand.color || "")){
    var h = brand.color, r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    var st = document.documentElement.style;
    st.setProperty("--ac", h);
    st.setProperty("--onac", lum(r, g, b) > 0.5 ? "#1c2b29" : "#ffffff");
    st.setProperty("--acsoft", "rgba(" + r + "," + g + "," + b + ",.15)");
  }
  if(brand.name) document.title = brand.name + " · Masa " + D.no;
}
function toast(m){
  var t = $("toast"); t.textContent = m; t.className = "toast on";
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.className = "toast"; }, 1800);
}
function copy(v){
  function ok(){ toast("Kopyalandı"); }
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(ok, fallback); return; }
  } catch(e){}
  fallback();
  function fallback(){
    var i = document.createElement("textarea"); i.value = v; i.setAttribute("readonly", ""); i.style.position = "fixed"; i.style.opacity = "0";
    document.body.appendChild(i); i.select(); i.setSelectionRange(0, 999);
    try { document.execCommand("copy"); ok(); } catch(e){ prompt("Kopyala:", v); }
    document.body.removeChild(i);
  }
}

async function rpc(fn, body){
  var r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!r.ok){ var t = ""; try { t = await r.text(); } catch(e){} throw new Error(r.status + " " + t); }
  return r.json();
}

function simple(title, msg){
  app.innerHTML = '<div class="page"><div class="top"><div class="lab">Damgalio</div><h1 style="font-size:30px">' + esc(title) + '</h1>' +
    '<p class="subt">' + esc(msg) + '</p></div>' +
    '<button class="pri" id="rt" style="margin-top:24px">Tekrar dene</button>' +
    '<div class="foot">Damgalio ile çalışır</div></div>';
  $("rt").onclick = function(){ location.reload(); };
}

function build(){
  var b = brand;
  var h = '<div class="page">' +
    '<div class="top"><div class="lab">' + esc(b.name || "Damgalio") + '</div><h1>Masa ' + esc(D.no) + '</h1>' +
    '<p class="subt">Hoş geldin! Bir şeye ihtiyacın olursa buradan haber ver.</p></div>' +
    '<div class="acts">' +
    '<button class="cb" id="c_garson">' + I_BELL + '<span>Garson çağır</span><small id="s_garson"></small></button>' +
    '<button class="cb alt" id="c_hesap">' + I_BILL + '<span>Hesabı iste</span><small id="s_hesap"></small></button></div>' +
    '<div class="banner" id="bn"></div>' +
    '<div class="card"><div class="hd"><h2>Hesabın</h2><span class="live"><i></i><span id="upd"></span></span></div><div id="bill"></div></div>';
  if(okUrl(b.menu)) h += '<a class="menu" href="' + esc(b.menu) + '" target="_blank" rel="noopener">' + I_MENU + 'Menüyü aç</a>';
  if(b.wifi_name || b.wifi_pass){
    h += '<div class="card"><div class="hd"><h2>Wi-Fi</h2></div>';
    if(b.wifi_name) h += '<div class="wf"><div><div class="lab">Ağ adı</div><div class="v">' + esc(b.wifi_name) + '</div></div><button class="sm" data-cp="' + esc(b.wifi_name) + '">Kopyala</button></div>';
    if(b.wifi_pass) h += '<div class="wf"><div><div class="lab">Şifre</div><div class="v">' + esc(b.wifi_pass) + '</div></div><button class="sm" data-cp="' + esc(b.wifi_pass) + '">Kopyala</button></div>';
    h += '</div>';
  }
  var L = "";
  if(okUrl(b.review)) L += '<a class="gr wide" href="' + esc(b.review) + '" target="_blank" rel="noopener">★ Google\'da yorum yap</a>';
  if(okUrl(b.ig)) L += '<a class="ig" href="' + esc(b.ig) + '" target="_blank" rel="noopener">' + esc(igLabel(b.ig)) + '</a>';
  if(b.wa && /^[0-9]{10,15}$/.test(b.wa)) L += '<a class="wa" href="https://wa.me/' + b.wa + '" target="_blank" rel="noopener">WhatsApp</a>';
  if(okUrl(b.site)) L += '<a class="web" href="' + esc(b.site) + '" target="_blank" rel="noopener">Web sitesi</a>';
  if(L) h += '<div class="links">' + L + '</div>';
  if(b.reward && b.needed){
    h += '<div class="card stamp"><div class="ic">' + I_STAMP + '</div><p><b>Her ' + esc(b.needed) + ' damgada: ' + esc(b.reward) + '</b><br>' +
      '<span style="color:var(--mut)">Damga için kasadaki Damgalio damgasına telefonunu dokundurman yeterli.</span></p></div>';
  }
  h += '<div class="card"><div class="hd"><h2>Hesabı kim ödeyecek?</h2></div>' +
    '<p class="empty" style="margin:0">Masadakilerin adını ekle, çarkı çevir. Şans kimden yanaysa!</p>' +
    '<div class="names"><input id="nm" type="text" maxlength="14" placeholder="İsim yaz" autocomplete="off"><button class="sm" id="nmb">Ekle</button></div>' +
    '<div class="chips" id="chips"></div>' +
    '<div class="wheel"><canvas id="wh" width="560" height="560"></canvas><div class="pin"></div></div>' +
    '<button class="pri" id="spin">Çarkı çevir</button><div class="res" id="res"></div></div>';
  h += '<div class="foot">Damgalio ile çalışır &middot; <a href="/gizlilik.html" target="_blank" rel="noopener">Gizlilik</a></div></div>';
  app.innerHTML = h;
  $("c_garson").onclick = function(){ call("garson"); };
  $("c_hesap").onclick = function(){ call("hesap"); };
  app.querySelectorAll("[data-cp]").forEach(function(x){ x.onclick = function(){ copy(x.getAttribute("data-cp")); }; });
  $("nmb").onclick = addName;
  $("nm").onkeydown = function(e){ if(e.key === "Enter") addName(); };
  $("spin").onclick = spin;
  renderNames();
  built = true;
}

function renderBill(){
  var box = $("bill");
  if(!box) return;
  var items = D.items || [];
  $("upd").textContent = D.upd ? "Güncellendi " + hm(D.upd) : "Canlı";
  if(!items.length){
    box.innerHTML = '<p class="empty">Henüz hesabına bir şey eklenmedi. Siparişlerin girildikçe burada görünür.</p>';
    return;
  }
  box.innerHTML = items.map(function(i){
    return '<div class="it"><span><span class="q">' + esc(i.qty) + '×</span>' + esc(i.name) + '</span><span class="p">' + money(i.qty * i.price) + '</span></div>';
  }).join("") +
  '<div class="tot"><span class="lab">Toplam</span><b>' + money(D.total) + '</b></div>' +
  '<p class="note">Hesap, işletme tarafından girilir. Ödeme öncesi son tutarı kasada teyit et.</p>';
}

function lastCall(kind){
  var l = null;
  (D.calls || []).forEach(function(c){ if(c.kind === kind) l = c; });
  return l;
}

function renderCalls(){
  var msg = "", cls = "";
  ["garson", "hesap"].forEach(function(k){
    var c = lastCall(k), btn = $("c_" + k), s = $("s_" + k);
    if(!btn) return;
    var pend = c && !c.done;
    btn.className = "cb" + (k === "hesap" ? " alt" : "") + (pend ? " on" : "");
    btn.disabled = !!pend || !!busy[k];
    s.textContent = busy[k] ? "Gönderiliyor..." : (pend ? "Çağrıldı · " + ago(c.at) : "");
  });
  var g = lastCall("garson"), hs = lastCall("hesap");
  var pend = [g, hs].filter(function(c){ return c && !c.done; });
  if(pend.length){
    var k = pend[pend.length - 1].kind;
    msg = k === "hesap" ? "Hesap istendi. Garson hesabını getirecek." : "Garson çağrıldı. Birazdan masanda.";
  } else {
    var last = [g, hs].filter(Boolean).sort(function(a, b){ return new Date(b.done) - new Date(a.done); })[0];
    if(last && last.done && srvNow() - new Date(last.done).getTime() < 3 * 60000){
      msg = "Çağrın görüldü. Teşekkürler!"; cls = "ok";
    }
  }
  var bn = $("bn");
  if(busy.msg){ msg = busy.msg; cls = busy.cls || ""; }
  bn.className = "banner" + (cls ? " " + cls : "");
  bn.style.display = msg ? "block" : "none";
  bn.textContent = msg;
}

async function call(kind){
  if(busy[kind]) return;
  busy[kind] = true; busy.msg = null; renderCalls();
  try {
    var r = await rpc("public_table_call", { p_token: token, p_kind: kind });
    if(r.status === "wait"){ busy.msg = "Az önce bir çağrı gönderildi. Birkaç saniye sonra tekrar dene."; busy.cls = "bad"; }
    else if(r.status === "inactive"){ busy.msg = "Bu işletmenin masa hizmeti şu an kapalı."; busy.cls = "bad"; }
    else if(r.status === "not_found"){ busy.msg = "Bu masa bağlantısı artık geçerli değil."; busy.cls = "bad"; }
    fastUntil = Date.now() + 3 * 60000;
    busy[kind] = false;
    await load(true);
    if(busy.msg) setTimeout(function(){ busy.msg = null; renderCalls(); }, 5000);
  } catch(e){
    busy[kind] = false;
    busy.msg = /Failed to fetch|NetworkError|Load failed/i.test(String(e.message)) ? "İnternet bağlantını kontrol edip tekrar dene." : "Çağrı gönderilemedi. Tekrar dene.";
    busy.cls = "bad";
    renderCalls();
    setTimeout(function(){ busy.msg = null; renderCalls(); }, 5000);
  }
}

async function load(quiet){
  try {
    var r = await rpc("public_table", { p_token: token });
    if(r.status === "not_found"){ stop(); simple("Masa bulunamadı", "Bu masa bağlantısı geçerli değil. Masadaki kodu tekrar okut ya da garsona haber ver."); return; }
    if(r.status === "inactive"){ stop(); simple(r.name || "Masa hizmeti kapalı", "Bu işletmenin masa hizmeti şu an kullanılamıyor."); return; }
    if(r.status !== "ok") throw new Error("status " + r.status);
    D = r; brand = r.brand || {};
    if(r.now) skew = new Date(r.now).getTime() - Date.now();
    if(!built){ applyBrand(); build(); }
    renderBill();
    renderCalls();
  } catch(e){
    if(!built && !quiet) simple("Bir sorun oluştu", /Failed to fetch|NetworkError|Load failed/i.test(String(e.message)) ? "İnternet bağlantını kontrol edip tekrar dene." : "Birkaç saniye sonra tekrar dene.");
  }
}

function stop(){ if(pollT){ clearTimeout(pollT); pollT = null; } }
function loop(){
  stop();
  var ms = Date.now() < fastUntil ? 3000 : 8000;
  pollT = setTimeout(async function(){
    if(!document.hidden && built) await load(true);
    loop();
  }, ms);
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden && built){ load(true); } });

/* --- Hesabı kim ödeyecek? --- */
var COLS = null;
function cols(){
  var ac = getComputedStyle(document.documentElement).getPropertyValue("--ac").trim() || "#ee6a37";
  return [ac, "#24504c", "#f7d44c", "#2b6e63", "#f29b6b", "#10221f"];
}
function addName(){
  var i = $("nm"), v = i.value.trim().slice(0, 14);
  if(!v) return;
  if(names.length >= 10){ toast("En fazla 10 kişi"); return; }
  names.push(v); i.value = ""; i.focus();
  $("res").textContent = "";
  renderNames();
}
function renderNames(){
  $("chips").innerHTML = names.map(function(n, k){ return '<span class="chip">' + esc(n) + '<button data-rm="' + k + '" aria-label="Sil">✕</button></span>'; }).join("");
  $("chips").querySelectorAll("[data-rm]").forEach(function(b){
    b.onclick = function(){ if(spinning) return; names.splice(Number(b.getAttribute("data-rm")), 1); $("res").textContent = ""; renderNames(); };
  });
  $("spin").disabled = names.length < 2;
  drawWheel();
}
function drawWheel(){
  var c = $("wh"); if(!c) return;
  var x = c.getContext("2d"), W = 560, R = 270, n = Math.max(names.length, 1);
  COLS = COLS || cols();
  x.clearRect(0, 0, W, W);
  x.save(); x.translate(W / 2, W / 2); x.rotate(rot);
  for(var i = 0; i < n; i++){
    var a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n;
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, a0, a1); x.closePath();
    x.fillStyle = names.length ? COLS[i % COLS.length] : "#e9eeea"; x.fill();
    x.strokeStyle = "#fff"; x.lineWidth = 4; x.stroke();
    if(names.length){
      x.save(); x.rotate((a0 + a1) / 2);
      x.fillStyle = (i % COLS.length === 2) ? "#10221f" : "#fff";
      x.font = "800 30px -apple-system, Segoe UI, Roboto, sans-serif"; x.textAlign = "right"; x.textBaseline = "middle";
      x.fillText(names[i], R - 24, 0); x.restore();
    }
  }
  x.restore();
  x.beginPath(); x.arc(W / 2, W / 2, 34, 0, 2 * Math.PI); x.fillStyle = "#fff"; x.fill();
  x.beginPath(); x.arc(W / 2, W / 2, 34, 0, 2 * Math.PI); x.lineWidth = 6; x.strokeStyle = "#24504c"; x.stroke();
}
function spin(){
  if(spinning || names.length < 2) return;
  spinning = true; $("spin").disabled = true; $("res").textContent = "";
  var n = names.length, win = Math.floor(Math.random() * n), seg = 2 * Math.PI / n;
  var off = (Math.random() * 0.7 + 0.15) * seg;
  var target = -(win * seg + off);
  var base = rot - (rot % (2 * Math.PI));
  var end = base + 2 * Math.PI * 6 + ((target % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  var start = rot, t0 = performance.now(), dur = 4200;
  function f(now){
    var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    rot = start + (end - start) * e; drawWheel();
    if(p < 1){ requestAnimationFrame(f); return; }
    rot = rot % (2 * Math.PI); spinning = false; $("spin").disabled = names.length < 2;
    $("res").textContent = "Bugün hesabı " + names[win] + " ödüyor!";
  }
  requestAnimationFrame(f);
}

(async function(){
  if(!/^[a-z0-9]{6,20}$/.test(token)){ simple("Masa bulunamadı", "Bu masa bağlantısı geçerli değil. Masadaki kodu tekrar okut."); return; }
  await load(false);
  if(built) loop();
})();
