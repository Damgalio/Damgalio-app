<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1715" media="(prefers-color-scheme: dark)">
<title>Damgalio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Damgalio Masa: müşterinin masadaki NFC/QR ile açtığı sayfa.
   Tek sütun, büyük dokunma alanları; işletme rengiyle boyanır, koyu temayı destekler. */
:root {
  --bg: #F6F1E7;
  --bg-2: #EFE8DA;
  --surface: #FFFDF8;
  --surface-2: #FBF6EC;
  --ink: #12231F;
  --ink-2: #3E504C;
  --muted: #6F7F7B;
  --line: #E4DACA;
  --line-2: #D6CAB6;
  --teal: #24504C;
  --on-teal: #FFFFFF;
  --teal-soft: rgba(36, 80, 76, .12);
  --sun: #F2C94C;
  --sun-soft: #FBF0CC;
  --sun-line: #EED68A;
  --good: #1E7F55;
  --good-soft: #DCF1E6;
  --bad: #B93A26;
  --bad-soft: #F9E0DA;
  --glass: rgba(255, 253, 248, .9);
  --ac: #E8612C;
  --ac-rgb: 232, 97, 44;
  --on-ac: #FFFFFF;
  --ac-ink-l: #B8461A;
  --ac-ink-d: #F59A72;
  --ac-ink: var(--ac-ink-l);
  --ac-soft: rgba(var(--ac-rgb), .13);
  --ac-line: rgba(var(--ac-rgb), .55);
  --shadow: 0 1px 0 rgba(18, 35, 31, .04), 0 12px 30px -18px rgba(18, 35, 31, .4);
  --shadow-lg: 0 24px 60px -24px rgba(18, 35, 31, .5);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1715;
    --bg-2: #1C2F2A;
    --surface: #14231F;
    --surface-2: #182A26;
    --ink: #F1ECE2;
    --ink-2: #C3CDC9;
    --muted: #8D9C98;
    --line: #243631;
    --line-2: #2F443E;
    --teal: #8FC3B8;
    --on-teal: #0C1715;
    --teal-soft: rgba(143, 195, 184, .14);
    --sun-soft: #2E2A16;
    --sun-line: #4B4220;
    --good: #5BCB95;
    --good-soft: #15352A;
    --bad: #F08A76;
    --bad-soft: #3D1C17;
    --glass: rgba(20, 35, 31, .9);
    --ac-ink: var(--ac-ink-d);
    --ac-soft: rgba(var(--ac-rgb), .2);
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -18px rgba(0, 0, 0, .7);
    --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1715;
  --bg-2: #1C2F2A;
  --surface: #14231F;
  --surface-2: #182A26;
  --ink: #F1ECE2;
  --ink-2: #C3CDC9;
  --muted: #8D9C98;
  --line: #243631;
  --line-2: #2F443E;
  --teal: #8FC3B8;
  --on-teal: #0C1715;
  --teal-soft: rgba(143, 195, 184, .14);
  --sun-soft: #2E2A16;
  --sun-line: #4B4220;
  --good: #5BCB95;
  --good-soft: #15352A;
  --bad: #F08A76;
  --bad-soft: #3D1C17;
  --glass: rgba(20, 35, 31, .9);
  --ac-ink: var(--ac-ink-d);
  --ac-soft: rgba(var(--ac-rgb), .2);
  --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 12px 30px -18px rgba(0, 0, 0, .7);
  --shadow-lg: 0 24px 60px -24px rgba(0, 0, 0, .8);
  color-scheme: dark;
}
[hidden] {
  display: none !important;
}
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
}
a {
  touch-action: manipulation;
}
:focus-visible {
  outline: 3px solid var(--ac-line);
  outline-offset: 2px;
}
h1,
h2,
h3 {
  margin: 0;
  font-family: var(--font-display);
  letter-spacing: -.015em;
  line-height: 1.1;
}
p {
  margin: 0;
}
svg {
  flex: none;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13.5px;
}
.eyebrow {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.page {
  max-width: 520px;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(104px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.demo {
  margin: 0 0 8px;
  padding: 7px 12px;
  border-radius: 12px;
  background: var(--sun-soft);
  border: 1px dashed var(--sun-line);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 700;
  text-align: center;
}

/* ---------- üst çubuk ---------- */
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 0 10px;
}
.bz {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  flex: 1;
}
.bz-av {
  width: 42px;
  height: 42px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--ac);
  color: var(--on-ac);
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .02em;
}
.bz-t {
  min-width: 0;
  display: grid;
  line-height: 1.2;
}
.bz-t b {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 800;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.bz-t span {
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
.lang {
  flex: none;
  display: inline-flex;
  padding: 3px;
  border-radius: 13px;
  background: var(--bg-2);
}
.lang button {
  min-width: 42px;
  min-height: 36px;
  padding: 4px 8px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .04em;
}
.lang button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

/* ---------- karşılama ---------- */
.hero {
  position: relative;
  padding: 22px 22px 84px;
  border-radius: 30px;
  background: var(--ac);
  color: var(--on-ac);
  overflow: hidden;
  isolation: isolate;
}
.hero::before,
.hero::after {
  content: "";
  position: absolute;
  z-index: -1;
  border-radius: 50%;
  border: 2.5px dashed currentColor;
  opacity: .22;
}
.hero::before {
  width: 200px;
  height: 200px;
  right: -52px;
  top: -64px;
}
.hero::after {
  width: 120px;
  height: 120px;
  right: 54px;
  bottom: -40px;
}
.hero .eyebrow {
  color: inherit;
  opacity: .85;
}
.hero h1 {
  margin-top: 6px;
  font-size: 64px;
  font-weight: 800;
  line-height: .95;
  letter-spacing: -.03em;
}
.hero p {
  margin-top: 10px;
  max-width: 28ch;
  font-size: 16px;
  font-weight: 600;
  opacity: .93;
}

/* ---------- çağrı düğmeleri ---------- */
.acts {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 12px;
  margin-top: -66px;
  padding: 0 10px;
}
.cb {
  position: relative;
  display: grid;
  justify-items: start;
  align-content: space-between;
  gap: 18px;
  min-width: 0;
  min-height: 144px;
  padding: 16px;
  border: 1.5px solid var(--line);
  border-radius: 26px;
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  box-shadow: var(--shadow-lg);
  transition: transform .12s ease, border-color .2s ease, background-color .2s ease;
}
.cb:active:not(:disabled) {
  transform: scale(.97);
}
.cb:disabled {
  cursor: default;
}
.cb .ic {
  position: relative;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 17px;
  background: var(--ac-soft);
  color: var(--ac-ink);
  transition: background-color .2s ease, color .2s ease;
}
.cb.alt .ic {
  background: var(--teal-soft);
  color: var(--teal);
}
.cb .ic svg {
  width: 27px;
  height: 27px;
}
.cb b {
  display: block;
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 800;
  line-height: 1.1;
}
.cb small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
.cb.pend {
  border: 2px solid var(--ac);
  background: linear-gradient(var(--ac-soft), var(--ac-soft)), var(--surface);
}
.cb.alt.pend {
  border-color: var(--teal);
  background: linear-gradient(var(--teal-soft), var(--teal-soft)), var(--surface);
}
.cb.pend small {
  color: var(--ink);
  font-weight: 700;
}
.cb.pend .ic {
  background: var(--ac);
  color: var(--on-ac);
}
.cb.alt.pend .ic {
  background: var(--teal);
  color: var(--on-teal);
}
.cb.pend .ic::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 17px;
  border: 2px solid var(--ac);
  animation: ring 1.6s ease-out infinite;
}
.cb.alt.pend .ic::after {
  border-color: var(--teal);
}
@keyframes ring {
  0% { transform: scale(1); opacity: .9; }
  100% { transform: scale(1.55); opacity: 0; }
}
.cb.seen {
  border-color: var(--good);
}
.cb.seen .ic {
  background: var(--good-soft);
  color: var(--good);
}
.cb.seen small {
  color: var(--good);
  font-weight: 700;
}
.spinner {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid currentColor;
  border-right-color: transparent;
  animation: rot .8s linear infinite;
}
@keyframes rot {
  to { transform: rotate(360deg); }
}
.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 13px 15px;
  border-radius: 18px;
  background: var(--ac-soft);
  color: var(--ink);
  font-weight: 700;
  line-height: 1.35;
  animation: pop .3s ease both;
}
.banner svg {
  width: 21px;
  height: 21px;
}
.banner.ok {
  background: var(--good-soft);
  color: var(--good);
}
.banner.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
@keyframes pop {
  from { opacity: 0; transform: translateY(-4px); }
}

/* ---------- menü ---------- */
.qk {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 72px;
  margin-top: 14px;
  padding: 12px 16px 12px 12px;
  border-radius: 22px;
  background: var(--ink);
  color: var(--surface);
  font-weight: 800;
  text-decoration: none;
  box-shadow: var(--shadow);
  transition: transform .12s ease;
}
.qk:active {
  transform: scale(.98);
}
.qk .qi {
  width: 46px;
  height: 46px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: rgba(255, 255, 255, .14);
}
:root[data-theme="dark"] .qk .qi {
  background: rgba(0, 0, 0, .1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .qk .qi {
    background: rgba(0, 0, 0, .1);
  }
}
.qk .qi svg {
  width: 24px;
  height: 24px;
}
.qk .t {
  flex: 1;
  min-width: 0;
  display: grid;
  line-height: 1.2;
}
.qk .t b {
  font-family: var(--font-display);
  font-size: 18px;
}
.qk .t small {
  opacity: .72;
  font-size: 13px;
  font-weight: 600;
}
.qk .chev {
  width: 20px;
  height: 20px;
  opacity: .6;
}

/* ---------- kartlar ---------- */
.card {
  margin-top: 14px;
  padding: 18px;
  border-radius: 26px;
  border: 1.5px solid var(--line);
  background: var(--surface);
}
.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card-h h2 {
  font-size: 21px;
  font-weight: 800;
}
.card-h .hic {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--bg-2);
  color: var(--ink-2);
}
.card-h .hic svg {
  width: 20px;
  height: 20px;
}
.live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
}
.live i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--good);
  animation: blink 1.6s ease-in-out infinite;
}
.live.bad {
  color: var(--bad);
}
.live.bad i {
  background: var(--bad);
  animation: none;
}
@keyframes blink {
  50% { opacity: .3; }
}
.hint {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

/* wi-fi */
.wf {
  display: grid;
  gap: 10px;
}
.wf-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 12px 14px;
  border-radius: 18px;
  background: var(--bg-2);
}
.wf-row .grow {
  flex: 1;
  min-width: 0;
}
.wf-row .v {
  display: block;
  margin-top: 2px;
  font-size: 17px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.wf-row .v.pw {
  font-family: var(--font-mono);
  letter-spacing: .02em;
}
.cp {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 8px 14px;
  border: 1.5px solid var(--line-2);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
}
.cp svg {
  width: 17px;
  height: 17px;
}
.cp.ok {
  border-color: var(--good);
  color: var(--good);
}

/* hesap */
.it {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--line-2);
}
.it.new {
  animation: pop .35s ease both;
}
.it .q {
  min-width: 30px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
}
.it .n {
  flex: 1;
  min-width: 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.it .p {
  font-weight: 800;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
}
.tot b {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.tot.bump b {
  animation: bump .6s ease;
}
@keyframes bump {
  40% { color: var(--ac-ink); transform: scale(1.05); }
}
.note {
  margin-top: 12px;
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.45;
}
.empty {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 14px 8px 6px;
  color: var(--muted);
  text-align: center;
  line-height: 1.45;
}
.empty svg {
  width: 40px;
  height: 40px;
  color: var(--line-2);
}
.split-tg {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  margin-top: 14px;
  border: 1.5px solid var(--line-2);
  border-radius: 16px;
  background: transparent;
  color: var(--ink);
  font-weight: 800;
}
.split-tg[aria-expanded="true"] {
  background: var(--bg-2);
  border-color: var(--bg-2);
}
.split-tg svg {
  width: 20px;
  height: 20px;
}
.split {
  display: grid;
  gap: 14px;
  margin-top: 10px;
  padding: 14px;
  border-radius: 20px;
  background: var(--bg-2);
  animation: pop .25s ease both;
}
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  padding: 4px;
  border-radius: 15px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.seg button {
  min-height: 42px;
  padding: 4px 8px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
  font-size: 14.5px;
}
.seg button[aria-pressed="true"] {
  background: var(--ink);
  color: var(--surface);
}
.srow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.srow > span {
  font-weight: 700;
  color: var(--ink-2);
}
.stepper {
  flex: none;
  display: inline-flex;
  align-items: center;
  border-radius: 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
}
.stepper button {
  width: 46px;
  height: 46px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
}
.stepper button:disabled {
  opacity: .28;
  cursor: default;
}
.stepper output {
  min-width: 32px;
  text-align: center;
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.stepper.sm button {
  width: 40px;
  height: 40px;
  font-size: 20px;
}
.stepper.sm output {
  min-width: 24px;
  font-size: 17px;
}
.stepper.on {
  border-color: var(--ac);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  min-height: 42px;
  padding: 7px 15px;
  border: 1.5px solid var(--line-2);
  border-radius: 99px;
  background: var(--surface);
  color: var(--ink-2);
  font-weight: 800;
  font-size: 14px;
}
.chip[aria-pressed="true"] {
  background: var(--ac);
  border-color: var(--ac);
  color: var(--on-ac);
}
.picks {
  display: grid;
  border-radius: 16px;
  background: var(--surface);
  padding: 2px 12px;
}
.pick {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.pick:last-child {
  border-bottom: 0;
}
.pick .grow {
  flex: 1;
  min-width: 0;
  display: grid;
  line-height: 1.25;
}
.pick .grow b {
  font-weight: 700;
  overflow-wrap: anywhere;
}
.pick .grow span {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
}
.share {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 14px;
  border-radius: 18px;

/* renk */
function hexRgb(h){ return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgbHex(c){ return "#" + c.map(function(x){ x = Math.max(0, Math.min(255, Math.round(x))); return (x < 16 ? "0" : "") + x.toString(16); }).join(""); }
function lum(r, g, b){
  function f(c){ c = c / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function mixTo(c, to, k){ return [c[0] + (to[0] - c[0]) * k, c[1] + (to[1] - c[1]) * k, c[2] + (to[2] - c[2]) * k]; }
function applyBrand(){
  var b = S.brand || {}, st = document.documentElement.style;
  if(/^#[0-9a-fA-F]{6}$/.test(b.color || "")){
    var c = hexRgb(b.color), L = lum(c[0], c[1], c[2]);
    st.setProperty("--ac", b.color);
    st.setProperty("--ac-rgb", c.join(","));
    st.setProperty("--on-ac", L > 0.5 ? "#12231F" : "#FFFFFF");
    // Açık zeminde okunur koyu ton, koyu zeminde okunur açık ton
    var d = c, k = 0;
    while(lum(d[0], d[1], d[2]) > 0.12 && k < 1){ k += 0.05; d = mixTo(c, [0, 0, 0], k); }
    var l = c; k = 0;
    while(lum(l[0], l[1], l[2]) < 0.32 && k < 1){ k += 0.05; l = mixTo(c, [255, 255, 255], k); }
    st.setProperty("--ac-ink-l", rgbHex(d));
    st.setProperty("--ac-ink-d", rgbHex(l));
  }
  document.title = (b.name ? b.name + " · " : "") + t("table") + " " + S.D.no;
}

function copy(v, btn){
  function ok(){
    toast(t("copied"), "check");
    if(btn){
      btn.classList.add("ok");
      btn.innerHTML = ic("check") + esc(t("copied"));
      clearTimeout(btn._t);
      btn._t = setTimeout(function(){ btn.classList.remove("ok"); btn.innerHTML = ic("copy") + esc(t("copy")); }, 1800);
    }
  }
  function fallback(){
    var i = document.createElement("textarea");
    i.value = v; i.setAttribute("readonly", ""); i.style.position = "fixed"; i.style.opacity = "0";
    document.body.appendChild(i); i.select(); i.setSelectionRange(0, 999);
    try { document.execCommand("copy"); ok(); } catch(e){ prompt(t("copy") + ":", v); }
    document.body.removeChild(i);
  }
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(ok, fallback); return; }
  } catch(e){}
  fallback();
}

    var now = Date.now();
    if(this.calls.some(function(c){ return c.kind === k && !c.done; })) return { status: "already" };
    if(this.calls.some(function(c){ return c.kind === k && now - c.at < 20000; })) return { status: "wait" };
    var c = { kind: k, at: now, done: null };

    setTimeout(function(){ c.done = Date.now(); }, 6500);
    return { status: "ok" };
  }
};

function lastCall(kind){

  return l;
}
function callState(k){
  var c = lastCall(k);
  if(S.busy[k]) return { st: "busy" };
  if(c && !c.done) return { st: "pend", c: c };
  if(c && c.done && srvNow() - new Date(c.done).getTime() < 3 * 60000) return { st: "seen", c: c };
  return { st: "idle" };
}
function renderCalls(){

    btn.disabled = cs.st === "pend" || cs.st === "busy";

    if(s.textContent !== sub) s.textContent = sub;

}
function renderBanner(){
  var bn = $("bn");

  if(S.msg){ msg = S.msg; cls = S.msgCls; }
  else if(S.offline){ msg = t("bn_offline"); cls = "bad"; }
  else {
    var g = lastCall("garson"), hs = lastCall("hesap");
    var pend = [g, hs].filter(function(c){ return c && !c.done; });
    if(pend.length){
      msg = pend[pend.length - 1].kind === "hesap" ? t("bn_pend_h") : t("bn_pend_g");
    } else {
      var last = [g, hs].filter(Boolean).sort(function(a, b){ return new Date(b.done) - new Date(a.done); })[0];
      if(last && last.done && srvNow() - new Date(last.done).getTime() < 3 * 60000){ msg = t("bn_seen"); cls = "ok"; }
    }

function setMsg(m, cls, ms){

}
async function call(kind){
  if(S.busy[kind] || S.dead) return;
  var cs = callState(kind);
  if(cs.st === "pend") return;
  S.busy[kind] = true;
  setMsg(null);
  try {
    var r = await rpc("public_table_call", { p_token: token, p_kind: kind });
    var st = r && r.status;
    S.busy[kind] = false;
    if(st === "ok"){
      vibrate(30);
      if(S.D){ S.D.calls = (S.D.calls || []).concat([{ kind: kind, at: new Date(srvNow()).toISOString(), done: null }]); }
      renderCalls();
    }
    else if(st === "already") setMsg(t("bn_already"), "", 5000);
    else if(st === "wait") setMsg(t("bn_wait"), "bad", 5000);
    else if(st === "inactive") setMsg(t("bn_inactive"), "bad", 5000);
    else if(st === "not_found") setMsg(t("bn_nf"), "bad", 5000);
    else setMsg(t("bn_fail"), "bad", 5000);
    S.fastUntil = Date.now() + 3 * 60000;
    await load(true);
    loop();
  } catch(e){
    S.busy[kind] = false;
    setMsg(isNet(e) ? t("bn_net") : t("bn_fail"), "bad", 5000);
  }
}
function detectSeen(calls){
  var now = {};
  (calls || []).forEach(function(c){ now[c.kind + "|" + c.at] = c; });
  Object.keys(S.pendKeys).forEach(function(k){
    var c = now[k];
    if(c && c.done){
      toast(t(c.kind === "hesap" ? "t_seen_h" : "t_seen_g"), "check");
      vibrate([20, 60, 20]);
    }
  });
  S.pendKeys = {};
  (calls || []).forEach(function(c){ if(!c.done) S.pendKeys[c.kind + "|" + c.at] = 1; });
}

/* ---------------- yükleme + canlı takip ---------------- */
async function load(quiet){
  if(S.dead) return;
  try {
    var r = await rpc("public_table", { p_token: token });
    if(r.status === "not_found"){ simple(t("e_nf_t"), t("e_nf_p")); return; }
    if(r.status === "inactive"){ simple(r.name || t("e_in_t"), t("e_in_p")); return; }
    if(r.status !== "ok") throw new Error("status " + r.status);
    detectSeen(r.calls);
    S.D = r;
    S.brand = r.brand || {};
    if(r.now) S.skew = new Date(r.now).getTime() - Date.now();
    S.netBad = false;
    if(!S.built){ applyBrand(); build(); }
    renderBill();
    renderCalls();
  } catch(e){
    if(!S.built && !quiet) simple(t("e_t"), isNet(e) ? t("bn_net") : t("e_p"));
    else if(S.built){ S.netBad = true; renderLive(); }
  }
}
function stop(){ if(S.pollT){ clearTimeout(S.pollT); S.pollT = null; } }
function loop(){
  stop();
  if(S.dead) return;
  var ms = Date.now() < S.fastUntil ? 3000 : 8000;
  S.pollT = setTimeout(async function(){
    S.pollT = null;
    if(!document.hidden && S.built && !S.dead) await load(true);
    if(!S.pollT) loop();
  }, ms);
}

function cols(){
  var cs = getComputedStyle(document.documentElement);
  var ac = cs.getPropertyValue("--ac").trim() || "#E8612C";
  return [ac, "#24504C", "#F2C94C", "#2B6E63", "#F29B6B", "#12231F"];
}
function sliceCol(i, n, C){
  var c = C[i % C.length];
  if(i === n - 1 && n > 1 && i % C.length === 0) c = C[2];
  return c;
}
function textOn(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return "#fff";
  var c = hexRgb(hex);
  return lum(c[0], c[1], c[2]) > 0.45 ? "#12231F" : "#FFFFFF";
}
function loadNames(){

function drawWheel(){
  var c = $("wh");
  if(!c) return;
  var x = c.getContext("2d"), W = 600, R = 290, names = S.names, n = Math.max(names.length, 1);
  var cs = getComputedStyle(document.documentElement);
  var surf = cs.getPropertyValue("--surface").trim() || "#FFFDF8";
  var ink = cs.getPropertyValue("--ink").trim() || "#12231F";
  var bg2 = cs.getPropertyValue("--line").trim() || "#E4DACA";
  var line = cs.getPropertyValue("--line-2").trim() || "#D6CAB6";
  var C = cols();
  x.clearRect(0, 0, W, W);
  x.save();
  x.translate(W / 2, W / 2);
  x.rotate(S.rot);
  if(!names.length){
    for(var e = 0; e < 8; e++){
      var b0 = -Math.PI / 2 + e * Math.PI / 4;
      x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, b0, b0 + Math.PI / 4); x.closePath();
      x.fillStyle = e % 2 ? bg2 : surf; x.fill();
      x.strokeStyle = line; x.lineWidth = 2; x.stroke();
    }
  }
  for(var i = 0; i < names.length; i++){
    var a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n, col = sliceCol(i, n, C);
    x.beginPath(); x.moveTo(0, 0);
    if(n === 1) x.arc(0, 0, R, 0, 2 * Math.PI); else x.arc(0, 0, R, a0, a1);
    x.closePath();
    x.fillStyle = col; x.fill();
    if(n > 1){ x.strokeStyle = surf; x.lineWidth = 5; x.stroke(); }
    x.save();
    x.rotate((a0 + a1) / 2);
    x.fillStyle = textOn(col);
    x.font = "800 " + (n > 7 ? 27 : 31) + 'px "Bricolage Grotesque", "Instrument Sans", -apple-system, "Segoe UI", sans-serif';
    x.textAlign = "right";
    x.textBaseline = "middle";
    x.fillText(names[i], R - 26, 0);
    x.restore();
  }
  x.restore();
  x.beginPath(); x.arc(W / 2, W / 2, R, 0, 2 * Math.PI); x.lineWidth = 6; x.strokeStyle = surf; x.stroke();
  x.beginPath(); x.arc(W / 2, W / 2, 44, 0, 2 * Math.PI); x.fillStyle = surf; x.fill();
  x.lineWidth = 6; x.strokeStyle = ink; x.stroke();
  x.fillStyle = ink;
  x.font = '800 28px "Bricolage Grotesque", "Instrument Sans", -apple-system, sans-serif';
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(initials((S.brand && S.brand.name) || "Damgalio"), W / 2, W / 2 + 1);
}
function spin(){
  if(S.spinning) return;
  if(S.names.length < 2){ toast(t("need2")); var i = $("nm"); if(i) i.focus(); return; }
  S.spinning = true;
  $("spin").disabled = true;
  S.wres = "";
  $("res").textContent = "";
  $("res").className = "res";
  var n = S.names.length, win = Math.floor(Math.random() * n), seg = 2 * Math.PI / n;
  var off = (Math.random() * 0.7 + 0.15) * seg;
  var target = -(win * seg + off);
  var base = S.rot - (S.rot % (2 * Math.PI));
  var end = base + 2 * Math.PI * 6 + ((target % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  var start = S.rot, t0 = performance.now(), dur = REDUCED ? 500 : 4200, lastTick = 0;
  function f(now){
    var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    S.rot = start + (end - start) * e;
    drawWheel();
    var tick = Math.floor((S.rot - start) / seg);
    if(tick !== lastTick){ lastTick = tick; if(p < 0.85) vibrate(4); }
    if(p < 1){ requestAnimationFrame(f); return; }
    S.rot = S.rot % (2 * Math.PI);
    S.spinning = false;
    S.wres = S.names[win];
    $("spin").disabled = false;
    $("spin_l").textContent = t("spin2");
    var r = $("res");
    r.textContent = t("result", { n: S.wres });
    r.className = "res win";
    vibrate([30, 40, 30]);
    confetti();
  }
  requestAnimationFrame(f);
}
function confetti(){
  if(REDUCED) return;
  var C = cols().concat(["#FFFFFF"]), box = document.createElement("div"), h = "";
  box.className = "confetti";
  for(var i = 0; i < 70; i++){
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + C[i % C.length] +
      ';--dx:' + ((Math.random() - 0.5) * 160).toFixed(0) + 'px;--r:' + ((Math.random() - 0.5) * 1080).toFixed(0) +
      'deg;animation-delay:' + (Math.random() * 0.35).toFixed(2) + 's;animation-duration:' + (1.8 + Math.random() * 1.2).toFixed(2) + 's"></i>';
  }
  box.innerHTML = h;
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 3600);
}

function flip(){
  if(S.flipping) return;
  var coin = $("coin");
  if(!coin) return;
  S.flipping = true;
  $("flip").disabled = true;
  S.cres = "";
  $("cres").textContent = "";
  $("cres").className = "res";
  var tails = Math.random() < 0.5, from = S.coinDeg % 360, target = tails ? 180 : 0;
  var end = from + 1800 + ((target - from + 360) % 360), dur = REDUCED ? 80 : 1600;
  coin.classList.remove("flip");
  void coin.offsetWidth;
  coin.style.setProperty("--from", from + "deg");
  coin.style.setProperty("--mid", ((from + end) / 2) + "deg");
  coin.style.setProperty("--end", end + "deg");
  coin.classList.add("flip");
  setTimeout(function(){
    S.coinDeg = end % 360;
    coin.style.transform = "rotateY(" + S.coinDeg + "deg)";
    coin.classList.remove("flip");
    S.flipping = false;
    S.cres = tails ? "tails" : "heads";
    var b = $("flip");
    if(b){ b.disabled = false; b.textContent = t("flip2"); }
    var r = $("cres");
    if(r){ r.textContent = t(S.cres) + "!"; r.className = "res win"; }
    vibrate(25);
  }, dur + 40);
}
